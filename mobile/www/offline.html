<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ArtLink</title>
<style>
  html,body{margin:0;height:100%;background:#fff;color:#111827;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}
  main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 24px;text-align:center;box-sizing:border-box}
  .logo{font-size:34px;font-weight:700;letter-spacing:-0.025em;margin:0 0 28px}
  .logo span{color:#c4302b}
  p{margin:0 0 6px;font-size:16px;line-height:1.6}
  .sub{color:#6b7280;font-size:14px}
  button{margin-top:28px;min-height:48px;padding:0 28px;border:0;border-radius:8px;background:#111827;color:#fff;font-size:16px;font-weight:600}
</style>
</head>
<body>
<main>
  <div class="logo">Art<span>Link</span></div>
  <p>아트링크에 연결하지 못했어요.</p>
  <p class="sub">인터넷 연결을 확인한 뒤 다시 시도해 주세요.</p>
  <button id="retry" type="button">다시 시도</button>
</main>
<script>
  // 이 화면은 앱 안의 https://localhost/offline.html 이라 '/'로 가면 안 된다 — 서버 주소는 sync 뒤 scripts/post-sync.mjs 가 채운다
  var APP_URL = '__APP_URL__'.indexOf('http') === 0 ? '__APP_URL__' : 'https://artlink.cc';
  function retry(){ location.replace(APP_URL); }
  document.getElementById('retry').addEventListener('click', retry);
  window.addEventListener('online', retry);
</script>
</body>
</html>
