//   ③ 물듦(warm)     빛의 색이 화면 전체에 옅게 앉는다.
//
// ── FrameIt 실측에서 얻은 것 (`~/ArtLink/light/`, 분석은 scratchpad/vt/lightref.py) ──
//  · 강도를 올릴 때 일어나는 일의 **주역은 '밝아짐'이 아니라 '주변이 어두워짐'** 이다.

//    HDR·글로우가 되어 사용자가 금지한 그것이 된다.
//  · 조명은 벽뿐 아니라 **작품 픽셀에도 걸린다**(작품 ΔRGB / 벽 ΔRGB = 0.45~0.51, 전 강도 일정).
//    작품만 빼면 오려 붙인 티가 난다(CLAUDE.md 41 의 ΔRGB 주석과 같은 이야기).
//  · ⚠️ 다만 **FrameIt 은 강도 50%부터 작품을 망가뜨린다** — 작품 채도가 92.6 → 63.7(50%)
//    → 46.5(100%), 지역 대비 14.2 → 9.4. 홍보 이미지의 주인공은 작품이라 우리는 여기까지
//    따라가지 않는다. 우리 강도 100 은 FrameIt 의 30~40 쯤이고, 그 대신

//  · ⚠️⚠️ **작품/액자만 따로 밝히거나 지키면 안 된다.** 그 순간 경계에 마스크 테가 생긴다
//    (라운드 2~5 에서 반복해 확인한 함정). 그래서 이 함수는 **합성이 다 끝난 화면 전체**에
//    연속 그라디언트로만 건다 — 조각 사각형을 참조하는 건 웅덩이의 위치·크기뿐이다.
// ⚠️ **조각이 화면의 44% 를 차지한다**(라운드 3에서 그렇게 키웠다). 즉 조명이 일할 수 있는
//    벽이 얼마 안 남는다 — 낙차의 안쪽 반경을 넉넉히 잡으면 화면 밖으로 나가 아무 일도

//    정확히 그 반경에 있으므로 작품은 사실상 통째로 보호되고, 어두워지는 건 대각선 방향의

//    올리므로 그림이 제일 심하게 뜬다. 게다가 그게 곧 사용자가 금지한 글로우/HDR 이다.
//    '빛이 있다'는 인상은 **상대 대비**로 충분히 만들어진다 — 하이라이트를 노출에 맞춘
//    사진이 정확히 그런 모습이다. 그래서 필드는 곱연산 하나뿐이고, 최댓값이 1(무변화)이다.

const LIGHT_FALLBACK={r:255,g:243,b:222};
function sceneLightColor(sc){

    px.sort((a,b)=>b[3]-a[3]);
    const k=Math.max(1,Math.round(px.length*0.10));   // 가장 밝은 10%
    let r=0,g=0,b=0; for(let i=0;i<k;i++){ r+=px[i][0]; g+=px[i][1]; b+=px[i][2]; }
    r/=k; g/=k; b/=k;
    // 밝은 쪽 색은 거의 흰색에 수렴한다 — 색기만 뽑아 쓰려고 채도를 키운다.
    const m=(r+g+b)/3||1, K=2.1;
    col={ r:Math.round(Math.min(255,m+(r-m)*K)),
          g:Math.round(Math.min(255,m+(g-m)*K)),
          b:Math.round(Math.min(255,m+(b-m)*K)) };
  }catch(e){ /* 크로스오리진 등 — 폴백 */ }
  sc._lightCol=col;
  return col;
}
// art = 조각(액자 포함) 사각형 {x,y,fw,fh} — 합성 좌표. ld = 광원 방향(빛이 오는 쪽).
function applyStudioLight(ctx,W,H,s,art,ld,col){
  if(!(s>0) || !art) return;
  s=Math.max(0,Math.min(1,s));
  const c=col||LIGHT_FALLBACK;
  const px=art.x+art.fw/2, py=art.y+art.fh/2;
  const pr=Math.hypot(art.fw,art.fh)/2 || Math.min(W,H)*0.3;
  const n=Math.hypot(ld[0],ld[1])||1, ux=ld[0]/n, uy=ld[1]/n;
  const S=LIGHT_SHADE;
  const corner=(cx,cy)=>Math.max(
    Math.hypot(cx,cy), Math.hypot(W-cx,cy), Math.hypot(cx,H-cy), Math.hypot(W-cx,H-cy));
  ctx.save();
  ctx.globalCompositeOperation='multiply';
  // ① 낙차 — 광원에서 멀수록 어둡게. **조명의 주역이자 전부다**(FrameIt 실측: 강도를
  //    올릴 때 화면 평균이 −58 레벨, 즉 밝아지는 게 아니라 주변이 어두워진다).
  //    안쪽 반경 안은 정확히 1배 — 마스크가 아니라 **기하**로 작품을 보호하므로 경계가 없다.
  {
    const fx=px+ux*pr*LIGHT.off, fy=py+uy*pr*LIGHT.off;
    const a=LIGHT.fall*s;
    const sh=(al)=>`rgba(${S.r},${S.g},${S.b},${al.toFixed(4)})`;
    // 빛의 축으로 늘인 **타원**. 원으로 두면 아무리 편심을 줘도 '비네트'로 읽힌다 —
    // 빔은 광원에서 조각으로 이어지는 밝은 복도가 있고 그 양옆이 급히 어두워진다.
    // ⚠️ 좌표계를 돌린 채 그라디언트를 만들 것(그라디언트는 유저 좌표라 같이 변환된다).
    // ⚠️⚠️ **반경을 늘인 좌표계에서 다시 계산할 것.** 변환만 걸고 반경을 그대로 뒀더니
    //    화면 구석이 그라디언트의 끝에 도달하지 못해 **어두워짐이 0.67 → 0.95 로 사라졌다**
    //    (실측). 늘인 좌표계에서 축방향 거리는 1/k 이 되므로 그만큼 다시 재야 한다.
    const k=LIGHT.aniso, ang=Math.atan2(uy,ux);
    const rad=(x,y)=>{ const dx=x-fx, dy=y-fy;
      return Math.hypot((dx*ux+dy*uy)/k, -dx*uy+dy*ux); };
    const far=Math.max(rad(0,0),rad(W,0),rad(0,H),rad(W,H));
    // 안쪽 반경은 **조각 네 귀퉁이**가 다 들어가도록 — 그래야 작품이 통째로 배율 1 이다
    const r0=Math.min(LIGHT.reach*Math.max(
      rad(art.x,art.y), rad(art.x+art.fw,art.y),
      rad(art.x,art.y+art.fh), rad(art.x+art.fw,art.y+art.fh)), far*0.80);
    ctx.save();
    ctx.translate(fx,fy); ctx.rotate(ang); ctx.scale(k,1); ctx.rotate(-ang); ctx.translate(-fx,-fy);
    const g=ctx.createRadialGradient(fx,fy,r0,fx,fy,far);
    // ⚠️ 곱연산 그라디언트의 **끝 색은 어두워야 한다.** 처음엔 rgb(232,236,255) 같은 밝은
    //    색을 적어 놓고 어두워지길 기대했는데, 곱연산은 `base·(1−a(1−C))` 라 밝은 C 는
    //    아무 일도 하지 않는다(실측 구석 배율 1.00 — 조명이 통째로 무효였다).
    g.addColorStop(0,'rgba(255,255,255,0)');
    g.addColorStop(0.35,sh(a*0.16));
    g.addColorStop(0.70,sh(a*0.60));
    g.addColorStop(1,sh(a));
    ctx.fillStyle=g; ctx.fillRect(-W*k,-H*k,W*k*3,H*k*3);
    ctx.restore();
  }
  // ①-b 빛자국 — 빛이 **벽에** 닿은 자리. 유일하게 밝히는 항이라 두 가지를 지킨다.
  //    ⚠️ 조각 **바깥**에만 놓는다. 조각이 화면의 44% 라 조금만 안쪽으로 들어와도
  //       그림 위에 얹혀 작품이 뜬다(첫 구현 실측: 작품 +76%).
  //       그래서 중심을 반반경(대각선)이 아니라 **조각의 변**을 기준으로 잡는다.
  //    ⚠️ 알파를 키우면 그게 곧 글로우/HDR 이다. 벽 밝기 몇 % 수준으로만.
  {
    const half=Math.max(1,Math.min(art.fw,art.fh)/2);
    const t=half*(1+LIGHT.spillOff);
    const lx=px+ux*t, ly=py+uy*t;
    const r=Math.max(art.fw,art.fh)*LIGHT.spillR;
    const g=ctx.createRadialGradient(lx,ly,0,lx,ly,r);
    const a=LIGHT.spill*s;
    g.addColorStop(0,`rgba(${c.r},${c.g},${c.b},${a.toFixed(4)})`);
    g.addColorStop(0.5,`rgba(${c.r},${c.g},${c.b},${(a*0.42).toFixed(4)})`);
    g.addColorStop(1,`rgba(${c.r},${c.g},${c.b},0)`);
    ctx.globalCompositeOperation='screen';
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    ctx.globalCompositeOperation='multiply';
  }
  // ② 물듦 — 빛의 색이 화면 전체에 옅게. **균일**하므로 경계가 생길 수 없고,
  //    작품·액자·벽이 같은 색온도를 공유하게 만든다(라운드 3 브리핑 G 항).
  //    빛이 따뜻하면 따뜻하게, 차가우면 차갑게 — 색은 이 장면 사진에서 뽑은 것을 쓴다.
  {
    const t=LIGHT.warm*s;
    // 빛 색의 **색기만** 뽑는다 — 가장 밝은 채널을 255 로 올려 밝기를 빼고 hue 만 남긴다.
    // 그 다음 흰색 쪽으로 (1−t) 만큼 되돌린다. t=0 이면 순백(무변화).
    // ⚠️ 편차에 상한(TINT_MAX)을 둘 것 — 장면 사진이 유난히 색이 진하면 화면이 통째로
    //    물들어 **작품 색이 바뀐다**. 여기는 색온도를 맞추는 자리지 컬러 그레이딩이 아니다.
    const mx=Math.max(c.r,c.g,c.b)||255, TINT_MAX=30;
    const dv=(v)=>Math.min(TINT_MAX,255-v*255/mx);
    const mix=(v)=>Math.round(255-dv(v)*t);
    ctx.fillStyle=`rgb(${mix(c.r)},${mix(c.g)},${mix(c.b)})`;
    ctx.fillRect(0,0,W,H);
  }
  ctx.restore();
}

// 캔버스 직조(weave) 텍스처 — 작품 표면 질감
let _weaveSrc=null;
function weaveSrc(){ if(_weaveSrc) return _weaveSrc;
  const c=document.createElement('canvas'); c.width=c.height=72;
  const x=c.getContext('2d'); const id=x.createImageData(72,72); const rnd=prng(77);
  for(let py=0;py<72;py++) for(let px=0;px<72;px++){
    const v=225 + 14*Math.sin(px*1.55) + 14*Math.sin(py*1.55)
            + 8*Math.sin((px+py)*.5) + (rnd()-.5)*10;
    const i=(py*72+px)*4;
    id.data[i]=id.data[i+1]=id.data[i+2]=Math.max(190,Math.min(255,v)); id.data[i+3]=255;
  }
  x.putImageData(id,0,0); _weaveSrc=c; return c; }
function applyWeave(ctx,x,y,w,h){
  ctx.save(); ctx.beginPath(); ctx.rect(x,y,w,h); ctx.clip();
  ctx.globalCompositeOperation='multiply'; ctx.globalAlpha=.50;
  ctx.fillStyle=ctx.createPattern(weaveSrc(),'repeat'); ctx.fillRect(x,y,w,h);
  ctx.globalCompositeOperation='screen'; ctx.globalAlpha=.10;
  ctx.fillRect(x,y,w,h);
  ctx.restore(); }

// ---- 비율 ----
// '원본'(작품 비율 그대로)은 없앴다 — 이 도구의 결과물은 SNS 홍보 이미지고,
// 그쪽은 1:1 이 기본이다. 작품 비율은 액자 안에서 이미 지켜진다(자르지 않는다).
const RATIOS=[
  {id:'1:1',name:'1:1'}, {id:'4:5',name:'4:5'},
  {id:'3:4',name:'3:4'}, {id:'16:9',name:'16:9'}, {id:'9:16',name:'9:16'},
];
const LONG=2600; // 출력 해상도 상한 (화면에 늘려 표시돼도 또렷하게)
// 장면 모드 출력 크기 — 원본의 1/SCENE_HEADROOM. 남긴 여유가 곧 **자동 프레이밍의
// 확대 한도**다(작을수록 액자를 크게 잡을 수 있지만 결과물이 작아진다). 2600px 벽 → 1625px.
const SCENE_HEADROOM=1.6, SCENE_MIN_LONG=1080;
// ⚠️ **합성은 출력보다 크게 하고, 줄이는 건 맨 마지막 한 번뿐**(2026-08-30 4차).
//    마스크·그림자·워프·워터마크를 전부 SUPERSAMPLE 배로 계산한 뒤 한 번에 내린다.
//    벽 화질은 그대로다(확대 한도를 같이 곱해 주므로 최종 배율이 변하지 않는다) —
//    달라지는 건 **액자 모서리와 그림자 계조**로, 표본이 2.5배 늘어 계단이 사라진다.
//    상한(STAGE_MAX)은 메모리 때문이다. 4096² 이면 캔버스 하나가 64MB 다.
const SUPERSAMPLE=2.0, STAGE_MAX=4096;
let _stage=null;
function stageCanvas(w,h){
  if(!_stage) _stage=document.createElement('canvas');
  if(_stage.width!==w||_stage.height!==h){ _stage.width=w; _stage.height=h; }
  else _stage.getContext('2d').clearRect(0,0,w,h);
  return _stage;
}
// ⚠️ 장면 모드는 **배경 사진을 원본 이상으로 늘리지 않는다.**
// 1254px 사진을 2600px 로 뽑으면 2.1배 확대라 벽 질감이 뭉개진다('확대하면 깨진다'의 원인).
// 인스타 권장이 1080 이라 1254 로도 충분하다. 장면 사진이 커지면 그만큼 따라 올라간다.
function targetDims(ratio,longSide){
  const L=longSide||LONG;
  const [a,b]=ratio.split(':').map(Number);
  return a>=b? {W:L,H:Math.round(L*b/a)} : {W:Math.round(L*a/b),H:L};
}

//  최종 합성

let lastArt=null; // 마지막 렌더의 액자 위치 (드래그 히트테스트)
let lastFitNote=null;  // 장면 모드에서 실치수가 맞았는지 (화면에 알려준다)
let lastRegionPx=null; // 장면 영역의 화면 크기 (드래그 단위 환산용)

// 작품 크기 문자열 → [가로cm, 세로cm]. 파서는 scene.js 에 있다(테스트가 그걸 검사한다).
function artCmOf(w){
  if(!w || !window.ArtLookScene) return null;
  return ArtLookScene.parseSizeCm(w.sizeText || w.size);
}

// 계측 훅 — 조각(액자 포함)과 작품 자체의 출력 사각형을 픽셀로 알려준다.
// 화질 회귀 하니스가 쓴다. 렌더 결과에는 영향이 없다.
function artlookProbe(placed, framed, ss){
  // ⚠️ **실루엣은 앞면만이 아니다.** 두께가 있으면(캔버스랩) 뒷면·옆면이 오른쪽·아래로
  //    더 나간다. 앞면만 재면 조각 바깥 8px 이 '벽'으로 잡혀, 멀쩡한 렌더가 검은 테를
  //    가진 것처럼 측정된다(2026-08-30 t07 실측 40.4 → 실제로는 결함 없음).
  const q=[].concat(placed.quad||[], placed.hitQuad||[]);
  const xs=q.map(p=>p[0]), ys=q.map(p=>p[1]);
  const px=Math.min(...xs), py=Math.min(...ys);
  const pw=Math.max(...xs)-px, ph=Math.max(...ys)-py;
  // 작품 사각형은 **앞면 quad** 기준으로 환산한다 — 실루엣(뒷면 포함)으로 나누면
  // 두께가 있는 조각에서 배율이 틀어져 비율이 어긋난 것처럼 측정된다.
  const f=placed.hitQuad||placed.quad;
  const fx=f.map(p=>p[0]), fy=f.map(p=>p[1]);
  const ox=Math.min(...fx), oy=Math.min(...fy);
  const k=(Math.max(...fx)-ox)/Math.max(1,framed.width);
  const ky=(Math.max(...fy)-oy)/Math.max(1,framed.height);
  const g=lastFrameLayout;                                 // 액자 안에서 작품이 앉은 자리
  const S=ss>0?ss:1, sc=(r)=>({x:r.x/S,y:r.y/S,w:r.w/S,h:r.h/S});
  return {
    // ⚠️ 전부 **출력 좌표**다 — 합성은 SS 배에서 했지만 회귀 하니스는 저장된 PNG 를 잰다
    ss:S,
    piece:sc({x:px,y:py,w:pw,h:ph}),
    // ⚠️ **그림자를 던지는 건 벽에 닿은 뒷면**이다. 두께가 있는 조각(캔버스 랩)에서
    //    실루엣(piece = 앞면∪뒷면)으로 그림자를 재면 좌우가 **기하 때문에** 비대칭이
    //    되어(뒷면이 왼쪽으로 더 나가므로 왼쪽만 그림자가 삐져나온다) 광원이 바로 위인데도
    //    '왼쪽에서 온다'로 측정된다(2026-09-01 실측: 왼 217.5 / 오 225.4, cos 0.32).
    //    하니스가 그림자 방향을 잴 때는 이걸 쓴다.
    back:(()=>{ const q=placed.quad||[]; if(!q.length) return null;
      const bx=q.map(p=>p[0]), by=q.map(p=>p[1]);
      return sc({x:Math.min(...bx),y:Math.min(...by),
                 w:Math.max(...bx)-Math.min(...bx),h:Math.max(...by)-Math.min(...by)}); })(),
    // ⚠️ 살 폭의 좌우·상하 대칭은 **앞면**으로 재야 한다. 실루엣(piece)은 두께가 있는
    //    조각에서 뒷면까지 포함하므로, 그걸로 재면 캔버스랩이 늘 '비뚤어진' 것으로 나온다.
    front:sc({x:ox,y:oy,w:Math.max(...fx)-ox,h:Math.max(...fy)-oy}),
    art:sc(g? {x:ox+g.x*k, y:oy+g.y*ky, w:g.w*k, h:g.h*ky} : {x:ox,y:oy,w:pw,h:ph}),
    railPx:(g? g.rail*k:0)/S, matPx:(g? g.mat*k:0)/S,
    framedWH:[framed.width,framed.height], srcWH:[state.img.width,state.img.height],
  };
}

// ============================================================
//  개발자 디버그 훅 — 마스크·그림자 레이어 추출 (?debug=1 에서만 노출)
// ============================================================
// 브리핑 요구: "outer frame / inner opening / bevel / artwork / contact shadow /
// cast shadow 를 시각화할 수 있는 debug output". 화면 동작에는 아무 영향이 없고,
// 마스크는 **렌더와 같은 quad·같은 워프**를 통과하므로 그림과 정확히 겹친다.
//   window.__artlookDebug({wallCalm:0, frameArea:0.21})  → 옵션을 덮어써 BEFORE 도 뽑는다
let _dbg=null;
function installDebugHook(){
  if(!/[?&]debug=1/.test(location.search)) return;
  window.__artlookDebug=function(override){
    _dbg={ override: override||{}, out:null };
    try{ render(); }finally{ const r=_dbg; _dbg=null; render(); return r.out; }
  };
}

function compose(){
  if(!state.img) return null;
  // 액자를 **그 장면의 광원**으로 비춘다.
  // ⚠️ 날것의 `scene.lightDir` 을 쓰지 말 것 — 15개 중 6개가 근거 없이 손으로 적은
  //    `[-1,-1]` 이다(실측 벽 낙차 0.0~4.5 = 방향 정보 없음). `sceneLightModel` 이
  //    신뢰도를 재서 **모르는 가로 성분을 0 으로 수렴**시킨다(브리핑 CONFIDENCE-AWARE).
  state.lightDir = (state.mode==='scene' && SCENES[state.sceneIdx] && window.ArtLookScene)
    ? ArtLookScene.sceneLightModel(SCENES[state.sceneIdx]).dir
    : [-0.7071,-0.7071];
  // ⚠️⚠️ **판은 화면에서 자기가 몇 px 로 보일지 알아야 한다.** 리베이트 깊이를 해상도로
  //    조절하는데(아래 `kd`), 그 판정이 여태 **판 좌표**로 이뤄져 실화면과 무관했다.
  //    실측(2026-09-01): 오크의 판 살은 55px 이라 늘 '충분히 넓다'로 판정됐지만, 실내
  //    장면(maxLong 0.49)에서 실제로 그려지는 살은 **20px** 이고 리베이트 구간은 5px 다.
  //    그 5px 에 온전한 깊이의 V 를 넣으니 '파인 자리'가 아니라 **그어 놓은 선**이 됐다
  //    (사용자 지적). 그래서 출력 크기를 먼저 구해 판에 넘긴다.
  const sceneNow = state.mode==='scene' ? SCENES[state.sceneIdx] : null;
  const longSide = (sceneNow && sceneNow.loaded)
    ? Math.min(LONG, Math.max(SCENE_MIN_LONG,
        Math.round(Math.max(sceneNow.img.naturalWidth, sceneNow.img.naturalHeight) / SCENE_HEADROOM)))
    : LONG;
  const {W:OW,H:OH}=targetDims(state.ratio,longSide);
  // 조각의 화면 긴 변 추정 = 그 장면의 상한(44c). 자동 프레이밍이 거의 늘 이 천장에
  // 붙으므로(실측 오크 44px ↔ 추정 44) 한 번의 곱셈으로 충분하다 — 판을 두 번 만들지 않는다.
  state.outLongEst = Math.max(OW,OH) * (sceneNow
    ? (sceneNow.maxLong==null ? 0.70 : sceneNow.maxLong) : 0.70);
  const framed=buildFramed(state.img);
  // 장면 모드는 배경 사진의 원본 해상도를 상한으로 삼는다(위 targetDims 주석 참고).
  // ⚠️ **원본 크기 그대로 뽑으면 카메라를 당길 여지가 사라진다** (2026-08-30 실측).
  //    자동 프레이밍은 `zoom × (출력/원본) ≤ 1.15` 안에서만 확대할 수 있는데, 출력을
  //    원본과 같게 두면 그 비가 1 이라 **확대 한도가 1.15배**뿐이었다. 그래서 액자가
  //    화면의 16% 에서 더 커지지 못했다(FrameIt Pro 는 44%).
  //    출력을 원본의 1/1.6 로 잡으면 같은 화질 보증(1.15배 이내) 아래서 1.84배까지 당긴다.
  //    SNS 홍보 이미지라 1080~1650px 이면 충분하다.
  const out=document.getElementById('preview');
  out.width=OW; out.height=OH;
  // 합성은 여기서 — 출력보다 크게 잡고 맨 마지막에 한 번만 줄인다(SUPERSAMPLE 주석 참고)
  // `state.draft` — 끌기·두 손가락·휠·조명 막대를 움직이는 **동안만** 합성 배율을 1로 둔다(픽셀 4분의 1 — 손가락을 따라온다).
  //   손을 떼면 ui.js 가 원래 배율로 한 번 더 그린다. 기하는 배율과 무관하다(아래 maxSrcScale·grainScale 이 SS 를 곱해 넘긴다).
  //   ⚠️ 저장은 늘 원래 배율로 — ui.js 의 저장이 draft 를 끄고 다시 그린 뒤 내보낸다.
  const SS=state.draft ? 1 : Math.max(1, Math.min(SUPERSAMPLE, STAGE_MAX/Math.max(OW,OH)));
  const W=Math.round(OW*SS), H=Math.round(OH*SS);
  const ctx=stageCanvas(W,H).getContext('2d');
  ctx.clearRect(0,0,W,H);
  // 최종 축소는 **한 번**. 여기가 유일한 리샘플 지점이다.
  const finish=()=>{
    const p=out.getContext('2d');
    p.imageSmoothingEnabled=true; p.imageSmoothingQuality='high';
    p.clearRect(0,0,OW,OH);
    p.drawImage(_stage,0,0,W,H,0,0,OW,OH);
    return out;
  };
  const toOut=(r)=>r&&{x:r.x/SS,y:r.y/SS,fw:r.fw/SS,fh:r.fh/SS};

  // ── 장면(프리미엄) — 실사 공간에 원근을 맞춰 끼운다 (scene.js) ──────────────
  // 예전 방식과 근본적으로 다른 점: 액자를 그리지 않고 **사진에 있는 액자 구멍**에
  // 원본을 워프해 넣고, 벽 명암·구운 그림자·전경 가림을 덮는다.
  if(state.mode==='scene'){
    const sc=SCENES[state.sceneIdx];
    if(!sc || !sc.loaded){
      ctx.fillStyle='#eceae4'; ctx.fillRect(0,0,W,H);
      ctx.fillStyle='#9a958b'; ctx.font=`${Math.round(W*.03)}px sans-serif`; ctx.textAlign='center';
      ctx.fillText('장면 로딩중…', W/2, H/2);
      return finish();
    }
    // ⚠️ **액자째로 장면 엔진에 통과시킨다.**
    // 예전엔 액자를 다 그린 뒤 벽 위에 그냥 얹었다. 그러면 액자는 늘 좌상단 고정광으로
    // 칠해진 채라 어둡고 따뜻한 방에서 **혼자 노랗게 떠서 스티커처럼 보였다**(실측 비교).
    // 판(insert)에 액자를 포함시키면 액자도 벽 명암·방 색·그레인·원근을 함께 받는다.
    // 사진에 이미 액자가 있는 장면(opening)에는 우리 액자를 겹치지 않는다.
    const useFramed = !!sc.frameless;
    const piece = useFramed ? framed : state.img;
    // ⚠️ **액자에는 3D 옆면을 만들지 않는다.** 액자는 거의 정면으로 보이고 측면은 솔질한
    //    나무 한 줄이라, 가장자리 픽셀을 문질러 옆면을 만들면 **액자 옆에 그림이 번져 나온다**
    //    (2026-08-30 신고, 경쟁사도 액자는 정면 + 그림자만 쓴다).
    //    두께감은 액자 자신의 단면 명암과 그림자가 만든다.
    //    캔버스 랩(액자 없음)만 옆면이 실제로 보이므로 그때만 만든다.
    const isCanvasWrap = (FRAMES[state.frameIdx]||{}).kind==='canvas';
    // 실치수는 '작품' 기준인데 판은 액자를 포함하므로, 액자 테두리만큼 키워 환산한다
    let cm = artCmOf(selectedWork);
    if(cm && useFramed && state.img.width && state.img.height){
      cm = [cm[0]*framed.width/state.img.width, cm[1]*framed.height/state.img.height];
    }
    const placed=ArtLookScene.composeScene(ctx,W,H,sc,piece,{
      artCm: cm,                             // 작품 크기를 알면 벽에서 차지하는 크기에 반영된다
      scale: sc.adj ? sc.adj.s : 1,
      dx: sc.adj ? sc.adj.dx : 0,
      dy: sc.adj ? sc.adj.dy : 0,
      // 액자를 통과시킬 땐 매트·캔버스결을 다시 입히지 않는다 — 액자가 이미 갖고 있다
      mat: useFramed ? 0 : undefined,
      canvasTexture: !useFramed,
      // 판 가장자리 폐색은 **사진에 액자 구멍이 있는 장면에서만**. 판이 액자까지 포함한
      // 조각일 때 걸면 액자 바깥 테두리가 어두워져 잘라 붙인 티가 난다.
      innerShadow: sc.opening ? undefined : 0,
      depth: isCanvasWrap ? undefined : 0,     // 액자는 옆면 없이 정면 + 그림자
      // ⚠️ **확대 한도는 '최종 출력' 기준이어야 한다.** 합성이 SS 배 크기라 그대로 두면
      //    한도가 SS 배만큼 빡빡해져 액자가 다시 작아진다. SS 를 곱해 최종 배율을 고정한다
      //    (zoom × 합성W/원본 ≤ 1.15·SS  ⇔  zoom × 출력W/원본 ≤ 1.15).
      maxSrcScale: 1.15*SS,
      // 그레인은 합성 픽셀 단위 잡음이라 축소하면 그만큼 옅어진다 — SS 를 곱해 상쇄한다
      grainScale: SS,
      // 폴백 사다리 — 장면 쪽에서 끌 수 있는 것들(위 LEVEL 주석 참고)
      ...(LEVEL<1 ? {shadow:0, cornerAO:0, wallCalm:0, wallAmt:0} : null),
      ...(LEVEL<2 ? {cornerAO:0} : null),
      debug: !!_dbg,
      maskPlate: _dbg ? buildMaskPlate(framed) : null,
      ...(_dbg ? _dbg.override : null),
    });
    lastArt=null;
    let stageArt=null;
    if(placed && placed.quad){
      // 드래그 히트테스트는 **눈에 보이는 앞면** 기준(두께만큼 어긋나면 손이 헛간다)
      const hq=placed.hitQuad||placed.quad;
      const xs=hq.map(p=>p[0]), ys=hq.map(p=>p[1]);
      // 조명은 **합성 좌표**에서 걸어야 한다(출력 좌표로 주면 SS 배만큼 빗나간다)
      stageArt={x:Math.min(...xs),y:Math.min(...ys),
        fw:Math.max(...xs)-Math.min(...xs),fh:Math.max(...ys)-Math.min(...ys)};
      // ⚠️ 합성은 SS 배 크기에서 했으므로 **출력 좌표로 되돌려** 넘긴다 —
      //    안 그러면 드래그 판정이 SS 배만큼 어긋나 손이 헛간다.
      lastArt=toOut({x:Math.min(...xs),y:Math.min(...ys),fw:Math.max(...xs)-Math.min(...xs),fh:Math.max(...ys)-Math.min(...ys)});
    }
    lastFitNote = placed ? placed.fitNote : null;
    lastRegionPx = placed && placed.regionPx
      ? {w:placed.regionPx.w/SS, h:placed.regionPx.h/SS} : null;
    // 계측 훅 — 화질 회귀 하니스(scratchpad/vt)가 **조각/작품의 정확한 사각형**을 읽는다.
    // 목업에서 다시 검출하면 그림자·벽무늬 때문에 십수 px 씩 어긋나 측정이 못 쓰게 된다.
    // 그리기에는 아무 영향이 없다.
    window.__artlook = placed ? artlookProbe(placed, framed, SS) : null;
    // 조명 — **합성이 다 끝난 뒤 화면 전체에.** 조각만 따로 밝히면 그 경계가 마스크 테가 된다.
    // 방향은 이 장면의 측정된 광원(`scenes.json` lightDir), 색은 이 사진의 밝은 쪽 색.
    applyStudioLight(ctx,W,H,state.light,stageArt,state.lightDir,sceneLightColor(sc));
    // 조명·비네트 **변조만** 따로 뽑는다 — 중간 회색 판에 같은 코드를 걸면
    // '무엇이 어디서 얼마나 어두워지는가'가 그대로 그림이 된다(브리핑 9번 lighting modulation).
    let lightLayer=null;
    if(_dbg){
      lightLayer=document.createElement('canvas'); lightLayer.width=W; lightLayer.height=H;
      const lx=lightLayer.getContext('2d');
      lx.fillStyle='#808080'; lx.fillRect(0,0,W,H);
      applyStudioLight(lx,W,H,state.light,stageArt,state.lightDir,sceneLightColor(sc));
      sceneVignette(lx,W,H);
    }
    drawWatermark(ctx,W,H);
    sceneVignette(ctx,W,H);
    const done=finish();
    if(_dbg && placed && placed.debug){
      const png=(c)=>c? c.toDataURL('image/png') : null;
      _dbg.out={
        final: done.toDataURL('image/png'),
        masks: png(placed.debug.masks),
        shadow: Object.fromEntries(Object.entries(placed.debug.shadow||{}).map(([k,v])=>[k,png(v)])),
        light: png(lightLayer),
        maskColors: MASK_COLORS,
        // 끄고 켜 볼 수 있는 것들 — `__artlookDebug({shadow:0})` 처럼 넘긴다.
        // 어떤 효과가 '합성 느낌'을 만드는지 하나씩 빼 보라고 두는 목록이다.
        toggles: ['shadow','cornerAO','wallCalm','wallAmt','innerShadow','glass',
                  'mat','depth','autoFrame','frameArea','minArea','grainScale','supersample'],
        // 쿼리로만 되는 것들 — 페이지를 다시 열어야 한다(모듈 상수라 런타임 변경 불가)
        query: {level:LEVEL, syn:SYN_EDGE, syndir:SYN_DIR},
        // 이 렌더가 실제로 쓴 광원과 그 **신뢰도**, 그리고 액자 자산이 이미 갖고 있던 조명.
        // 브리핑 CONFIDENCE-AWARE / SOURCE-ASSET LIGHTING PROTECTION 을 눈으로 확인하는 자리.
        lightModel: (()=>{ const m=window.ArtLookScene && ArtLookScene.sceneLightModel(sc);
          const a=assetLightOf(FRAMES[state.frameIdx]);
          return { dir:state.lightDir, conf:m?+m.conf.toFixed(3):null,
                   grad:m?+m.grad.toFixed(1):null, wallLum:m?+m.wallLum.toFixed(3):null,
                   assetTB:+a.tb.toFixed(3), assetLR:+a.lr.toFixed(3),
                   assetModeled:+(a.modeled||0).toFixed(2) }; })(),
        geom: window.__artlook, ss:SS, canvas:[OW,OH],
      };
    }
    return done;
  }

  if(state.mode==='wall'){
    const wall=WALLS[state.wallIdx];
    if(!wall.loaded){
      ctx.fillStyle='#eceae4'; ctx.fillRect(0,0,W,H);
      ctx.fillStyle='#9a958b'; ctx.font=`${Math.round(W*.03)}px sans-serif`; ctx.textAlign='center';
      ctx.fillText('벽 사진 로딩중…', W/2, H/2);
      return finish();
    }
    const iw=wall.img.naturalWidth, ih=wall.img.naturalHeight;
    // 액자 중심 cover-크롭: 어떤 출력 비율에서도 배치 영역이 화면에 들어오게
    const a=wall.art;
    const sc=Math.max(W/iw, H/ih);
    let dx=W*.5 - a.cx*iw*sc;
    let dy=H*.45 - a.cy*ih*sc;
    dx=Math.min(0, Math.max(W-iw*sc, dx));
    dy=Math.min(0, Math.max(H-ih*sc, dy));
    ctx.drawImage(wall.img, dx, dy, iw*sc, ih*sc);
    // 배치 박스 매핑 (이미지 비율 좌표 → 캔버스) + 사용자 조정(드래그/휠)
    const adj=wall.adj;
    const bx=dx+(a.cx-a.w/2)*iw*sc, by=dy+(a.cy-a.h/2)*ih*sc;
    const bw=a.w*iw*sc, bh=a.h*ih*sc;
    const s=Math.min(bw/framed.width, bh/framed.height)*adj.s;
    const fw=framed.width*s, fh=framed.height*s;
    let x=bx+(bw-fw)/2 + adj.dx*W;
    let y=by+(bh-fh)/2 + adj.dy*H;
    lastArt=toOut({x,y,fw,fh}); // 드래그 히트테스트용 (출력 좌표)
    // 그림자 방향: 배치 영역 좌/우 벽 밝기 차이로 광원 추정
    const sLm=lumOf(sampleAvg(wall.img, a.cx-a.w*1.1, a.cy-a.h/2, a.w*.45, a.h));
    const sRm=lumOf(sampleAvg(wall.img, a.cx+a.w*.65, a.cy-a.h/2, a.w*.45, a.h));
    let shx=wall.shx!==undefined ? wall.shx*fw : 0;
    if(wall.shx===undefined && sLm!==null && sRm!==null) shx=Math.max(-1,Math.min(1,(sLm-sRm)/40))*fw*.02;
    const shy=(wall.shy??.03)*fh;
    // 이중 그림자 (큰 소프트 + 컨택트)
    const sa=wall.shadow??1;
    ctx.save();
    ctx.shadowColor=`rgba(0,0,0,${.24*sa})`; ctx.shadowBlur=fw*.060; ctx.shadowOffsetY=shy; ctx.shadowOffsetX=shx;
    ctx.fillStyle='#000'; ctx.fillRect(x,y,fw,fh);
    ctx.shadowColor=`rgba(0,0,0,${.32*sa})`; ctx.shadowBlur=fw*.010; ctx.shadowOffsetY=Math.max(1,shy*.20); ctx.shadowOffsetX=shx*.25;
    ctx.fillRect(x,y,fw,fh);
    ctx.restore();
    // 액자: 아주 살짝만 블러(프레임 경계가 사진과 자연스럽게 맞물리게) — 고해상이라 최소화
    const blurPx=Math.max(.15, Math.min(.7, W*0.00016));
    ctx.save(); ctx.filter=`blur(${blurPx.toFixed(2)}px)`;
    ctx.drawImage(framed,x,y,fw,fh);
    ctx.restore();
    // 사진 그레인 아주 살짝 (질감 일치)
    applyNoise(ctx,x,y,fw,fh,.018);
    // 톤매칭: 주변 벽 색을 약하게만 입혀 동화 (금속/우드 색 살리도록 절제)
    const avg=sampleAvg(wall.img, a.cx-a.w/2, a.cy-a.h/2, a.w, a.h);
    if(avg){
      ctx.save(); ctx.globalCompositeOperation='soft-light';
      ctx.globalAlpha=wall.tone??(wall.dark? .22 : .13);
      ctx.fillStyle=`rgb(${avg.r},${avg.g},${avg.b})`;
      ctx.fillRect(x,y,fw,fh); ctx.restore();
    }
    // 조명 (기본 꺼짐). 폴백 경로는 벽 사진의 광원 방향을 모르므로 좌상단으로 둔다.
    applyStudioLight(ctx,W,H,state.light,{x,y,fw,fh},[-1,-1],
      sampleAvg(wall.img,.02,.02,.3,.3)||LIGHT_FALLBACK);
    // 아주 옅은 비네트
    const vg=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.55,W/2,H/2,Math.max(W,H)*.82);
    vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,.04)');
    ctx.fillStyle=vg; ctx.fillRect(0,0,W,H);
  } else {
    const transparent = state.bg==='transparent';
    if(!transparent){
      ctx.fillStyle=state.bg; ctx.fillRect(0,0,W,H);
      const bg2=ctx.createLinearGradient(0,0,0,H);
      bg2.addColorStop(0,'rgba(255,255,255,.05)'); bg2.addColorStop(1,'rgba(0,0,0,.04)');
      ctx.fillStyle=bg2; ctx.fillRect(0,0,W,H);
    }
    const pad=transparent? 0 : .08;
    const s=Math.min(W*(1-2*pad)/framed.width, H*(1-2*pad)/framed.height, 2);
    const fw=framed.width*s, fh=framed.height*s;
    const x=(W-fw)/2, y=(H-fh)/2;
    if(!transparent){
      ctx.save();
      ctx.shadowColor='rgba(0,0,0,.22)'; ctx.shadowBlur=fw*.035; ctx.shadowOffsetY=fh*.018;
      ctx.fillStyle='#000'; ctx.fillRect(x,y,fw,fh);
      ctx.shadowColor='rgba(0,0,0,.25)'; ctx.shadowBlur=fw*.008; ctx.shadowOffsetY=fh*.004;
      ctx.fillRect(x,y,fw,fh);
      ctx.restore();
    }
    ctx.drawImage(framed,x,y,fw,fh);
    if(!transparent) applyStudioLight(ctx,W,H,state.light,{x,y,fw,fh},[-1,-1],LIGHT_FALLBACK);
  }
  drawWatermark(ctx,W,H);
  return finish();
}

// ============================================================
//  워터마크 — 우측 하단 ArtLink 워드마크
// ============================================================
// 항상 찍는다(끌 수 없음). 이 도구를 여는 유일한 이유가 유입이라 워터마크가 빠지면 남는 게 없다.
// 대신 크기를 절제하고(긴 변의 2.6%) 미리보기에도 그대로 보여준다 — 저장하고 나서 발견하면 배신감이 든다.
//
// 색: Navbar 로고와 같은 'Art'(흰) + 'Link'(#c4302b — 2026-10-04 까지 옛 로고 색 #dc3545 였다). 벽 배경이 화이트큐브부터
// 호텔라운지까지 밝기가 제각각이라 그림자로 대비를 확보한다(배경을 덮지 않는다).
// 렌즈 비네팅 — **화면 전체**에 아주 완만하게. 실제 사진에는 반드시 있고, 없으면
// 조각이 균일하게 칠해진 판으로 보인다(골든 살 길이방향 변화 8.5~104%, 우리는 3% 였다).
// ⚠️ 조각에만 걸면 경계에서 벽과 어긋나 검은 테가 된다 — 반드시 합성이 끝난 뒤 전체에.
// ⚠️ 세게 주면 '드라마틱 조명'이 되어 오히려 가짜다. 코너에서 15% 안쪽으로 유지한다.
const VIGNETTE=0.12;
function sceneVignette(ctx,W,H){
  if(VIGNETTE<=0) return;
  const cx=W/2, cy=H/2, r=Math.hypot(W,H)/2;
  const g=ctx.createRadialGradient(cx,cy,r*0.30,cx,cy,r);
  g.addColorStop(0,'rgba(0,0,0,0)');
  g.addColorStop(0.62,`rgba(0,0,0,${(VIGNETTE*0.28).toFixed(3)})`);
  g.addColorStop(1,`rgba(0,0,0,${VIGNETTE})`);
  ctx.save(); ctx.globalCompositeOperation='multiply';
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H); ctx.restore();
}

function drawWatermark(ctx,W,H){
  const LONGSIDE=Math.max(W,H);
  const fs=Math.round(LONGSIDE*0.026);          // 글자 크기 — 긴 변의 2.6%
  const pad=Math.round(LONGSIDE*0.028);         // 가장자리 여백
  ctx.save();
  ctx.font='700 '+fs+'px "Pretendard Variable",Pretendard,system-ui,sans-serif';
  ctx.textBaseline='alphabetic';
  ctx.textAlign='left';
  const wArt=ctx.measureText('Art').width, wLink=ctx.measureText('Link').width;
  const x=W-pad-(wArt+wLink), y=H-pad;

  // 벽이 17종이라 밝기 편차가 크다(화이트큐브 ~ 호텔라운지). 흰 글씨로 고정하면 밝은 벽에서 흐려지고
  // 검은 글씨로 고정하면 어두운 벽에서 묻힌다 → **놓일 자리의 배경을 읽어 글자색을 뒤집는다.**
  // 합성이 끝난 캔버스에서 직접 읽으므로 조명 효과까지 반영된다(동일출처 프록시 덕에 taint 없음).
  let lum=null, alpha=255;
  try{
    const bx=Math.max(0,Math.round(x)), by=Math.max(0,Math.round(y-fs));
    const bw=Math.max(1,Math.min(W-bx,Math.round(wArt+wLink))), bh=Math.max(1,Math.min(H-by,Math.round(fs*1.3)));
    const d=ctx.getImageData(bx,by,bw,bh).data;
    let sum=0,n=0,asum=0;
    for(let i=0;i<d.length;i+=16){ sum+=0.2126*d[i]+0.7152*d[i+1]+0.0722*d[i+2]; asum+=d[i+3]; n++; }
    if(n){ lum=sum/n; alpha=asum/n; }
  }catch(e){ /* 읽기 실패하면 흰 글씨 기본값 */ }
  // 투명 배경(원본 비율·배경없음)은 흰 종이에 놓일 가능성이 높으니 어두운 글씨로 본다
  const onLight = (alpha<40) || (lum!==null && lum>148);

  ctx.shadowColor = onLight ? 'rgba(255,255,255,.65)' : 'rgba(0,0,0,.55)';
  ctx.shadowBlur=Math.round(fs*0.35); ctx.shadowOffsetY=Math.round(fs*0.06);
  ctx.fillStyle = onLight ? '#1f1f1f' : '#ffffff';
  ctx.fillText('Art',x,y);
  ctx.fillStyle='#c4302b';   // 브랜드 빨강은 밝기와 무관하게 유지 — 사이트 빨강 하나(규칙 47). 예전 #dc3545 는 로고 옛 색이었다
  ctx.fillText('Link',x+wArt,y);
  ctx.restore();
}

// ---- 이미지 로드 ---- (화면과 하니스가 함께 쓴다)
function capToCanvas(srcImg){
  const w=srcImg.naturalWidth||srcImg.width, h=srcImg.naturalHeight||srcImg.height;
  const s=Math.min(1,LONG/Math.max(w,h));
  const c=document.createElement('canvas'); c.width=Math.round(w*s); c.height=Math.round(h*s);
  c.getContext('2d').drawImage(srcImg,0,0,c.width,c.height); return c;
}
// 칩 그림(frames/chips/)을 구울 때 액자에 끼우는 가짜 그림 — 개인정보가 아니다
function dummyArt(w,h){ const c=document.createElement('canvas'); c.width=w; c.height=h;
  const x=c.getContext('2d'); const g=x.createLinearGradient(0,0,w,h);
  g.addColorStop(0,'#a9bdd4'); g.addColorStop(.5,'#ded3c0'); g.addColorStop(1,'#c5a78f');
  x.fillStyle=g; x.fillRect(0,0,w,h);
  x.fillStyle='rgba(255,255,255,.35)'; x.beginPath(); x.arc(w*.7,h*.3,w*.2,0,7); x.fill();
  x.fillStyle='rgba(90,70,60,.25)'; x.beginPath(); x.arc(w*.3,h*.75,w*.28,0,7); x.fill();
  return c; }

// ⚠️ `state.sceneIdx` 는 **이 전체 목록의 인덱스**다(규칙 44j). 걸러진 목록의 인덱스로 바꾸지 말 것.
let SCENES=[];
let selectedWork=null;   // 고른 작품 — 실치수(sizeText)로 거는 데 쓴다(artCmOf)
