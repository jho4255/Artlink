<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>ArtLook · 액자 걸기</title>
<script>
  // 마이페이지 [ArtLook] 탭은 이 페이지를 iframe 으로 품는다(같은 출처라 localStorage 가 그대로 읽힌다).
  // 그때는 바깥(MyPage)이 이미 제목을 그리므로 머리말을 감춘다 — 첫 그림부터 감추려고 <head> 에서 정한다.
  if (/[?&]embed=1(&|$)/.test(location.search) && window.parent !== window) document.documentElement.classList.add('embed');
</script>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<style>
  /* ── ArtLook 화면 (2026-10-04 개편, CLAUDE.md 규칙 65) ───────────────────────────────
     한 구조, 두 배치 — 미리보기 + 탭 줄 [작품 · 액자 · 매트 · 배경 · 조명 · 비율] + 그 탭의 내용 + [이미지 저장].
       · 좁은 칸(860px 미만 — 휴대폰·태블릿·1024px 노트북의 탭 안): 미리보기가 위에서 남는 높이를 전부 쓰고,
         아래에 탭 줄 · 옆으로 미는 칩 한 줄 · [저장]. 칩 칸의 높이는 **고정** — 탭을 바꿀 때 미리보기가 들썩이지 않게.
       · 넓은 칸: 왼쪽 미리보기 / 오른쪽 360px 패널(탭 줄 · 격자 · 맨 아래 [저장]).
     ⚠️ **좁은 칸 규칙을 먼저, 넓은 칸 미디어 쿼리를 뒤에** 둘 것. 예전엔 `@media(max-width:860px)` 가 같은 선택자의 기본 규칙보다
        **앞에** 있어서 한 번도 적용되지 않았다 — 휴대폰에서 설정 1,611px 를 141px 틈으로 넘겼다(2026-10-04 실측). 소스 가드가 순서를 본다.
     색·모양은 앱의 다른 화면(포트폴리오 만들기)과 같다 — 흑백, 고른 것은 진한 테두리, 검정 채움은 [이미지 저장] 하나, 그림자 없음.
     누르는 곳 40px·글자 12px 이상. */
  :root{
    --ink:#111827; --text:#1f2937; --sub:#6b7280; --faint:#9ca3af;
    --line:#e5e7eb; --line-strong:#d1d5db; --soft:#f3f4f6;
    --stage:#f2f1ee;               /* 미리보기 바탕 — 벽 사진이 놓일 자리라 아주 옅은 웜 그레이 */
    --accent:#c4302b;              /* 사이트 빨강 — '지금 할 일'(크기 입력하기)에만 */
    --bg:#ffffff;
    --tabs-h:44px; --pane-h:144px;   /* 좁은 칸의 칩 칸 높이 — 탭마다 내용이 이 안에 들어가게 맞췄다(scratchpad/artlook-ux/walk.js 가 잘림을 잰다) */
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{font-family:"Pretendard Variable",Pretendard,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;line-height:1.5;
       color:var(--text);background:var(--bg);-webkit-text-size-adjust:100%;overscroll-behavior:none}
  button{font:inherit;color:inherit}
  [hidden]{display:none!important}
  :focus-visible{outline:2px solid var(--ink);outline-offset:2px}

  .app{height:100%;display:flex;flex-direction:column;min-height:0}

  /* 머리 — 새 탭(갤러리의 판매작 홍보)에서만. 임베드는 바깥이 그린다 */
  .top{flex:none;display:flex;align-items:center;gap:10px;min-height:52px;padding:8px 16px;
       padding-top:calc(8px + env(safe-area-inset-top,0px));border-bottom:1px solid var(--line)}
  .embed .top{display:none}
  .top h1{margin:0;font-size:20px;font-weight:700;letter-spacing:-.02em;color:var(--ink);white-space:nowrap}
  .top h1 b{color:var(--accent);font-weight:700}
  .top .sub{margin:0;flex:1;min-width:0;font-size:13px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* 미리보기 */
  .stage{position:relative;flex:1 1 auto;min-height:150px;background:var(--stage);display:flex;align-items:center;
         justify-content:center;padding:10px;overflow:hidden;touch-action:pinch-zoom}
  .canvas-wrap{position:relative;line-height:0}
  #preview{display:block;touch-action:none;box-shadow:0 0 0 1px rgba(17,24,39,.06);cursor:default}
  #preview.movable{cursor:grab}
  #preview.dragging{cursor:grabbing}
  .zoom{position:absolute;left:8px;bottom:8px;display:flex;gap:6px;line-height:1}
  .zoom button{width:40px;height:40px;display:grid;place-items:center;padding:0;border:1px solid rgba(17,24,39,.14);
               border-radius:999px;background:rgba(255,255,255,.94);color:var(--ink);cursor:pointer}
  .zoom button:hover{background:#fff;border-color:rgba(17,24,39,.3)}
  .zoom svg{width:18px;height:18px}
  .stage-msg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);max-width:calc(100% - 32px);margin:0;
             font-size:13px;color:var(--sub);text-align:center;line-height:1.5}
  .stage-msg.over{top:12px;transform:translateX(-50%);padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.94);
                  color:var(--text);box-shadow:0 0 0 1px rgba(17,24,39,.08)}
  .stage-msg.warn{color:var(--text)}
  .toast{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);max-width:calc(100% - 32px);margin:0;padding:8px 14px;
         border-radius:999px;background:var(--ink);color:#fff;font-size:13px;line-height:1.4;white-space:nowrap;overflow:hidden;
         text-overflow:ellipsis;pointer-events:none}

  /* 패널 */
  .panel{flex:none;display:flex;flex-direction:column;min-height:0;background:var(--bg);border-top:1px solid var(--line)}
  .tabs{flex:none;display:flex;height:var(--tabs-h);padding:0 6px;border-bottom:1px solid var(--line);overflow-x:auto;
        scrollbar-width:none;touch-action:pan-x pinch-zoom}
  .tabs::-webkit-scrollbar{display:none}
  .tabs [role=tab]{flex:1 0 auto;min-width:48px;height:100%;padding:0 10px;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;
                   background:none;color:var(--faint);font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap}
  .tabs [role=tab]:hover{color:var(--text)}
  .tabs [role=tab][aria-selected=true]{color:var(--ink);font-weight:600;border-bottom-color:var(--ink)}
  .panes{flex:none;height:var(--pane-h);overflow:hidden;touch-action:pan-x pinch-zoom}
  .pane{height:100%;display:flex;flex-direction:column;gap:6px;padding:8px 16px 6px;min-height:0}

  /* 칩 한 줄 — 옆으로 민다(좁은 칸) */
  .row{display:flex;align-items:flex-start;gap:8px;overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:contain;
       scrollbar-width:none;touch-action:pan-x pinch-zoom;margin:-3px;padding:3px;flex:none}
  .row::-webkit-scrollbar{display:none}
  .chip{flex:none;width:66px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:3px;border:1px solid transparent;
        border-radius:10px;background:none;cursor:pointer;text-align:center}
  .chip:hover{border-color:var(--line-strong)}
  .chip[aria-pressed=true]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
  .chip .thumb{display:block;width:100%;aspect-ratio:1/1;border-radius:6px;background:var(--soft);object-fit:contain}
  .chip.work{width:68px}
  .chip.work .thumb{background:var(--soft)}
  .chip.broken .thumb{opacity:.3}
  .chip.frame{width:60px}
  .chip.frame .thumb{aspect-ratio:72/88;background:none}
  .chip.scene .thumb{object-fit:cover}         /* 배경 사진은 칩에 맞춰 잘라 보인다(작품이 아니다 — 규칙 18 대상 아님) */
  .chip .name{display:block;max-width:100%;font-size:12px;line-height:16px;color:var(--text);white-space:nowrap;overflow:hidden;
              text-overflow:ellipsis}
  .group{flex:none;align-self:stretch;display:flex;align-items:center;padding:0 2px 0 6px;font-size:12px;color:var(--sub);
         writing-mode:vertical-rl;letter-spacing:.1em;border-left:1px solid var(--line)}
  .group:first-child{border-left:0;padding-left:0}

  /* 고르기(여럿 중 하나) */
  .seg{display:flex;flex-wrap:wrap;gap:8px;flex:none}
  .seg button{min-height:40px;min-width:56px;padding:0 14px;border:1px solid var(--line-strong);border-radius:8px;background:var(--bg);
              color:var(--text);font-size:14px;cursor:pointer}
  .seg button:hover{border-color:var(--sub)}
  .seg button[aria-pressed=true]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);color:var(--ink);font-weight:600}
  .seg button:disabled{opacity:.4;cursor:default}
  .swatches{display:flex;gap:8px;flex:none}
  .sw{width:40px;height:40px;padding:0;border-radius:999px;border:1px solid var(--line-strong);cursor:pointer}
  .sw[aria-pressed=true]{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ink)}
  .slider{display:flex;align-items:center;gap:12px;min-height:40px;flex:none}
  .slider label{font-size:14px;color:var(--text);white-space:nowrap}
  .slider input{flex:1;min-width:0;height:40px;accent-color:var(--ink)}
  .slider output{width:44px;text-align:right;font-variant-numeric:tabular-nums;color:var(--text)}

  /* 고른 것 설명 한 줄 — 좁은 칸은 칩 아래, 넓은 칸은 위 */
  .line{order:2;margin:0;display:flex;align-items:center;gap:8px;font-size:12.5px;line-height:1.45;color:var(--sub)}
  .line .txt{flex:1;min-width:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:keep-all;
             overflow-wrap:anywhere}
  .line b{color:var(--text);font-weight:600}
  #framesLine .txt{-webkit-line-clamp:1}   /* 칩이 키가 커서 설명은 한 줄 — 넓은 칸에선 다 보인다 */
  .line .act{flex:none;min-height:40px;padding:0 12px;border:1px solid var(--accent);border-radius:8px;background:var(--bg);
             color:var(--accent);font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}

  /* 저장 */
  .actions{flex:none;display:flex;gap:8px;padding:8px 16px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));
           border-top:1px solid var(--line);touch-action:pinch-zoom}
  .btn-primary{flex:1;min-height:44px;padding:0 16px;border:0;border-radius:10px;background:var(--ink);color:#fff;font-size:15px;
               font-weight:600;cursor:pointer}
  .btn-primary:hover:not(:disabled){background:#1f2937}
  .btn-primary:disabled{opacity:.35;cursor:default}
  .btn-line{flex:none;min-height:44px;padding:0 14px;border:1px solid var(--line-strong);border-radius:10px;background:var(--bg);
            color:var(--ink);font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap}
  .btn-line:hover:not(:disabled){border-color:var(--sub)}
  .btn-line:disabled{opacity:.5;cursor:default}
  .top .btn-line{min-height:40px}

  /* 인앱 브라우저(카카오톡·인스타그램) — 내려받기가 막히는 곳. 이미지를 띄워 길게 눌러 저장하게 한다 */
  .sheet{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(17,24,39,.72)}
  .sheet-box{width:100%;max-width:520px;max-height:100%;display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:14px;
             background:var(--bg)}
  .sheet-box p{margin:0;font-size:15px;font-weight:600;color:var(--ink);text-align:center}
  .sheet-box img{display:block;width:100%;min-height:0;max-height:65vh;object-fit:contain;background:var(--stage);border-radius:6px;
                 -webkit-touch-callout:default}
  .sheet-box .btn-line{align-self:center;min-width:120px}

  /* 마우스로 쓰는 좁은 칸(1024px 노트북의 탭 안) — 칩 줄이 옆으로 넘친다는 걸 보이게 얇은 스크롤바를 둔다(휠도 가로로 넘긴다, ui.js) */
  @media (pointer:fine){ .row{scrollbar-width:thin;padding-bottom:6px} .row::-webkit-scrollbar{display:block;height:6px}
    .row::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:3px} }
  /* 낮은 화면(아이폰 SE 등) — 칩 칸은 그대로(줄이면 설명이 잘린다), 미리보기 여백만 줄인다 */
  @media (max-height:560px){ .stage{padding:6px} }

  /* ── 넓은 칸 — 오른쪽 패널 ── (⚠️ 반드시 위의 기본 규칙 **뒤에**) */
  @media (min-width:860px){
    .app{display:grid;grid-template-columns:minmax(0,1fr) 360px;grid-template-rows:auto minmax(0,1fr)}
    .top{grid-column:1/-1}
    .stage{grid-column:1;grid-row:2;min-height:0;padding:24px;touch-action:auto}
    .panel{grid-column:2;grid-row:2;border-top:0;border-left:1px solid var(--line)}
    .panes{flex:1 1 auto;height:auto;min-height:0;overflow-y:auto;touch-action:pan-y pinch-zoom}
    .pane{height:auto;padding:14px 16px 16px;gap:12px}
    .line{order:-1;min-height:0}
    .line .txt,#framesLine .txt{-webkit-line-clamp:unset;display:block}
    .row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;overflow:visible;touch-action:auto;margin:0;padding:0}
    .row.works{grid-template-columns:repeat(3,minmax(0,1fr))}
    .chip,.chip.work,.chip.frame{width:auto}
    /* 넓은 칸은 칩이 작아(약 76px) 이름이 잘린다('베이지 플라…') — 두 줄까지 */
    .chip .name{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:keep-all;line-height:15px}
    .group{grid-column:1/-1;writing-mode:horizontal-tb;letter-spacing:0;padding:6px 0 0;border-left:0;font-weight:600;color:var(--text)}
    .group:first-child{padding-top:0}
  }
  @media (prefers-reduced-motion:reduce){ *{scroll-behavior:auto!important} }
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <h1>Art<b>Look</b></h1>
    <p class="sub">작품을 액자와 공간에 걸어 SNS에 올릴 이미지를 만듭니다</p>
    <button type="button" class="btn-line" id="close">닫기</button>
  </header>

  <main class="stage" id="stage" aria-label="미리보기">
    <div class="canvas-wrap" id="canvasWrap">
      <canvas id="preview" role="img" aria-label="액자에 건 작품 미리보기" hidden></canvas>
      <div class="zoom" id="zoom" role="group" aria-label="작품 크기" hidden>
        <button type="button" id="zoomOut" aria-label="작게"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"/></svg></button>
        <button type="button" id="zoomIn" aria-label="크게"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
        <button type="button" id="zoomReset" aria-label="처음 자리·크기로"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg></button>
      </div>
    </div>
    <p class="stage-msg" id="busy" role="status">불러오는 중…</p>
    <p class="toast" id="toast" role="status" aria-live="polite" hidden></p>
  </main>

  <section class="panel" aria-label="꾸미기">
    <div class="tabs" role="tablist" aria-label="꾸미기">
      <button type="button" role="tab" id="tab-works" aria-controls="pane-works" aria-selected="true">작품</button>
      <button type="button" role="tab" id="tab-frames" aria-controls="pane-frames" aria-selected="false" tabindex="-1">액자</button>
      <button type="button" role="tab" id="tab-mat" aria-controls="pane-mat" aria-selected="false" tabindex="-1">매트</button>
      <button type="button" role="tab" id="tab-scenes" aria-controls="pane-scenes" aria-selected="false" tabindex="-1">배경</button>
      <button type="button" role="tab" id="tab-light" aria-controls="pane-light" aria-selected="false" tabindex="-1">조명</button>
      <button type="button" role="tab" id="tab-ratio" aria-controls="pane-ratio" aria-selected="false" tabindex="-1">비율</button>
    </div>
    <div class="panes" id="panes">
      <div class="pane" id="pane-works" role="tabpanel" aria-labelledby="tab-works">
        <div class="row works" id="works" role="group" aria-label="작품"></div>
        <p class="line" id="worksLine"></p>
        <!-- 작품이 넘어오지 않았을 때(작품 0점·주소로 직접) — 데모 작품 안내. 테스트가 이 id 를 본다 -->
        <p class="line" id="worksEmpty" hidden></p>
      </div>
      <div class="pane" id="pane-frames" role="tabpanel" aria-labelledby="tab-frames" hidden>
        <div class="row" id="frames" role="group" aria-label="액자"></div>
        <p class="line" id="framesLine"></p>
      </div>
      <div class="pane" id="pane-mat" role="tabpanel" aria-labelledby="tab-mat" hidden>
        <!-- 매트(대지) — 액자와 작품 사이의 종이 여백. 캔버스 랩만 빼고 전 스타일(규칙 44·44e) -->
        <div class="seg" id="matSel" role="group" aria-label="매트 폭">
          <button type="button" data-mat="0">없음</button>
          <button type="button" data-mat="0.05">좁게</button>
          <button type="button" data-mat="0.10">넓게</button>
        </div>
        <div class="swatches" id="matColors" role="group" aria-label="매트 색"></div>
        <p class="line" id="matHint"></p>
      </div>
      <div class="pane" id="pane-scenes" role="tabpanel" aria-labelledby="tab-scenes" hidden>
        <div class="row" id="scenes" role="group" aria-label="배경"></div>
        <!-- WebGL2 가 없을 때만 — 옛 평면 합성 경로의 벽 목록 -->
        <div class="row" id="walls" role="group" aria-label="배경" hidden></div>
        <p class="line" id="sceneNote"></p>
      </div>
      <div class="pane" id="pane-light" role="tabpanel" aria-labelledby="tab-light" hidden>
        <!-- 조명은 종류 없이 강도 하나(0 = 없음, 규칙 43) -->
        <div class="slider"><label for="lightOp">조명</label><input type="range" id="lightOp" min="0" max="100" step="5" value="0" /><output id="lightOpv" for="lightOp">0%</output></div>
        <p class="line"><span class="txt">이 공간의 빛이 오는 쪽에서 비춰요. 올릴수록 주변 벽이 어두워져 작품이 돋보여요.</span></p>
      </div>
      <div class="pane" id="pane-ratio" role="tabpanel" aria-labelledby="tab-ratio" hidden>
        <div class="seg" id="ratios" role="group" aria-label="이미지 비율"></div>
      </div>
    </div>
    <div class="actions">
      <button type="button" class="btn-primary" id="dl" disabled>이미지 저장</button>
      <button type="button" class="btn-line" id="toStory" hidden>ArtStory에 올리기</button>
    </div>
  </section>
</div>

<div class="sheet" id="saveSheet" role="dialog" aria-modal="true" aria-labelledby="saveSheetTitle" hidden>
  <div class="sheet-box">
    <p id="saveSheetTitle">이미지를 길게 눌러 사진에 저장하세요</p>
    <img id="saveSheetImg" alt="저장할 이미지" />
    <button type="button" class="btn-line" id="saveSheetClose">닫기</button>
  </div>
</div>

<script src="scene.js?v=__ARTLOOK_BUILD__"></script>
<script>
/* ============================================================
   FrameIt POC v3
   - 프레임: 단면 프로파일 몰딩 렌더링 (v2와 동일)
   - 벽 목업: 실사 인테리어 사진 합성 (walls/*.jpg)
     사진별로 액자를 걸 위치(art box, 이미지 좌표 비율)를 지정,
     cover-fit 변환을 거쳐 캔버스에 매핑 + 이중 그림자 + 톤매칭
   전부 클라이언트 Canvas. 외부 의존성 0.
   ============================================================ */

// ── 자산 불러오기 (2026-10-04, CLAUDE.md 규칙 65) ───────────────────────────────
// 액자 사진·결 텍스처·장면 사진은 **지금 고른 것만** 받는다(ensureFrameAssets · ArtLookScene.ensureScene · ensureWall).
// 예전엔 탭을 열자마자 벽 사진 23장·액자 사진 8장을 전부 받았고(실제 작가 30점 기준 41.5MB), 한 장 올 때마다 화면을
// 처음부터 다시 그렸다(32번 — 그동안 마이페이지까지 굳었다). 기다렸다가 한 번 그리는 일은 화면(ui.js)이 한다.
// `?preload=all` — 예전처럼 전부 미리 받는다. 화질 하니스(scratchpad/vt)가 상태를 코드로 갈아 끼우며 재기 때문이다.
const PRELOAD_ALL=/[?&]preload=all(&|$)/.test(location.search);
// 빌드가 바꿔 끼우는 빌드 ID(frontend/vite.config.ts 의 artlook-build-id). 개발 서버에선 글자 그대로 — 쿼리라 상관없다.
// 고정 이름 파일(목록 JSON)이 브라우저·CDN 에 1년 굳어 있던 사본을 건너뛰려고 붙인다(backend lib/staticCache.ts).
const BUILD='__ARTLOOK_BUILD__';
/** 자산이 도착했거나 실패했다 — 화면(ui.js)이 그걸 기다리던 중이면 다시 그린다 */
function assetArrived(key){ if(typeof window.onAssetArrived==='function') window.onAssetArrived(key); }

// roundRect 폴리필
if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){
    r=Math.min(r,w/2,h/2); this.moveTo(x+r,y);
    this.arcTo(x+w,y,x+w,y+h,r); this.arcTo(x+w,y+h,x,y+h,r);
    this.arcTo(x,y+h,x,y,r); this.arcTo(x,y,x+w,y,r); this.closePath(); };
}

// ---- 색/난수 유틸 ----
// ⚠️⚠️ **`rgb(...)` 문자열도 반드시 받을 것.** 예전엔 16진수만 파싱했는데,
//   `gradeHex()`(액자 재질 색 보정)와 `shade()` 가 **둘 다 `rgb(…)` 를 돌려준다.**
//   그걸 다시 넣으면 `parseInt('rgb(44,40,35)',16)` → NaN → `NaN|0` = 0 → **순검정**이 된다.
//   에러도 경고도 없다. 실제 피해(2026-08-31 실측):
//     · 플로터 트레이가 **오크·골드·월넛에서만** 새까맣게 칠해졌다(틈 바닥 휘도 0~2,
//       골든 최저는 살 대비 0.110). 검정·실버·아이보리는 보정값이 [1,1] 이라 hex 가
//       그대로 나와 멀쩡했다 — 그래서 '일부 액자만 이상하다'로 보였다.
//     · `frameSideGradient` 의 텍스처 폴백도 같은 이유로 검게 떨어진다.
//   같은 함정이 CLAUDE.md 38번(매트 개구부가 통째로 검게)에도 적혀 있다. 근본 원인은
//   **색을 문자열로 주고받으면서 형식을 하나로 안 정한 것**이라, 파서 쪽에서 막는다.
function hexToRgb(h){
  h=String(h==null?'':h).trim();
  const m=h.match(/^rgba?\(\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)/i);
  if(m) return {r:+m[1]|0, g:+m[2]|0, b:+m[3]|0};
  h=h.replace('#',''); if(h.length===3) h=h.split('').map(c=>c+c).join('');
  const n=parseInt(h,16);
  if(!isFinite(n)) return {r:0,g:0,b:0};
  return {r:(n>>16)&255,g:(n>>8)&255,b:n&255}; }
function clamp255(v){ return Math.max(0,Math.min(255,v)); }
function shade(hex,amt){ amt=Math.max(-1,Math.min(1,amt)); const {r,g,b}=hexToRgb(hex);
  const t=amt<0?0:255; const p=Math.abs(amt);
  return `rgb(${clamp255(r+(t-r)*p)|0},${clamp255(g+(t-g)*p)|0},${clamp255(b+(t-b)*p)|0})`; }
// 시드 고정 PRNG — 슬라이더 드래그 중 텍스처가 흔들리지 않게 결정적이어야 함
function prng(seed){ let s=(seed*2654435761)>>>0; return ()=>{ s=(s*1664525+1013904223)>>>0; return s/4294967296; }; }
const gauss=(t,c,w)=>Math.exp(-((t-c)*(t-c))/(w*w));

// ---- 노이즈 텍스처 (종이 질감) ----
let _noiseSrc=null;
function noiseSrc(){ if(_noiseSrc) return _noiseSrc;
  const c=document.createElement('canvas'); c.width=c.height=160;
  const x=c.getContext('2d'); const id=x.createImageData(160,160); const rnd=prng(42);
  for(let i=0;i<id.data.length;i+=4){ const v=205+rnd()*50|0;
    id.data[i]=id.data[i+1]=id.data[i+2]=v; id.data[i+3]=255; }
  x.putImageData(id,0,0); _noiseSrc=c; return c; }
function applyNoise(ctx,x,y,w,h,alpha){
  ctx.save(); ctx.globalAlpha=alpha; ctx.globalCompositeOperation='multiply';
  ctx.fillStyle=ctx.createPattern(noiseSrc(),'repeat'); ctx.fillRect(x,y,w,h); ctx.restore(); }

// ---- 매트(대지) 종이 결 ----
// ⚠️ **1px 노이즈 × alpha 0.05 로는 아무것도 안 남는다.** 판은 화면까지 또 축소되므로
//    미세 노이즈는 밉맵에서 지워진다(실측 std 0.92, FrameIt Pro 는 6.4 — 7배 차이).
//    그게 "매트가 무슨 그냥 하얀 색"의 정체였다(2026-08-30 지적).
//    ① 입자를 2px 덩어리로 키우고 ② **어두운 반점과 밝은 반점을 함께** 준다 —
//    종이는 요철이라 그늘과 하이라이트가 같이 생긴다. multiply 만 쓰면 때 탄 것처럼 보인다.
//    ⚠️ 두 겹은 **서로 다른 시드**여야 한다. 같은 노이즈로 multiply+screen 하면 상쇄된다.
// ⚠️ 결은 **랜덤 점이 아니라 직조**다. FrameIt Pro 결과물을 확대하면 가로·세로 실이
//    교차하는 격자가 뚜렷하다(리넨 매트). 순수 노이즈는 모래알처럼 보이고 축소되면
//    먼저 사라진다 — 격자 성분은 주기가 있어 축소돼도 남는다.
// ⚠️ **결을 multiply 로 얹지 말 것 — 매트 색이 통째로 어두워진다.**
//    평균 128 노이즈를 alpha .30 으로 곱하면 흰 매트 231 이 204 로 내려앉아
//    "흰 매트"가 회색이 된다(실측). screen 을 더해도 흰색은 밝아질 여지가 없어 못 되돌린다.
//    **평균이 매트색과 같은 불투명 타일**을 만들어 그대로 덮는다 — 색은 보존되고 결만 생긴다.
const _paperTiles={};
function paperTile(rgbKey,px,amp,seed){
  const k=rgbKey+'_'+px+'_'+amp.toFixed(1)+'_'+seed;
  if(_paperTiles[k]) return _paperTiles[k];
  const [r0,g0,b0]=rgbKey.split(',').map(Number);
  const n=176, s=Math.max(1,Math.round(px));
  const a=document.createElement('canvas'); a.width=a.height=n;
  const ax=a.getContext('2d'), id=ax.createImageData(n,n), rnd=prng(seed);
  for(let yy=0;yy<n;yy++) for(let xx=0;xx<n;xx++){
    // 실 교차(직조) + 미세 랜덤. 직조 성분은 **주기가 있어 축소돼도 남는다** —
    // 순수 노이즈만 쓰면 화면 축소에서 먼저 사라진다.
    // ⚠️ 직조 성분을 세게 주면 **체크무늬 천**이 된다(규칙적 격자가 눈에 띈다).
    //    실제 리넨은 실 굵기가 제각각이라 불규칙하다 — 직조는 거들고 랜덤이 주다.
    // ⚠️ 직조(주기) 성분을 키우면 격자가 눈에 띈다 — 거들기만 하고 랜덤이 주다
    const d=(Math.sin(xx*Math.PI/2)+Math.sin(yy*Math.PI/2))*amp*0.10 + (rnd()-.5)*amp*2.0;
    const i=(yy*n+xx)*4;
    id.data[i]=clamp255(r0+d); id.data[i+1]=clamp255(g0+d); id.data[i+2]=clamp255(b0+d);
    id.data[i+3]=255;
  }
  ax.putImageData(id,0,0);
  if(s===1){ _paperTiles[k]=a; return a; }
  const b=document.createElement('canvas'); b.width=b.height=n*s;
  const bx=b.getContext('2d'); bx.imageSmoothingEnabled=false;
  bx.drawImage(a,0,0,n*s,n*s);
  _paperTiles[k]=b; return b;
}
/** 매트 표면의 종이 결. color = 매트색(hex).
 *  결의 세기는 **매트 밝기에 비례**한다 — FrameIt 실측도 흰 매트 std 11~13,
 *  검은 매트 6.4 로 밝을수록 세다(어두운 종이는 그늘이 얕아 결이 덜 드러난다). */
function matPaper(ctx,x,y,w,h,px,color){
  const {r,g,b}=hexToRgb(color);
  const lum=r*.2126+g*.7152+b*.0722;
  // ⚠️ 골든의 결은 std 6.4(검정)~13.5(흰색)인데 amp 48 은 **체크무늬 천**으로 보인다
  //    (2026-08-31 크롭 확인). 결은 있어야 하지만 무늬로 읽히면 안 된다.
  const amp=Math.max(7, lum*0.140+6);
  ctx.save();
  ctx.beginPath(); ctx.rect(x,y,w,h); ctx.clip();
  ctx.fillStyle=ctx.createPattern(paperTile(`${r},${g},${b}`,px,amp,4242),'repeat');
  ctx.fillRect(x,y,w,h);
  ctx.restore();
}

/** 매트 표면의 방향광.
 *  ⚠️ **대각선 그라디언트를 쓰지 말 것.** 좌상단 '모서리'만 최대로 밝아서 매트 위쪽
 *     중앙은 이미 그라디언트의 30% 지점이 된다 — 위↔아래 낙차가 4분의 1로 죽는다
 *     (실측 9레벨, FrameIt 은 흰 매트 7 / 검은 매트 32). 세로를 지배시킨다.
 *  ⚠️ 흰 매트에는 **흰색을 얹어도 밝아질 여지가 없다**(231에 alpha .16 을 얹어야 +4).
 *     그래서 밝히기는 screen, 어둡게는 multiply 로 나눠 건다 — 매트 색과 무관하게 먹는다. */
function shadeMatSurface(ctx,x,y,w,h,ld){
  const n=Math.hypot(ld[0],ld[1])||1, ux=-ld[0]/n, uy=-ld[1]/n;   // 빛의 진행 방향
  ctx.save();
  ctx.beginPath(); ctx.rect(x,y,w,h); ctx.clip();
  const ax0=x+(ux<0?w:0), ay0=y+(uy<0?h:0);
  const g1=ctx.createLinearGradient(ax0,ay0, ax0+ux*w*0.35, ay0+uy*h);
  g1.addColorStop(0,'rgba(0,0,0,0)'); g1.addColorStop(1,'rgba(0,0,0,.17)');
  ctx.globalCompositeOperation='multiply'; ctx.fillStyle=g1; ctx.fillRect(x,y,w,h);
  const g2=ctx.createLinearGradient(ax0,ay0, ax0+ux*w*0.35, ay0+uy*h);
  g2.addColorStop(0,'rgba(255,255,255,.11)'); g2.addColorStop(.55,'rgba(255,255,255,0)');
  ctx.globalCompositeOperation='screen'; ctx.fillStyle=g2; ctx.fillRect(x,y,w,h);
  ctx.restore();
}

/** 액자가 매트에 드리우는 그림자.
 *  액자는 매트보다 **앞에 있는 판**이라 안쪽 둘레에 그늘이 진다. 이게 없으면 액자와
 *  매트가 같은 평면에 인쇄된 것처럼 보인다 — "액자와 그림 사이가 평면적"의 큰 원인.
 *  (FrameIt Pro 실측: 액자 근처 매트가 안쪽보다 11~26레벨 어둡다) */
// 액자 살이 매트를 덮어 생기는 이음매의 폐색. AO_SEAM = 방향과 무관한 몫(사방 공통),
// AO_SEAM_DIR = 그늘진 변에 더해지는 몫.
const AO_SEAM=0.34, AO_SEAM_DIR=0.34;
function frameShadowOnMat(ctx,x,y,w,h,depth,ld){
  const n=Math.hypot(ld[0],ld[1])||1;
  const d=Math.max(2,depth);
  ctx.save();
  ctx.beginPath(); ctx.rect(x,y,w,h); ctx.clip();
  ctx.globalCompositeOperation='multiply';
  // 빛을 등진 변일수록 진하다
  const sides=[[0,-1,x,y,x,y+d,w,d],[0,1,x,y+h,x,y+h-d,w,d],
               [-1,0,x,y,x+d,y,d,h],[1,0,x+w,y,x+w-d,y,d,h]];
  for(const [nx,ny,gx0,gy0,gx1,gy1] of sides){
    const lit=(nx*ld[0]+ny*ld[1])/n;          // +1 = 그 변이 빛 쪽
    // ⚠️⚠️ **폐색은 빛과 무관하게 사방에 있다.** 액자 살이 매트 **위로 겹쳐 있어서**
    //   생기는 것이라, 빛을 정면으로 받는 변에서도 이음매는 남는다. 방향광은 그 위에
    //   얹히는 변조일 뿐이다(그늘진 변이 더 깊다) — 접지 그림자와 같은 논리다.
    //   예전엔 전부 방향 항이라 **빛을 받는 변에서 이음매가 통째로 사라졌다**:
    //   실측(2026-09-01, 변별 rebate_ratio) 위 0.46~0.59 ↔ 아래 0.00~0.10.
    //   골든은 네 변이 0.72~0.89 인 경우도 있다(case_00·01). 눈에는 "액자와 매트가
    //   같은 평면에 인쇄됐다"로 보이고, 그게 곧 작품이 뒤로 안 들어간 인상이 된다.
    //   ⚠️ 대신 **넓히지 말 것**(폭은 매트의 20%). 좁고 깊으면 이음매, 넓고 얕으면 층이다.
    const a=(AO_SEAM + AO_SEAM_DIR*(1-lit)/2)*SYN_EDGE;
    const g=ctx.createLinearGradient(gx0,gy0,gx1,gy1);
    g.addColorStop(0,`rgba(0,0,0,${a.toFixed(3)})`);
    g.addColorStop(.35,`rgba(0,0,0,${(a*0.42).toFixed(3)})`);
    g.addColorStop(.7,`rgba(0,0,0,${(a*0.12).toFixed(3)})`);
    g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g; ctx.fillRect(x,y,w,h);
  }
  ctx.restore();
}

/** 매트 개구부의 45° 코어 사면.
 *  매트보드는 **두께가 있는 판**이라 개구부가 비스듬히 잘려 단면(코어)이 보인다.
 *  코어는 보통 속살이라 표면보다 밝다. 얇은 선 하나로 대신하면 '종이 한 장'으로 보인다.
 *  ⚠️ 네 면의 밝기가 **광원에 따라 달라야** 한다 — 위 사면은 아래를 향해 그늘지고
 *     아래 사면은 위를 향해 밝다. 균일하게 칠하면 그린 테두리가 된다. */
// ⚠️⚠️ **`shade()` 의 반환값을 다시 `shade()` 에 넣지 말 것.** 반환이 `rgb(…)` 문자열인데
//    `hexToRgb` 는 16진수만 파싱한다 → NaN → `NaN|0` = 0 → **새까만 검정**이 된다.
//    실제로 이 실수로 매트 개구부가 통째로 검게 칠해져 '틈'이 오려 낸 구멍처럼 보였다
//    (실측 낙차 90%, 골든 48%). 밝기 보정은 **한 번에 더해서** 한 번만 호출한다.
// 매트 개구부 45° 단면의 폭(매트 폭 대비).
// ⚠️ **'4겹=1.4mm 니까 2~4%' 로 좁히지 말 것 — 실측하면 더 나빠진다.** 2026-09-01 에
//   물리 치수로 4.5% 까지 좁혀 봤더니 매트→작품 전이가 오히려 급해져
//   `bevel_abs` 가 47→71 · 96→120 · 74→93 으로 **골든(33)에서 더 멀어졌고**
//   `gap_pct` 도 64→69 로 밴드를 벗어났다. 넓은 코어가 매트와 작품 사이의 **완충**을
//   만들어 준다(실제로도 8겹 매트는 3mm 다). 8.5% 는 실측으로 고른 값이라 유지한다.
const MAT_BEVEL_FRAC=0.085;
/** vis = **보이는가**(0~1). 브리핑 EFFECT GATING —
 *  ⚠️⚠️ **1px 미만으로 계산된 폭을 바닥값으로 끌어올리지 말 것.** 예전엔
 *    `Math.max(1.5, matPx*.085)` 라, 물리적으로 안 보일 만큼 얇은 매트에서도 **1.5px 짜리
 *    선**을 그렸다. 그게 곧 브리핑이 금지한 "graphic-looking inner ring" 이다.
 *    폭이 모자라면 **알파를 지워** 조용히 사라지게 한다(면이 못 되면 그리지 않는다). */
function matOpeningBevel(ctx,ax,ay,aw,ah,bw,matColor,ld,vis){
  const v=vis==null?1:Math.max(0,Math.min(1,vis));
  if(!(bw>0.5) || v<=0.02) return;
  const n=Math.hypot(ld[0],ld[1])||1;
  const faces=[
    [0, 1, [ax-bw,ay-bw, ax+aw+bw,ay-bw, ax+aw,ay, ax,ay]],           // 위 사면(아래를 향함)
    [-1,0, [ax+aw+bw,ay-bw, ax+aw+bw,ay+ah+bw, ax+aw,ay+ah, ax+aw,ay]], // 오른쪽
    [0,-1, [ax-bw,ay+ah+bw, ax,ay+ah, ax+aw,ay+ah, ax+aw+bw,ay+ah+bw]], // 아래
    [1, 0, [ax-bw,ay-bw, ax,ay, ax,ay+ah, ax-bw,ay+ah+bw]],           // 왼쪽
  ];
  for(const [nx,ny,poly] of faces){
    const lit=(nx*ld[0]+ny*ld[1])/n;
    // 코어는 매트 속살이라 밝지만(+.10) 면 방향이 지배한다 —
    // 위 사면은 아래를 향해 그늘지고(음수) 아래 사면은 위를 향해 밝다.
    // ⚠️ 실측: 이 낙차가 골든 33 인데 우리는 **150** 이었다 — 흰 매트에서 밝은 링으로 보인다.
    quadFill(ctx,poly, shade(matColor, (.10 + 0.40*lit)*SYN_EDGE*v));
  }
}

function bandPath(ctx,W,H,m){ ctx.beginPath(); ctx.rect(0,0,W,H);
  ctx.rect(m.l,m.t,W-m.l-m.r,H-m.t-m.b); }
const uni = t => ({t,r:t,b:t,l:t});

// ============================================================
//  프레임 몰딩 엔진
// ============================================================
const SIDE_LIGHT=[0.28,-0.10,-0.28,0.12]; // top,right,bottom,left

function sideBand(W,H,s,d0,d1){
  switch(s){
    case 0: return [d0,d0, W-d0,d0, W-d1,d1, d1,d1];
    case 1: return [W-d0,d0, W-d1,d1, W-d1,H-d1, W-d0,H-d0];
    case 2: return [d0,H-d0, W-d0,H-d0, W-d1,H-d1, d1,H-d1];
    case 3: return [d0,d0, d1,d1, d1,H-d1, d0,H-d0];
  }
}
function quadFill(ctx,p,fill){ ctx.beginPath(); ctx.moveTo(p[0],p[1]);
  for(let i=2;i<8;i+=2) ctx.lineTo(p[i],p[i+1]); ctx.closePath(); ctx.fillStyle=fill; ctx.fill(); }

// ============================================================
//  액자 살의 **방향광** — 사진 액자를 방에 맞춰 다시 비춘다
// ============================================================
// 왜 필요한가 (2026-08-30 실측):
//   사진 액자(GPT 생성)는 스튜디오 확산광으로 찍혀 **네 변이 똑같이 밝다.**
//   그대로 방에 걸면 위살 180 / 아래살 180 — 밝기차 0. 그러면 아무리 결이 살아 있어도
//   **인쇄한 띠**로 읽힌다. FrameIt 은 같은 자리에서 위살 168 / 아래살 145 (차이 23~90).
//   그게 '몰딩'과 '띠'를 가르는 가장 큰 신호였다.
//
// 모델: 몰딩을 **세 면**으로 본다.
//   ① 바깥 모따기(outer) — 살 바깥 18%, 법선은 그 변의 바깥쪽
//   ② 앞면(front)        — 가운데 56%, 법선은 보는 사람 쪽(광원 영향 작음)
//   ③ 안쪽 사면(rebate)  — 안쪽 26%, 법선은 ①의 반대. 작품으로 내려가는 면이라
//                          기본적으로 그늘지고, 이게 곧 '작품이 뒤로 들어갔다'는 신호다.
// 코너는 마이터라 각 면을 **사다리꼴로 클립**한다 — 사각형으로 칠하면 코너가 두 번 어두워진다.
const FACE_OUT=0.18, FACE_FRONT=0.74;   // 살 폭 대비 면 경계 (③ 은 0.74~1.0)

// ⚠️⚠️ **합성 음영 세기 — 원본 액자 사진이 주인공이고 우리 음영은 거들 뿐이다.**
//   사진 액자는 이미 실제 제품 사진이라 베벨·결·명암을 다 갖고 있다. 그 위에 우리가
//   프로파일을 다시 그리면 "real frame + many synthetic effects" 가 된다.
//   2026-08-31 실측(mat.py, 골든 대조):
//     개구부 사면 낙차 골든 33 ↔ 우리 **150** · 틈 깊이 골든 21% ↔ 우리 **74%**
//     살 단면 낙차 골든 7~54 ↔ 우리 중앙 **91**
//   눈으로도 [액자 → 흰 테두리 → 검은 선 → 흰 매트 → 작품] 이 층층이 보였다.
//   레이어가 몇 겹이든 **하나의 실제 물체**로 보여야 한다.
//   이 상수 하나로 전체 세기를 조절한다 — 올릴 땐 반드시 mat.py·run.py 로 골든과 대조할 것.
// ⚠️ **한 노브로 일괄 조절하지 말 것.** 0.40 을 전부에 걸었더니 층은 줄었지만
//   **장면 광원 추종까지 깎였다** — 위살↔아래살 밝기차가 골든 30~90 인데 19.8 로
//   떨어져, 브리핑이 "유지하라"고 한 scene-adaptive lighting 이 죽었다. 둘로 나눈다.
//     DIR  : 면의 **방향광**(바깥면/앞면/옆면). 이건 '층'을 만들지 않는다 — 유지한다.
//     EDGE : **테두리·링·띠**(아리스, 매트 개구부 사면, 리베이트, 액자가 매트에 지는 그늘).
//            사용자가 본 [액자 → 흰 테두리 → 검은 선 → 흰 매트] 가 전부 여기서 나온다.
const _synQ=(k,d)=>{ try{ const v=parseFloat(new URLSearchParams(location.search).get(k));
  return isFinite(v)&&v>=0&&v<=2 ? v : d; }catch(e){ return d; } };
// ── 폴백 사다리 (브리핑 AUTOMATIC FALLBACKS) — `?level=0..3` ──────────────────
//   0 원본 자산만 (워프·노출만. 합성 음영·그림자·폐색 전부 끔)
//   1 최소 장면 통합 (노출·톤·벽 명암 + 접지 그림자)
//   2 기하 기반 통합 (안쪽 사면 폐색 · 이음매 · 매트 사면 · 리베이트)
//   3 방향광까지 (살의 잔차 재조명 · 투영 그림자)  ← 기본
// ⚠️ **"가장 낮은 단계를 고르라"는 요구는 전역 스위치로 만들면 안 된다.** 자산마다
//   필요한 게 다르기 때문이다 — 실제 선택은 **액자별로 자동**으로 일어난다:
//   검정·월넛·골드는 자산이 이미 장면과 맞아 `shadeFrameProfile` 이 아무것도 안 그리고
//   (실측 add=0.0), 사진 액자는 `modeled≈1` 이라 단면 프로파일이 통째로 꺼진다.
//   이 쿼리는 **사람이 하나씩 빼 보며 원인을 찾는 도구**다(브리핑 9번 debug mode).
const LEVEL=(()=>{ try{ const v=parseInt(new URLSearchParams(location.search).get('level'),10);
  return (v>=0&&v<=3)? v : 3; }catch(e){ return 3; } })();
const SYN_DIR=LEVEL>=3 ? _synQ('syndir', 0.85) : 0;
const SYN_EDGE=LEVEL>=2 ? _synQ('syn', 0.35) : 0;
// (개구부 립 `LIP` 은 2026-08-31 제거 — 무엇을 해도 1px 밝은 선이 됐다. shadeFrameProfile 주석 참고)
const FACE_NORMAL=[[0,-1],[1,0],[0,1],[-1,0]];   // s: 0 위 1 오른쪽 2 아래 3 왼쪽

// 마이터를 지킨 사다리꼴 — 살 두께가 변마다 달라도 맞는다 (d0,d1 = 살 폭 대비 0~1)
function mitreBand(W,H,s,l,t,r,b,d0,d1){
  const X=(d)=>[l*d, W-r*d], Y=(d)=>[t*d, H-b*d];
  const [x0a,x1a]=X(d0), [x0b,x1b]=X(d1), [y0a,y1a]=Y(d0), [y0b,y1b]=Y(d1);
  switch(s){
    case 0: return [x0a,y0a, x1a,y0a, x1b,y0b, x0b,y0b];
    case 1: return [x1a,y0a, x1a,y1a, x1b,y1b, x1b,y0b];
    case 2: return [x0a,y1a, x0b,y1b, x1b,y1b, x1a,y1a];
    case 3: return [x0a,y0a, x0b,y0b, x0b,y1b, x0a,y1a];
  }
}

// ⚠️⚠️ **맞닿은 밴드는 1px 겹쳐 그릴 것 — 안 그러면 경계에 밝은 선이 남는다.**
//   canvas 는 폴리곤 가장자리를 안티에일리어싱하므로, 공유하는 경계 픽셀을 양쪽이
//   각각 **절반만** 덮는다. 곱연산에서 절반 알파를 두 번 거는 것은 온전히 한 번 거는
//   것보다 **덜 어둡다** → 그 1px 만 밝게 뜬다. 실측(골드 액자, 원본 픽셀):
//   `118 151 120` — 살의 85% 자리에 1px 짜리 밝은 선(잔차 32, 골든 최대 14.4).
//   눈에는 '액자에 그어 놓은 가는 선'으로 보인다(브리핑 2번이 금지한 그것).
//   해법은 안쪽 끝을 1px 만큼 넘겨 그려 다음 밴드가 그 위를 온전히 덮게 하는 것이다.
const seamPad=(rail)=>Math.min(0.03, 1.2/Math.max(1,rail));

// f<1 이면 곱연산으로 어둡게, f>1 이면 스크린으로 밝게. 색을 갈아치우지 않고 밝기만 준다.
function shadeBand(ctx,poly,f){
  if(Math.abs(f-1)<0.004) return;
  ctx.save();
  if(f<1){ ctx.globalCompositeOperation='multiply';
    quadFill(ctx,poly,`rgba(28,22,16,${Math.min(.82,1-f).toFixed(3)})`); }
  else { ctx.globalCompositeOperation='screen';
    quadFill(ctx,poly,`rgba(255,248,235,${Math.min(.55,(f-1)*0.9).toFixed(3)})`); }
  ctx.restore();
}

// 살을 가로지르는 방향의 그라디언트 축 (바깥 → 안쪽)
function bandAxis(ctx,W,H,s,l,t,r,b,d0,d1){
  switch(s){
    case 0: return ctx.createLinearGradient(0,t*d0,0,t*d1);
    case 1: return ctx.createLinearGradient(W-r*d0,0,W-r*d1,0);
    case 2: return ctx.createLinearGradient(0,H-b*d0,0,H-b*d1);
    default: return ctx.createLinearGradient(l*d0,0,l*d1,0);
  }
}

// ⚠️ **안쪽 사면은 평평하게 칠하지 말 것.** 균일한 회색 띠는 '테두리를 그렸다'로 보인다.
//    실제 사면은 앞면에서 작품 쪽으로 내려가며 점점 그늘지는 **면**이다. 그 낙차가
//    있어야 각도가 읽힌다. (f0 = 앞면 쪽 밝기 배수, f1 = 작품 쪽 밝기 배수)
// ⚠️⚠️ **곱연산 그늘색은 어두운 액자에서 '바닥'이 된다.** `rgba(28,22,16)` 를 alpha a 로
//   곱하면 결과는 `base·(1−a) + 22a` 다. 밝은 살(211)에서는 22 가 무시할 만하지만
//   **검은 액자(살 41)에서는 22 가 살의 절반**이라 아무리 진하게 걸어도 어두워지지 않는다
//   — 실측(2026-09-01): 리베이트 폐색을 19% 로 걸었는데 실제 낙차는 6% 였고, 그래서
//   검정·월넛의 `rebate_ratio` 만 임계 아래로 떨어졌다(밝은 액자는 멀쩡했다).
//   ⚠️ 색 없는 순수 곱셈(`base·(1−a)`)은 **채도를 빼지 않는다** — 전 채널에 같은 배율이라
//      색상비가 그대로 보존된다. 따뜻한 그늘색은 '하늘빛 반사'를 흉내낸 취향이고,
//      깊은 리베이트처럼 **반사광이 못 들어오는 자리**에는 근사 검정이 물리적으로 맞다.
const SHADE_WARM='28,22,16', SHADE_OCCL='6,6,8';
function shadeBandGrad(ctx,W,H,s,l,t,r,b,d0,d1,f0,f1,tint){
  const poly=mitreBand(W,H,s,l,t,r,b,d0,d1);
  const g=bandAxis(ctx,W,H,s,l,t,r,b,d0,d1);
  const T=tint||SHADE_WARM;
  const dark=(f)=>`rgba(${T},${Math.max(0,Math.min(.85,1-f)).toFixed(3)})`;
  g.addColorStop(0,dark(f0)); g.addColorStop(1,dark(f1));
  ctx.save(); ctx.globalCompositeOperation='multiply';
  quadFill(ctx,poly,g); ctx.restore();
}

// 밝기 배수를 **양방향으로** 램프한다(f<1 어둡게 / f>1 밝게).
// ⚠️ `shadeBand` 는 밴드 하나를 **평평하게** 칠한다 — 개구부 립처럼 살의 5% 밖에 안 되는
//    자리에 쓰면 그건 면이 아니라 **1px 밝은 선**이 된다(브리핑 2·3번이 금지한 그것).
//    실제 몰딩의 립은 모서리가 둥글려진 자리라 밝기가 램프로 오른다.
function shadeBandRamp(ctx,W,H,s,l,t,r,b,d0,d1,f0,f1){
  const poly=mitreBand(W,H,s,l,t,r,b,d0,d1);
  const mk=(pick)=>{ const g=bandAxis(ctx,W,H,s,l,t,r,b,d0,d1);
    g.addColorStop(0,pick(f0)); g.addColorStop(1,pick(f1)); return g; };
  const dark=(f)=>`rgba(28,22,16,${Math.max(0,Math.min(.85,1-f)).toFixed(3)})`;
  const lite=(f)=>`rgba(255,248,235,${Math.max(0,Math.min(.55,(f-1)*0.9)).toFixed(3)})`;
  ctx.save();
  if(f0<1||f1<1){ ctx.globalCompositeOperation='multiply'; quadFill(ctx,poly,mk(dark)); }
  if(f0>1||f1>1){ ctx.globalCompositeOperation='screen'; quadFill(ctx,poly,mk(lite)); }
  ctx.restore();
}

/** 액자 살에 방향광 + 안쪽 사면 그늘(리베이트)을 입힌다.
 *  ld = 빛이 **오는** 방향 (예: [-1,-1] 좌상단). l,t,r,b = 변별 살 두께(px). */
// 균일 항의 목표 진폭과 안전 상한. 진폭은 '이 방에서 그 변이 받아야 할 밝기',
// 상한은 '한 번에 이만큼 넘게는 손대지 않는다'(자산이 크게 틀려도 난폭해지지 않게).
const UNI_AMP=0.11, UNI_CLAMP=0.16;
// ── 매트 없이 걸 때의 리베이트(안쪽 사면) — **골든 실측 프로파일** ──────────────────
// 골든 5장(FrameIt, `cases/case_0*/frameit_reference.png` — 재 보니 **전부 매트 없음**)의
// 살 단면은 한결같다. 앞면(평탄) → 3~5px 에 걸쳐 **깊은 골** → 3~5px 에 걸쳐 **회복** → 작품:
//     case_00 오크   앞면 164 → 골 37 (0.23) → 회복 80 (0.49)
//     case_01 금장   앞면 167 → 골 38 (0.23) → 회복 92 (0.55)
//     case_05 플로터 앞면 163 → 골 35 (0.21) → 회복 103 (0.63)
//     case_06 플로터 앞면 178 → 골 63 (0.35) → 회복 77 (0.43)
//     case_09 화이트 앞면 152 → 골 60 (0.40) → 회복 67 (0.44)
// 우리는 골이 **0.58~0.67**(오크·골드)로 얕고 회복이 **0.83~1.54**(검정)로 높았다.
// 1.54 는 앞면보다 **밝은** 띠다 — 파인 자리가 노출면보다 밝을 수는 없으므로 물리적으로
// 불가능하고, 화면에서는 검은 액자와 작품 사이의 **회색 줄**로 읽힌다(사용자가 든 실패 조건).
// ⚠️ 골이 깊다고 '검은 띠'가 되지 않는 이유는 **좁아서**다 — 골든도 바닥은 1~2px 이고
//    곧바로 회복한다. 깊이가 아니라 **폭**이 층을 만든다(44f 에서 얻은 교훈).
// ⚠️ 골든 값 중앙(0.23/0.49)보다 보수적으로 잡았다. 우리 판은 화면까지 한 번 더 축소되므로
//    같은 숫자를 그대로 쓰면 실제로는 더 진하게 보인다.
// 골 위치는 **리베이트 구간 안의 비율**로 둔다(절대 d 가 아니라). 절차적 액자는 앞면이
// 0.80 까지라 구간이 좁은데, 0.90 을 그대로 쓰면 0.85→0.90 사이 1.5px 에 골을 파야 해서
// 절벽이 된다. 비율로 두면 어느 액자에서나 같은 **모양**이 나온다(사진 액자 0.74+0.26*0.62≈0.90 — 종전과 같다).
// REB_RISE = 골에서 개구부까지 허용하는 **오름폭**(앞면 대비). 골든 실측 0.01~0.36.
const REB_TROUGH=0.30, REB_TIP=0.55, REB_TROUGH_U=0.62, REB_N=14, REB_RISE=0.30;
// 안쪽 사면의 **사방 공통** 폐색 깊이(그 자리 밝기 대비). 방향 성분은 자산에 이미 있다.

      const FF = rebOnly ? (PLANE_OUT+PLANE_FRONT) : FACE_FRONT;
      const ez = Math.min(e, (1-FF)*0.20);
      // ⚠️⚠️ **해상도 판정은 판이 아니라 '화면에 몇 px 로 그려지는가'로.** 예전엔 판 좌표로
      //   쟀는데 판은 작품 원본 크기라 늘 넉넉했다 — 실내 장면에서 실제 리베이트가 5px 인데도
      //   '11px 짜리'로 알고 온전한 깊이를 넣어 **선**이 됐다. `o.scale` 이 그 배율이다.
      const zone=[t,r,b,l][s]*(1-FF)*(o.scale==null?1:o.scale);
      // ⚠️⚠️ **못 그릴 만큼 좁으면 골만 얕게 하지 말고 '없음'으로 수렴시킬 것.**
      //   예전엔 골만 REB_TIP 으로 붙여서, 좁아지면 골=끝인 **평평한 어두운 띠**가 남았다
      //   (실측 band 0.01~0.07 — 골든은 0.28). 평평한 띠는 정확히 '그어 놓은 선'이다.
      //   양 끝을 함께 1 로 보내면 **V 모양은 유지한 채 세기만** 줄어, 좁을수록 자연히 사라진다.
      //   골든이 그 증거다 — 살 8px 짜리 case_06 은 실제 사진인데도 골이 0.87(=거의 없음)이다.
      const kd=Math.max(0,Math.min(1,(zone-1.5)/8));
      const trough=1-(1-REB_TROUGH)*kd;
      const td=FF+(1-FF)*REB_TROUGH_U;
      // ⚠️⚠️ **회복은 '실제로 그려질 골' 기준으로 제한할 것.**
      //   결과는 `min(자산, 목표)` 라, 자산이 목표보다 깊으면 골은 **자산의 것**이 된다.
      //   그런데 회복(tip)은 우리 목표를 그대로 따르므로, 자산 골이 깊은 액자에서는
      //   골→끝 오름폭이 커져 개구부 2px 앞에 **밝은 링**이 생긴다.
      //   실측(2026-09-01, 새로 들어온 얇은 액자 3종): 개구부를 **흰 판**으로 찍어
      //   마지막 5px 이 앞면의 1.01·1.25·**3.39배**까지 치솟는다(월넛). 3.4배짜리 안쪽
      //   살은 물리적으로 없다 — 촬영용 흰 판이 개구부 검출 경계 안쪽에 남은 것이다.
      //   골든의 골→끝 오름폭은 최대 0.36 이므로 그 안으로 묶는다. 자산 골이 얕은
      //   큰 액자에서는 한도가 이미 넉넉해 **아무 일도 일어나지 않는다**(오크·화이트 무변화).
      const rt=Math.min(assetRel(A,td,s), trough);
      // ⚠️⚠️ **회복(골→개구부의 되밝아짐)도 해상도로 막을 것.** 회복은 물리적으로 맞지만
      //   (골든 case_00 은 0.23 → 0.49 로 되올라온다) 그걸 **2~3px 안에** 그리면 개구부
      //   직전에 **밝은 링**이 된다. 실측(2026-09-01): 오크는 회복 구간이 4.3px 라 자연스러운데,
      //   얇은 실버는 2.6px 라 같은 비율(1.8배)인데도 임펄스 44.6(골든 최대 27.4)이었다.
      //   ⚠️ 자산의 립 때문이 아니다 — 얇은 실버의 자산은 개구부 직전이 0.94~1.05 로
      //      **깨끗한데도** 그랬다. 반대로 검정·월넛 자산은 2.6~3.7배인데 통과한다(살이 넓다).
      //      즉 원인은 밝기가 아니라 **폭**이다. 못 그릴 폭이면 회복을 접고 단조로 둔다.
      const recPx=(1-FF)*(1-REB_TROUGH_U)*[t,r,b,l][s]*(o.scale==null?1:o.scale);
      const krec=Math.max(0,Math.min(1,(recPx-2)/2));
      const tip0=Math.min(1-(1-REB_TIP)*kd, rt+REB_RISE);
      const tip=trough+(tip0-trough)*krec;
      const key=[[FF-ez,1],[FF+ez,1-0.07*kd],[td,trough],[1,tip]];
      // ⚠️ 마디를 **직선으로 잇지 말 것.** 리베이트는 두 평면이 만나는 각이 아니라 **오목한
      //   곡면**이다. 꺾인 자리는 축소될 때 대비가 몰려 '가장자리가 뚜렷한 띠'로 보인다.
      //   골든 단면은 2차 미분이 완만하다(166→37→62 가 부드럽게 이어진다). smoothstep 으로 잇는다.
      const at=(d)=>{
        if(d<=key[0][0]) return key[0][1];
        for(let i=1;i<key.length;i++) if(d<=key[i][0]){
          const a=key[i-1], b=key[i];
          const u=(d-a[0])/Math.max(1e-6,b[0]-a[0]);
          return a[1]+(b[1]-a[1])*(u*u*(3-2*u)); }
        return key[key.length-1][1];
      };
      // 방향 성분(rb/RB)은 그대로 곱한다 — 그늘진 변의 사면이 조금 더 깊다.
      const dir=RB>0.02 ? rb/RB : 1;
      const s0=FF-ez;
      for(let i=0;i<=REB_N;i++){
        const d=s0+(1-s0)*i/REB_N;
        stops.push([d, Math.min(1, at(d)*dir/Math.max(0.02, assetRel(A,d,s)))]);
      }
    } else {
      stops.push(
        [d0,    Math.min(1, rb*(1+0.30*P))],
        [0.92,  rb],                          // 가장 깊은 골 — 좁고 **얕게**
        // 회복 스톱은 **매트에서 되돌아오는 반사광**이다. 매트가 있을 때만 존재한다.
        [1,     rb*1.12]);
    }
    // ── 균일 항 = **잔차(residual)**. 여기가 8차의 핵심이다 ─────────────────────
    // ⚠️ **방향광을 모따기에만 실으면 안 된다.** 모따기를 줄이면 위살↔아래살 밝기차
    //   (`dir_tb`, 장면 광원 추종의 증거)까지 같이 죽는다. 실제로도 빛을 받는 쪽 살은
    //   **면 전체가** 조금 더 밝다 — 살 전체에 걸리는 **균일 항**으로 나눠 싣는다.
    //   균일 항은 살을 가로지르는 대비를 만들지 않으므로 '테두리'로 보이지 않는다.
    // ⚠️⚠️ **그 균일 항을 상수로 두지 말 것.** 예전엔 `1 + 0.11*SYN_DIR*lit` 라
    //   자산이 무엇이든 같은 양을 더했다. 실측 결과(assetlight.mjs):
    //     black/gold/walnut — 이미 +15~28 인데 **또 +7~21** 을 더했다(중복)
    //     oak/white         — 자산이 −17/−41 인데 +13~29 로 **싸우다 지고**
    //                          −2~−24 라는 모순된 중간이 남았다
    //   지금은 want(이 방에서 그 변이 받아야 할 밝기)와 have(자산에 이미 있는 값)를
    //   비교해 **모자란 만큼만** 채운다. 이미 충분하면 **아예 손대지 않는다**
    //   (브리핑 VISUAL STOP CONDITION: 물리적으로 그럴듯하면 거기서 멈춘다).
    //   ⚠️ have 와 want 의 부호가 **반대**면 그건 자산이 이 방과 어긋난다는 뜻이다.
    //      그때 '덜 건다'로 대응하면 두 램프가 겹친 뿌연 중간이 남는다 —
    //      브리핑이 금지한 "incorrect adaptive lighting" 이 정확히 그 상태다.
    //      **한 번에 목표까지 옮기되**(램프는 하나만 남는다) 상한으로 난폭함을 막는다.
    // ⚠️ **목표(want)는 노브와 무관한 물리량이다.** 예전 자리에 `SYN_DIR` 을 곱했더니
    //   `?syndir=0`(=합성 완전 끔)에서 want=0 이 되어 **자산의 방향광까지 지워 버렸다** —
    //   그러면 `syncheck.py` 의 '합성 끈 기준 렌더'가 원본이 아니게 되어 차등 측정이
    //   통째로 거짓이 된다. 노브는 **개입량 전체**에만 곱한다(0 = 원본 그대로).
    const want=UNI_AMP*lit;
    const have=(s===0? A.tb/2 : s===2? -A.tb/2 : s===3? A.lr/2 : -A.lr/2);
    let delta;
    if(want!==0 && have*want>0 && Math.abs(have)>=Math.abs(want)) delta=0;   // 이미 충분 — 보존
    else delta=(want-have)*SYN_DIR;
    const uni=1 + Math.max(-UNI_CLAMP, Math.min(UNI_CLAMP, delta));
    const OV = rebOnly ? 0.06 : 0;              // 이음매 너머로 끌 길이(살 폭 대비)
    const poly=mitreBand(W,H,s,l,t,r,b,0,1+OV);
    // ⚠️⚠️ **균일 항은 스톱에 곱하지 말고 따로 걸 것.** 그라디언트의 밝히는 쪽은 `screen`
    //   인데, 밝은 액자(화이트 살 200+)에서는 헤드룸이 없어 **요청한 +16% 가 +3.8% 로
    //   뭉개진다**(실측). 잔차 보정이 통째로 무력해진다 — `applyRailGain` 주석 참고.
    //   그쪽은 `lighter` 로 자기 자신을 더해 **정확한 곱셈**을 만든다.
    if(!rebOnly) applyRailGain(ctx,poly,uni,o.plate);   // 방향광은 절차적 액자가 따로 그린다
    // 깊은 폐색에는 근사 검정을 쓴다 — 따뜻한 그늘색은 어두운 액자에서 **바닥**이 된다
    // (검은 살 41 에 색값 22 를 섞으면 아무리 걸어도 안 어두워진다. SHADE_OCCL 주석 참고).
    const tint = P<=0.02 ? SHADE_OCCL : SHADE_WARM;
    if(OV) stops.push([1+OV*0.5, 1], [1+OV, 1]);   // 이음매 너머 = 무변화
    const gm=bandAxis(ctx,W,H,s,l,t,r,b,0,1+OV);
    const gs=bandAxis(ctx,W,H,s,l,t,r,b,0,1+OV);
    let prev=-1, any=false;
    for(const [pRaw,f] of stops){
      const pos=Math.max(prev+1e-4, Math.min(1, pRaw/(1+OV))); prev=pos;
      if(Math.abs(f-1)>0.004) any=true;
      gm.addColorStop(pos, `rgba(${tint},${Math.max(0,Math.min(AMAX,1-f)).toFixed(3)})`);
      gs.addColorStop(pos, `rgba(255,248,235,${Math.max(0,Math.min(.55,(f-1)*0.9)).toFixed(3)})`);
    }
    // ⚠️⚠️ **소수점 좌표 액자에서는 곱연산 폴리곤을 이음매 **너머**까지 끌 것.**
    //   절차적 액자는 `border` 가 소수라 작품 원점(`ax`)이 정수 픽셀에 안 떨어진다.
    //   그러면 살의 마지막 픽셀이 폴리곤에 **절반만** 덮여 절반의 알파만 받는다 —
    //   리베이트로 살을 88 까지 내려놨는데 그 한 픽셀만 150 쯤에 남아, 축소되면
    //   작품(74)과 섞여 **115 짜리 밝은 실선**이 된다(실측 오크 슬림: 80 81 89 **115** | 74).
    //   사진 액자는 `l` 이 정수라 이 문제가 없어서 여태 안 드러났다.
    //   폴리곤을 6% 더 끌고, 그 구간에서 배율을 1 로 되돌린다 — 이음매 픽셀은 살과 작품이
    //   물리적으로 섞인 자리라 **부분적으로 어두운 게 옳고**, 그 너머 작품은 손대지 않는다.
    //   (작품 위에 검은 선을 긋는 것과 다르다 — 알파가 1px 안에 0 으로 사라진다)
    if(!any) continue;
    ctx.save();
    ctx.globalCompositeOperation='multiply'; quadFill(ctx,poly,gm);
    ctx.globalCompositeOperation='screen';   quadFill(ctx,poly,gs);
    ctx.restore();
  }
}

/** 리베이트 — 액자(·매트)가 작품 위에 드리우는 그림자.
 *  작품이 **액자 뒤로 들어가 있다**는 신호는 실질적으로 이것 하나뿐이다.
 *  ⚠️ 사방을 똑같이 주지 말 것 — 빛을 향한 변이 진하고 반대편은 옅다. 균일하면
 *     '테두리를 그렸다'로 보이고 깊이가 안 생긴다. (FrameIt 실측: 살 대비 44~131 레벨) */
function rebateShadow(ctx,ax,ay,aw,ah,base,ld){
  const n=Math.hypot(ld[0],ld[1])||1, L=[ld[0]/n, ld[1]/n];
  const k=Math.max(2.5, base*.022);
  ctx.save();
  ctx.beginPath(); ctx.rect(ax,ay,aw,ah); ctx.clip();
  // s: 0 위 1 오른쪽 2 아래 3 왼쪽 — 그 변의 안쪽 사면이 빛을 향하면 그림자가 옅다
  const sides=[
    [0,-1, ax,ay, ax,ay+k, aw,k],
    [1, 0, ax+aw,ay, ax+aw-k,ay, k,ah],
    [0, 1, ax,ay+ah, ax,ay+ah-k, aw,k],
    [-1,0, ax,ay, ax+k,ay, k,ah],
  ];
  for(const [nx,ny,x0,y0,x1,y1] of sides){
    const lit=nx*L[0]+ny*L[1];               // +1 = 그 변이 빛 쪽
    // ⚠️ 45° 코어 사면·액자 그림자와 **겹친다**. 예전 값이면 개구부가 새까매져
    //    (매트 대비 낙차 90%, FrameIt 은 48%) 오히려 '오려 낸 구멍'으로 보인다.
    const a=0.22*SYN_EDGE*Math.max(0.18, (1-lit)/2 + 0.18);   // 틈 깊이 골든 21% 기준
    const g=ctx.createLinearGradient(x0,y0,x1,y1);
    g.addColorStop(0,`rgba(0,0,0,${a.toFixed(3)})`);
    g.addColorStop(0.55,`rgba(0,0,0,${(a*0.28).toFixed(3)})`);
    g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g; ctx.fillRect(ax,ay,aw,ah);
  }
  ctx.restore();
  // ⚠️⚠️ **작품 둘레에 검은 선을 두르지 말 것** (브리핑 체크리스트 "no black stroke
  //    around artwork", 2026-08-31). 예전엔 여기서 `strokeRect(rgba(0,0,0,.30))` 로
  //    작품 경계를 한 바퀴 둘렀다. 사방 균일한 stroke 는 깊이 신호가 아니라 **오려 낸
  //    자국**이고, 실측에서 틈 최대 낙차를 골든(44)의 두 배(89)로 밀어 올린 주범이었다.
  //    깊이는 위의 방향성 그라디언트(빛을 향한 변이 진하다)가 이미 만든다.
}

/** 매트(대지) 표면의 완만한 광량 기울기 — 균일한 색면은 즉시 CG 로 읽힌다. */
function shadeMatSurface(ctx,x,y,w,h,ld){
  const n=Math.hypot(ld[0],ld[1])||1;
  const g=ctx.createLinearGradient(x,y,x-ld[0]/n*w,y-ld[1]/n*h);
  g.addColorStop(0,'rgba(255,255,255,.085)');
  g.addColorStop(1,'rgba(0,0,0,.075)');
  ctx.save(); ctx.fillStyle=g; ctx.fillRect(x,y,w,h); ctx.restore();
}

function drawMolding(ctx,W,H,m,style,color){
  const N=18;
  for(let s=0;s<4;s++){
    for(let i=0;i<N;i++){
      const t0=i/N, t1=(i+1)/N+0.002, tm=(t0+t1)/2;
      const relief=style.profile(tm);
      const v=SIDE_LIGHT[s]+relief*style.depth;
      quadFill(ctx, sideBand(W,H,s,m*t0,m*Math.min(1,t1)), shade(color,v));
    }
  }
  if(style.grain){
    for(let s=0;s<4;s++){
      ctx.save(); const p=sideBand(W,H,s,0,m);
      ctx.beginPath(); ctx.moveTo(p[0],p[1]); for(let i=2;i<8;i+=2) ctx.lineTo(p[i],p[i+1]);
      ctx.closePath(); ctx.clip();
      const rnd=prng(7+s);
      for(let k=0;k<24;k++){
        const d=rnd()*m, a=.03+rnd()*.05, wob=(rnd()-.5)*m*.2;
        ctx.strokeStyle=`rgba(35,20,8,${a})`; ctx.lineWidth=Math.max(.5,m*.018*(0.4+rnd()));
        ctx.beginPath();
        if(s===0){ ctx.moveTo(0,d); ctx.bezierCurveTo(W*.33,d+wob,W*.66,d-wob,W,d); }
        else if(s===2){ const y=H-d; ctx.moveTo(0,y); ctx.bezierCurveTo(W*.33,y+wob,W*.66,y-wob,W,y); }
        else if(s===3){ ctx.moveTo(d,0); ctx.bezierCurveTo(d+wob,H*.33,d-wob,H*.66,d,H); }
        else { const x=W-d; ctx.moveTo(x,0); ctx.bezierCurveTo(x+wob,H*.33,x-wob,H*.66,x,H); }
        ctx.stroke();
      }
      ctx.restore();
    }
  }
  if(style.speckle){
    ctx.save(); bandPath(ctx,W,H,uni(m)); ctx.clip('evenodd');
    const rnd=prng(11); const n=Math.min(700,Math.round((W+H)*.45));
    for(let k=0;k<n;k++){
      const x=rnd()*W, y=rnd()*H, r=Math.max(.4,m*(.015+rnd()*.03));
      ctx.fillStyle = rnd()<.5? 'rgba(50,32,8,.10)' : 'rgba(255,242,200,.13)';
      ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fill();
    }
    ctx.restore();
  }
  // 마이터 이음새
  ctx.strokeStyle='rgba(0,0,0,.13)'; ctx.lineWidth=Math.max(.6,m*.012);
  ctx.beginPath();
  ctx.moveTo(0,0); ctx.lineTo(m,m); ctx.moveTo(W,0); ctx.lineTo(W-m,m);
  ctx.moveTo(0,H); ctx.lineTo(m,H-m); ctx.moveTo(W,H); ctx.lineTo(W-m,H-m);
  ctx.stroke();
  const ow=Math.max(1,m*.02);
  ctx.strokeStyle='rgba(0,0,0,.38)'; ctx.lineWidth=ow;
  ctx.strokeRect(ow/2,ow/2,W-ow,H-ow);
  ctx.strokeStyle='rgba(0,0,0,.32)'; ctx.lineWidth=Math.max(1,m*.015);
  ctx.strokeRect(m,m,W-2*m,H-2*m);
}

// ---- 액자 재질 색 보정 (FRAME_GRADE) ------------------------------------
// ⚠️ **우리 액자는 실제 액자보다 훨씬 쨍하다** (2026-08-30 실측).
//    살의 채도 폭(mean RGB max−min)을 FrameIt 결과물과 같은 코드로 재면
//        오크   FrameIt 24.5  ↔  우리 60.4        골드  FrameIt 36.1  ↔  우리 97.3
//    실물 나무 액자는 실내광에서 채도가 낮은 웜그레이로 찍힌다. 원색에 가까운 주황 오크·
//    놋쇠 골드는 그 자체로 **'AI 가 그린 액자'** 로 읽힌다("plastic wood").
//    그래서 재질마다 [채도, 밝기] 를 한 번만 먹여 굽는다 — 매 렌더 필터가 아니라
//    이미지 로드 때 오프스크린에 구워 두므로 비용이 0 이고, 액자칩·PDF 까지 같은 색이 된다.
// ⚠️ 검정·흰색·은색·아이보리는 이미 채도가 3~5 라 건드리지 않는다(1.0).
const FRAME_GRADE = {
  // ⚠️ 골드 채도 0.40 → 0.37 (2026-09-01). 8차의 잔차 보정이 골드 위살을 4.5% 밝히는데,
  //    `sat_rail`(살의 채도 폭 = 평균 RGB 의 max−min)은 **절대값**이라 밝기에 비례해 같이
  //    커진다 — 38.3 → 41.4 로 임계(40)를 넘었다(골든은 6~36). 밝기 배율은 채널 비를
  //    보존하므로 '더 쨍해진' 게 아니라 **지표가 밝기를 함께 재는** 것이지만, 우리 골드는
  //    원래도 골든 상한 위였다(rule 41: FrameIt 36.1 ↔ 우리 97.3 → 0.40 으로 보정).
  //    조금 더 눌러 밴드 안으로 돌린다 — 재질 사실성은 브리핑의 1급 항목이다.
  oak:[0.45,0.93], wood:[0.45,0.93], gold:[0.37,0.95], walnut:[0.72,1.0],
  black:[1,1], white:[1,1], silver:[1,1], ivory:[1,1],
  // 얇은 몰딩 3종 — **자산마다 재서** 넣는다(원본 살 채도폭: oak-thin 49.6 · walnut-thin
  // 34.2 · silver-thin 4.9). 목표는 위와 같다: FrameIt 실측대(오크 24.5)로 내린다.
  // 실버는 이미 무채색(4.9)이라 손대지 않는다 — 필요 없는 보정은 걸지 않는다.
  'oak-thin':[0.55,0.97], 'walnut-thin':[0.72,1.0], 'silver-thin':[1,1],
};
// ctx.filter 이 없는 아주 오래된 브라우저에서는 **hex 도 함께 건너뛴다** —
// 색만 바꾸고 결 텍스처를 그대로 두면 밴드와 결의 색이 어긋난다.
const CAN_FILTER=(()=>{ try{ return typeof document.createElement('canvas')
  .getContext('2d').filter==='string'; }catch(e){ return false; } })();
function gradeOf(k){ return CAN_FILTER ? (FRAME_GRADE[k] || [1,1]) : [1,1]; }
// 이미지에 채도·밝기를 구워 캔버스로 돌려준다 (ctx.filter 미지원이면 원본 그대로)
function gradeImage(img,k){
  const [s,b]=gradeOf(k);
  const w=img.naturalWidth||img.width, h=img.naturalHeight||img.height;
  if((s===1&&b===1)||!w||!h) return img;
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const x=c.getContext('2d');
  if(typeof x.filter!=='string') return img;
  x.filter=`saturate(${s}) brightness(${b})`;
  x.drawImage(img,0,0);
  // ⚠️ 캔버스를 <img> 처럼 쓰는 곳이 있다(`drawTextureSide` 가 `complete`·`naturalWidth` 로
  //    로딩 여부를 판정한다). 안 채우면 **결 텍스처가 조용히 단색 그라디언트로 폴백**한다.
  c.complete=true; c.naturalWidth=w; c.naturalHeight=h;
  return c;
}
// 색상 문자열에 같은 보정 (절차적 액자는 색이 hex 로 박혀 있다)
function gradeHex(hex,k){
  const [s,b]=gradeOf(k);
  if(s===1&&b===1) return hex;
  const c=hexToRgb(hex);
  const y=0.2126*c.r+0.7152*c.g+0.0722*c.b;
  const f=(v)=>clamp255(Math.round((y+(v-y)*s)*b));
  return `rgb(${f(c.r)},${f(c.g)},${f(c.b)})`;
}

// ---- 프레임 재질 (얇은 프레임용 — 정면 균일광 + 대각 메탈 그라데이션) ----
const MATS = {
  gold:   { light:'#f3e2a8', base:'#c9a24b', dark:'#7d5e25', edge:'rgba(255,246,212,.6)',  back:'#2b2721', texture:'frames/frame-gold-texture.jpg' },
  wood:   { light:'#d9bb8c', base:'#a9835a', dark:'#6e4f30', edge:'rgba(255,240,214,.4)',  back:'#352a1e', texture:'frames/frame-oak-texture.jpg' },
  walnut: { light:'#9b6a42', base:'#5b3722', dark:'#21130b', edge:'rgba(224,169,116,.34)', back:'#281c12', texture:'frames/frame-walnut-texture.jpg' },
  black:  { light:'#3b3b3b', base:'#1f1f1f', dark:'#070707', edge:'rgba(255,255,255,.18)', back:'#1b1b1b', texture:'frames/frame-black-texture.jpg' },
  silver: { light:'#f2f4f4', base:'#b9bfc2', dark:'#6f777c', edge:'rgba(255,255,255,.66)', back:'#262a2d', texture:'frames/frame-silver-texture.jpg' },
  ivory:  { light:'#ffffff', base:'#eee8da', dark:'#cfc5b4', edge:'rgba(255,255,255,.72)', back:'#dfd8cc', texture:'frames/frame-ivory-texture.jpg' },
  white:  { light:'#ffffff', base:'#f3f1ea', dark:'#d6d2c6', edge:'rgba(255,255,255,.7)',  back:'#e9e6dd', texture:'frames/frame-ivory-texture.jpg' },
};
Object.entries(MATS).forEach(([k,m])=>{
  // 색 보정은 hex 와 텍스처 **둘 다** 먹여야 한다 — 하나만 하면 밴드 색과 결이 어긋난다
  ['light','base','dark','back'].forEach(f=>{ if(m[f]) m[f]=gradeHex(m[f],k); });
});
// 결 텍스처는 **그 재질의 액자를 고를 때** 받는다(ensureFrameAssets). 예전엔 6장을 전부 받고 한 장마다 다시 그렸다.
// 못 받아도 `ready` 는 세운다 — drawTextureSide 가 텍스처 없이 그라디언트로 그린다(예전에도 그 폴백이었다).
function ensureMatTexture(k){
  const m=MATS[k];
  if(!m || !m.texture || m._requested) return;
  m._requested=true;
  const raw=new Image();
  raw.onload=()=>{ m.img=gradeImage(raw,k); m.ready=true; assetArrived('mat:'+k); };
  raw.onerror=()=>{ m.ready=true; assetArrived('mat:'+k); };
  raw.src=m.texture;
}
if(PRELOAD_ALL) Object.keys(MATS).forEach(ensureMatTexture);
function fillRectBand(ctx,W,H,b,fill){
  ctx.save();
  ctx.fillStyle=fill;
  ctx.beginPath(); ctx.rect(0,0,W,H); ctx.rect(b,b,W-2*b,H-2*b);
  ctx.fill('evenodd');
  ctx.restore();
}

// ⚠️ **액자는 '부드러운 리본'이 아니라 평면 세 개가 각을 이룬 막대다.**
//    ① 바깥면(벽 바깥·위를 향한 면)  ② 앞면(정면)  ③ 안쪽 사면(작품으로 내려가는 면)
//    경계를 부드럽게 이으면 **인쇄한 띠**처럼 보인다 — 경쟁사와 같은 배율로 모서리를 확대해
//    비교했을 때 이게 결정적 차이였다(2026-08-30). 각 면은 **평평하고 경계는 또렷해야** 한다.
//    면마다 밝기는 광원(좌상단) 기준으로 정해진다. 예: 윗변의 바깥면은 위를 향하므로 가장 밝고,
//    안쪽 사면은 아래를 향하므로 그늘. 아랫변은 정반대다.
// ⚠️ 예전엔 이 값이 **좌상단 광원으로 고정**돼 있었다. 장면마다 빛이 다른데
//    액자만 늘 같은 방향으로 칠해지면, 창빛이 오른쪽에서 들어오는 방에서 액자만
//    반대로 밝아 혼자 뜬다. 이제 장면의 lightDir 로 계산한다(사진 액자와 같은 모델).
//    ⚠️ 좌우 살의 **바깥면**은 약하게 — 강하게 주면 조각 둘레에 검은 테로 읽힌다
//    (실측 2026-08-30: 검은 슬림 액자 오른쪽 keyline 14.2, FrameIt 흰 액자는 8.2).
const PLANE_AMP=[
  [.48,.09,.44],   // 위   [바깥면, 앞면, 안쪽사면]
  [.26,.06,.27],   // 오른쪽
  [.48,.12,.44],   // 아래
  [.26,.04,.27],   // 왼쪽
];
function planeOf(s,ld){
  const d=ld||[-1,-1], n=Math.hypot(d[0],d[1])||1;
  const nv=FACE_NORMAL[s], lit=nv[0]*d[0]/n+nv[1]*d[1]/n;
  const [ao,af,ar]=PLANE_AMP[s];
  return [ao*lit, af*lit, -ar*lit];
}
const PLANE_OUT=0.20, PLANE_FRONT=0.60;   // 밴드 폭 대비 각 면의 비율
function planeAxis(ctx,W,H,b,s){
  if(s===0) return ctx.createLinearGradient(0,0,0,b);
  if(s===1) return ctx.createLinearGradient(W,0,W-b,0);
  if(s===2) return ctx.createLinearGradient(0,H,0,H-b);
  return ctx.createLinearGradient(0,0,b,0);
}
// 텍스처 위에 얹는 **면 음영** — 색을 덮지 않고 밝기만 계단식으로 준다
// ⚠️⚠️ `rebOwn` = 안쪽 사면을 **리베이트가 그린다**(매트 없는 평면 액자). 그때 여기서
//   사면을 또 칠하면 두 모델이 같은 면을 반대로 칠한다 — 아랫변은 사면이 위를 향해
//   planeShade 가 **밝히는데**(PLANE_AMP[2][2]=+.44) 리베이트는 폐색이라 **어둡게** 한다.
//   실측(2026-09-01): 그 경계에 밝은 봉우리가 남아 임펄스 +33~37(골든 최대 27.4).
//   물리적으로는 리베이트가 옳다 — 파인 홈은 빛을 향한 변에서도 폐색이 지배한다
//   (라운드 8 에서 사진 액자에 대해 같은 결론). 그래서 사면을 통째로 넘긴다.
function planeShade(ctx,W,H,b,s,ld,rebOwn){
  const [o,f,r0]=planeOf(s,ld); const r=rebOwn?f:r0;
  const col=(v)=> v>=0 ? `rgba(255,248,236,${Math.min(.55,v*1.05*SYN_DIR).toFixed(3)})`
                       : `rgba(18,11,4,${Math.min(.62,-v*1.05*SYN_DIR).toFixed(3)})`;
  const g=planeAxis(ctx,W,H,b,s), A=PLANE_OUT, B=PLANE_OUT+PLANE_FRONT;
  g.addColorStop(0,col(o));      g.addColorStop(A-0.005,col(o));
  g.addColorStop(A,col(f));      g.addColorStop(B-0.005,col(f));
  g.addColorStop(B,col(r));      g.addColorStop(1,col(rebOwn?r:r*1.3));
  return g;
}
// 텍스처가 없을 때의 대체 — 같은 계단 구조를 재질색으로
function frameSideGradient(ctx,W,H,b,s,c,ld,rebOwn){
  const [o,f,r0]=planeOf(s,ld); const r=rebOwn?f:r0;
  const g=planeAxis(ctx,W,H,b,s), A=PLANE_OUT, B=PLANE_OUT+PLANE_FRONT;
  g.addColorStop(0,shade(c.base,o));   g.addColorStop(A-0.005,shade(c.base,o));
  g.addColorStop(A,shade(c.base,f));   g.addColorStop(B-0.005,shade(c.base,f));
  g.addColorStop(B,shade(c.base,r));   g.addColorStop(1,shade(c.base,r*1.3));
  return g;
}

// 마이터 이음새. 두 살이 45°로 맞물린 **틈**이라 사방이 조금씩 어둡고(폐색),
// 반사 하이라이트는 **광원을 향한 코너에만** 생긴다.
// ⚠️ 예전엔 하이라이트가 늘 위쪽 두 코너에 고정이었다 — 장면 15개 중 8개가 빛이
//    오른쪽에서 오고 둘은 왼쪽이라, 대부분의 방에서 코너 하이라이트가 광원과 어긋났다.
function drawFrameMiters(ctx,W,H,b,c,ld){
  const d=ld||[-1,-1], n=Math.hypot(d[0],d[1])||1, L=[d[0]/n,d[1]/n];
  ctx.lineWidth=Math.max(.7,b*.035);
  ctx.strokeStyle='rgba(0,0,0,.18)';
  ctx.beginPath();
  ctx.moveTo(0,0); ctx.lineTo(b,b);
  ctx.moveTo(W,0); ctx.lineTo(W-b,b);
  ctx.moveTo(0,H); ctx.lineTo(b,H-b);
  ctx.moveTo(W,H); ctx.lineTo(W-b,H-b);
  ctx.stroke();
  // 코너 방향 벡터와 광원의 내적이 클수록 그 이음새가 빛을 받는다
  const corners=[[0,0,-1,-1],[W,0,1,-1],[0,H,-1,1],[W,H,1,1]];
  for(const [cx,cy,ux,uy] of corners){
    const lit=(ux*L[0]+uy*L[1])/Math.SQRT2;
    if(lit<=0.05) continue;
    ctx.strokeStyle=`rgba(255,245,220,${(0.34*lit).toFixed(3)})`;
    ctx.beginPath();
    ctx.moveTo(cx-ux, cy-uy); ctx.lineTo(cx-ux*b*.92, cy-uy*b*.92);
    ctx.stroke();
  }
}

function clipPoly(ctx,p){
  ctx.beginPath(); ctx.moveTo(p[0],p[1]);
  for(let i=2;i<8;i+=2) ctx.lineTo(p[i],p[i+1]);
  ctx.closePath(); ctx.clip();
}

function drawTextureSide(ctx,W,H,b,s,c,ld,rebOwn){
  if(!c.img || !c.img.complete || !c.img.naturalWidth){
    quadFill(ctx, sideBand(W,H,s,0,b), frameSideGradient(ctx,W,H,b,s,c,ld,rebOwn));
    return;
  }
  ctx.save();
  clipPoly(ctx, sideBand(W,H,s,0,b));
  const im=c.img;
  // ⚠️ **텍스처를 밴드에 통째로 욱여넣지 말 것.** 예전엔 1200px 나뭇결 사진을
  // 폭 13~70px 밴드에 `drawImage(...,0,0,W,b)` 로 밀어 넣어 **17~60배 압축**했다.
  // 결이 사라지고 색만 남은 띠가 되는데, 이게 "액자가 납작하다"의 정체였다(2026-08-30 확대 비교).
  //
  // 두 가지로 해결한다.
  //  ① 텍스처에서 **작은 조각만 잘라** 밴드에 맞춘다(=나뭇결을 확대). 실제 3cm 액자에는
  //     결이 대여섯 줄 보이지 화면 가득 보이지 않는다. 좌우 반전 타일링으로 이음매를 감춘다.
  //  ② 그 위에 **절차적 결**을 얹는다. 판은 최종 화면까지 2~3배 더 축소되므로
  //     사진 결만으로는 또 사라진다. 밴드 폭 기준으로 간격을 정하면 축소돼도 남는다.
  const tile=(len)=>{
    const sh=Math.max(12, Math.min(im.naturalHeight, b*0.5));     // 잘라올 텍스처 높이
    const sw=Math.max(24, Math.min(im.naturalWidth, sh*3));
    const tw=Math.max(12, sw*(b/sh));
    for(let i=0, x=0; x<len; i++, x+=tw){
      ctx.save();
      if(i%2){ ctx.translate(x+tw,0); ctx.scale(-1,1); ctx.drawImage(im,0,0,sw,sh,0,0,tw,b); }
      else ctx.drawImage(im,0,0,sw,sh,x,0,tw,b);
      ctx.restore();
    }
    // 절차적 결 — 길이 방향으로 흐르는 미세한 선. 금속이면 더 가늘고 옅게.
    const metal=(c===MATS.gold||c===MATS.silver);
    const n=metal?16:9, rnd=prng(c===MATS.wood?3:c===MATS.walnut?5:c===MATS.black?7:11);
    ctx.save();
    ctx.lineCap='round';
    for(let k=0;k<n;k++){
      const y=(k+0.35+rnd()*0.3)/n*b;
      const a=(metal?0.05:0.10)*(0.45+rnd());
      ctx.strokeStyle=rnd()<0.55?`rgba(30,18,6,${a})`:`rgba(255,240,214,${a*0.8})`;
      ctx.lineWidth=Math.max(0.6, b*(metal?0.012:0.022)*(0.5+rnd()));
      ctx.beginPath(); ctx.moveTo(0,y);
      const wob=b*0.06;
      ctx.bezierCurveTo(len*0.3,y+(rnd()-0.5)*wob, len*0.7,y-(rnd()-0.5)*wob, len,y+(rnd()-0.5)*wob*0.5);
      ctx.stroke();
    }
    ctx.restore();
  };
  if(s===0){ tile(W); }
  else if(s===2){ ctx.translate(0,H-b); tile(W); }
  else if(s===3){ ctx.translate(0,H); ctx.rotate(-Math.PI/2); tile(H); }
  else { ctx.translate(W,0); ctx.rotate(Math.PI/2); tile(H); }
  ctx.restore();

  // ── 면 음영 — 부드러운 롤 대신 **계단식 세 평면**. 여기가 '리본 vs 나무막대'를 가른다 ──
  ctx.save();
  clipPoly(ctx, sideBand(W,H,s,0,b));
  ctx.globalAlpha=1;
  ctx.fillStyle=planeShade(ctx,W,H,b,s,ld,rebOwn);
  ctx.fillRect(0,0,W,H);
  // 면과 면이 만나는 모서리(아리스) — **선이 아니라 아주 좁은 면**이다.
  // ⚠️ 예전엔 1px stroke 였다(밝은 흰 선 .30 + 검은 선 .34). 판은 화면까지 2~3배 더
  //    축소되므로 그게 곧 '액자 위에 그어 넣은 선'으로 남는다 — 실측(physics.py,
  //    64표본 리샘플): 살 단면의 얇은선 잔차가 골든 10~22.8 인데 우리는 10~42.0 이었다.
  //    실제 몰딩의 아리스는 **깎인 자리**라 2~3px 에 걸쳐 부드럽게 전이한다.
  //    세기도 절반으로 — 브리핑 2번 "변화량은 매우 작게, 빛나는 경계선이 아니라
  //    서로 다른 면이 빛을 다르게 받는 것".
  const lit0=planeOf(s,ld)[0];
  const arris=(t,rgb,peak,halfT)=>{
    const half=Math.max(.9,b*halfT), d=b*t;
    let g,bx,by,bw,bh;
    if(s===0){ g=ctx.createLinearGradient(0,d-half,0,d+half); bx=0; by=d-half; bw=W; bh=half*2; }
    else if(s===1){ g=ctx.createLinearGradient(W-d-half,0,W-d+half,0); bx=W-d-half; by=0; bw=half*2; bh=H; }
    else if(s===2){ g=ctx.createLinearGradient(0,H-d-half,0,H-d+half); bx=0; by=H-d-half; bw=W; bh=half*2; }
    else { g=ctx.createLinearGradient(d-half,0,d+half,0); bx=d-half; by=0; bw=half*2; bh=H; }
    g.addColorStop(0,`rgba(${rgb},0)`);
    g.addColorStop(.5,`rgba(${rgb},${peak.toFixed(3)})`);
    g.addColorStop(1,`rgba(${rgb},0)`);
    ctx.fillStyle=g; ctx.fillRect(bx,by,bw,bh);
  };
  arris(PLANE_OUT, lit0>=0?'255,250,240':'0,0,0', (lit0>=0?.17:.09)*SYN_EDGE, .045);
  // 앞면↔사면 아리스도 리베이트가 그린다(같은 모서리를 두 번 긋지 않는다)
  if(!rebOwn) arris(PLANE_OUT+PLANE_FRONT, '0,0,0', .20*SYN_EDGE, .050);
  ctx.restore();
}

function drawFloaterTray(ctx,W,H,b,g,back,ld,innerOcc){
  if(g<=0) return;
  const d=ld||[-1,-1], n=Math.hypot(d[0],d[1])||1;
  for(let s=0;s<4;s++){
    let grad;
    if(s===0) grad=ctx.createLinearGradient(0,b,0,b+g);
    else if(s===1) grad=ctx.createLinearGradient(W-b,0,W-b-g,0);
    else if(s===2) grad=ctx.createLinearGradient(0,H-b,0,H-b-g);
    else grad=ctx.createLinearGradient(b,0,b+g,0);
    // ⚠️ 갭을 **검은 홈**으로 두지 말 것. 플로터의 갭은 액자 안쪽 벽이 뒤로 물러난 면이라
    //    실제로는 **빛을 받는 나무면**이다(경쟁사 확대 비교). 검게 칠하면 액자가 아니라
    //    잘라낸 구멍처럼 보이고, 액자의 '두께'가 통째로 사라진다.
    //    앞(액자 쪽)은 밝고 뒤(작품 쪽)로 갈수록 어두워지는 진짜 오목면으로 그린다.
    // ⚠️⚠️ **면 밝기를 손으로 적지 말 것** — 예전엔 `[.16,.02,-.14,.08]` 고정이라
    //    ①방의 광원과 무관했고(장면 15개 중 10개가 좌상단이 아니다) ②부호가 물리와
    //    거꾸로였다. 트레이 안쪽 벽은 **안쪽을 향한 면**이라(윗변이면 아래를 향한다)
    //    위에서 오는 빛에는 **그늘져야** 하는데 위가 가장 밝게(+.16) 칠해져 있었다.
    //    실측(framelight.mjs): 좌우 광원을 뒤집어도 좌−우 살 밝기차가 그대로였다
    //    (샴페인/아이보리 sym=1.00 = 광원 무시, 오크 0.97).
    // ⚠️ 몰딩과 만나는 첫 픽셀을 가장 밝게 두면 어두운 몰딩 안쪽 끝과 붙어 **밝은 선**이
    //    된다(실측 오크 플로터 165→198, 3px 짜리 봉우리). 실제로는 몰딩이 트레이의 그
    //    자리에 그늘을 드리운다 — 살짝만 밝게 한다.
    grad.addColorStop(0, shade(back, .09));
    grad.addColorStop(.45, shade(back, .03));
    // ⚠️ **바닥을 검정에 붙이지 말 것.** 예전엔 여기에 더해 `rgba(0,0,0,.68)` 를
    //    strokeRect 로 둘러 갭 바닥이 휘도 0~1 까지 떨어졌다(실측 오크 플로터 0.0,
    //    골든 최저는 살 대비 0.110). 그게 "dark inner gap 이 black outline 으로 보인다"
    //    의 정체다. 작품이 트레이에 드리우는 접지 그림자는 바로 아래에서 따로 그린다.
    grad.addColorStop(1, shade(back, -.10));
    quadFill(ctx, sideBand(W,H,s,b,b+g), grad);
  }
  // ── 방향광은 **오목면 프로파일과 분리해서** 곱/스크린으로 얹는다 ─────────────
  // ⚠️ 밝기를 `shade(back, light+…)` 처럼 색에 더하면 **양 끝에서 뭉갠다**:
  //    아이보리 트레이(L≈216)는 밝은 쪽이 255 로 붙어 좌우 차이가 사라지고(sym 1.00),
  //    월넛 트레이(L≈29)는 어두운 쪽이 0 으로 붙는다(sym 0.75). 둘 다 실측된 값이다.
  //    곱/스크린은 **비율**이라 트레이 색과 무관하게 같은 방향성을 준다.
  for(let s=0;s<4;s++){
    const nv=FACE_NORMAL[s], lit=-(nv[0]*d[0]+nv[1]*d[1])/n;   // 안쪽 벽은 안쪽을 향한다
    if(Math.abs(lit)<0.02) continue;
    const poly=sideBand(W,H,s,b,b+g);
    ctx.save();
    if(lit<0){ ctx.globalCompositeOperation='multiply';
      quadFill(ctx,poly,`rgba(22,18,14,${(0.30*-lit).toFixed(3)})`); }
    else { ctx.globalCompositeOperation='screen';
      quadFill(ctx,poly,`rgba(255,248,236,${(0.24*lit).toFixed(3)})`); }
    ctx.restore();
  }
  // 갭 안쪽 끝(작품이 얹히는 자리)의 폐색 — **선이 아니라 좁은 그라디언트**로.
  // ⚠️⚠️ **매트가 없으면 그리지 말 것.** 매트가 있으면 이 폐색은 트레이↔매트 이음매에
  //   앉고 작품의 접지 그림자는 매트 위 작품 경계에 앉아 **서로 떨어져** 있다. 매트를 빼면
  //   `ax = border+gap` 이라 둘이 **같은 자리에 겹쳐** 작품 둘레에 검은 선이 된다
  //   (실측 nomat.py: 샴페인 플로터 10.3 → 19.5 · 아이보리 박스 14.6 → 23.5).
  //   브리핑 ANTI-COMPOUNDING — 같은 깊이 신호를 두 겹으로 쌓지 않는다. 작품이 보드 위에
  //   떠 있다는 신호는 바로 아래에서 그리는 **접지 그림자**가 이미 만든다.
  if(innerOcc===false) return;
  const k=Math.max(1.5,g*.34);
  for(let s=0;s<4;s++){
    const q=b+g;
    let grad;
    if(s===0) grad=ctx.createLinearGradient(0,q,0,q-k);
    else if(s===1) grad=ctx.createLinearGradient(W-q,0,W-q+k,0);
    else if(s===2) grad=ctx.createLinearGradient(0,H-q,0,H-q+k);
    else grad=ctx.createLinearGradient(q,0,q-k,0);
    grad.addColorStop(0,'rgba(0,0,0,.34)'); grad.addColorStop(1,'rgba(0,0,0,0)');
    quadFill(ctx, sideBand(W,H,s,q-k,q), grad);
  }
}

// 바깥 테두리 밴드(margin m)에 재질 칠하기 (레퍼런스식 얇은 박스 프레임)
function frameBand(ctx,W,H,m,mat,ld,rebOwn){
  const c=MATS[mat]||MATS.black;
  const b=m.t;
  for(let s=0;s<4;s++) drawTextureSide(ctx,W,H,b,s,c,ld,rebOwn);
  // ⚠️⚠️ **테두리를 stroke 로 두르지 말 것** (2026-08-31, 브리핑 2번).
  //    예전엔 여기서 세 줄을 그었다 — 바깥에 재질색 밝은 선(`c.edge`, 금장은
  //    rgba(255,246,212,.6)), 안쪽에 검은 선(alpha .52, 폭 b*.105), 그 안에 또
  //    밝은 선(alpha .32). 셋 다 **면이 아니라 선**이라 확대하면 "액자를 그린 뒤
  //    테두리를 덧그린" 것으로 읽힌다. 실측(physics.py): 틈 최대 낙차가 골든
  //    28.8~44.4 인데 우리는 19.5~89.0(중앙 49) — 절반이 이 선들이었다.
  //    깊이는 `drawTextureSide` 의 **면 음영**(바깥면/앞면/안쪽사면)과 아래 리베이트
  //    그라디언트가 만든다. 선은 하나도 필요 없다.
  // 살 안쪽 끝의 리베이트 — 좁지만 **면**이다(선이 아니다). 광원을 등진 변이 더 깊다.
  const n=Math.hypot(ld?ld[0]:-1, ld?ld[1]:-1)||1;
  // ⚠️ 얇은 액자(슬림)는 살이 20px 남짓이라 이 그늘이 **유일한 깊이 신호**다.
  //    검은 stroke 로 흉내내던 걸 걷어내면서 rebate_ratio 가 0.3 → 0.2 로 떨어져
  //    임계(0.24) 아래가 됐다 — 가짜 깊이를 지웠으면 **진짜 면으로 채워야** 한다.
  const k=Math.max(2,b*.22);
  for(let s=0;s<4;s++){
    const nv=FACE_NORMAL[s], lit=(nv[0]*(ld?ld[0]:-1)+nv[1]*(ld?ld[1]:-1))/n;
    const a=0.42*SYN_EDGE*Math.max(0.45,(1-lit)/2+0.45);
    let grad;
    if(s===0) grad=ctx.createLinearGradient(0,b,0,b-k);
    else if(s===1) grad=ctx.createLinearGradient(W-b,0,W-b+k,0);
    else if(s===2) grad=ctx.createLinearGradient(0,H-b,0,H-b+k);
    else grad=ctx.createLinearGradient(b,0,b-k,0);
    grad.addColorStop(0,`rgba(0,0,0,${a.toFixed(3)})`);
    grad.addColorStop(.55,`rgba(0,0,0,${(a*0.34).toFixed(3)})`);
    grad.addColorStop(1,'rgba(0,0,0,0)');
    quadFill(ctx, sideBand(W,H,s,b-k,b), grad);
  }
  drawFrameMiters(ctx,W,H,b,c,ld);
}

// ============================================================
//  사진 액자 (photo) — 실사 액자 이미지를 9-slice 로 늘려 쓴다
// ============================================================
// 절차적 액자는 아무리 다듬어도 '평면을 계단식으로 칠한 것'이라 미세 질감에서 진다.
// GPT 로 뽑은 **정면·빈 액자·흰배경** 사진에서 바깥/개구부 사각형을 검출해
// 알파 PNG(개구부 투명)로 잘라 뒀다(frames/photo/*.png, frames.json).
// ⚠️ **통짜로 늘리지 말 것** — 모서리 마이터가 같이 늘어나 즉시 가짜가 된다.
//    네 모서리는 원본 비율 그대로 두고 **네 변만 길이 방향으로 늘리는** 9-slice 로 그린다.
const PHOTO_FRAMES = {};
let PHOTO_META = null;

// ============================================================
//  자산이 **이미 갖고 있는** 조명·기하  (브리핑 SOURCE-ASSET LIGHTING PROTECTION)
// ============================================================
// 브리핑: "First estimate: 이 자산에 얼마나 많은 조명 정보가 이미 구워져 있는가?
//          이미 자연스럽게 조명돼 있으면 synthetic lighting modulation = minimal."
//
// 우리는 그걸 **한 번도 재지 않고** `SYN_DIR` 전역 상수 하나로 18종 전부에 같은 세기를
// 걸어 왔다. 원본 PNG 를 재 보면(2026-09-01, scratchpad/vt/assetlight.mjs) 전제부터 틀렸다 —
// CLAUDE.md 37 은 "사진 액자는 스튜디오 확산광이라 네 변이 똑같이 밝다(밝기차 0)"고 적었지만
// 실제 위살−아래살은
//     black +27.8 · gold +15.8 · walnut +20.6   (위에서 온 빛 — 장면과 **일치**)
//     oak   −17.3 · white  −41.2                (아래에서 온 빛 — 장면과 **반대**)
// 이다. 그래서 우리 음영은 액자마다 다른 일을 하고 있었다:
//     · black/gold/walnut → 이미 있는 걸 **또 더한다**(중복. 브리핑 "Could this effect
//       duplicate something that already exists?" 의 답이 예다)
//     · oak/white         → 자산과 **싸운다**. 게다가 이기지도 못해서(화이트는 −40 → −12)
//       모순된 두 램프가 겹친 **뿌연 중간**이 남는다 — 브리핑이 "incorrect adaptive
//       lighting can be worse than doing almost nothing" 이라고 한 그 상태다.
//
// 살 **단면**도 마찬가지다. 자산의 프로파일 낙차는 살 평균 대비 64~217% 인데(위살 실측:
// 바깥 평평 → 0.7 근처 골 → 안쪽 밝은 립) 우리가 얹는 건 ±12% 다. 즉 사진 액자에 대해
// 우리 단면 프로파일은 **이미 있는 몰딩 위에 또 그리는 것**이었다.
//
// 그래서 여기서 한 번 재서, 렌더는 **모자란 만큼만** 채운다(`shadeFrameProfile`).
const PHOTO_LIGHT = {};
const ASSET_NEUTRAL = { tb:0, lr:0, modeled:0, lip:1, ok:false };
function measureAssetLight(im, meta){
  try{
    const W=im.naturalWidth||im.width, H=im.naturalHeight||im.height;
    const [ix,iy,ix2,iy2]=meta.inner;
    if(!(W>8 && H>8 && ix>2 && iy>2 && ix2>ix && iy2>iy)) return ASSET_NEUTRAL;
    const c=document.createElement('canvas'); c.width=W; c.height=H;
    const x=c.getContext('2d',{willReadFrequently:true});
    x.drawImage(im,0,0);
    const d=x.getImageData(0,0,W,H).data;
    // ⚠️ 알파 200 미만은 빼고 잰다 — 개구부가 투명이라 섞이면 값이 통째로 어두워진다
    const mean=(x0,y0,x1,y1)=>{ let s=0,n=0;
      x0=Math.max(0,x0|0); y0=Math.max(0,y0|0); x1=Math.min(W,x1|0); y1=Math.min(H,y1|0);
      for(let yy=y0;yy<y1;yy++){ let i=(yy*W+x0)*4;
        for(let xx=x0;xx<x1;xx++,i+=4) if(d[i+3]>200){ s+=d[i]*.2126+d[i+1]*.7152+d[i+2]*.0722; n++; } }
      return n? s/n : NaN; };
    // 코너 마이터를 뺀 살 **안쪽 50%** 만 — 코너가 섞이면 변끼리 비교가 흐려진다
    const cx0=ix+(ix2-ix)*.25, cx1=ix+(ix2-ix)*.75;
    const cy0=iy+(iy2-iy)*.25, cy1=iy+(iy2-iy)*.75;
    const top=mean(cx0,0,cx1,iy), bot=mean(cx0,iy2+1,cx1,H);
    const left=mean(0,cy0,ix,cy1), right=mean(ix2+1,cy0,W,cy1);
    if(![top,bot,left,right].every(v=>isFinite(v)&&v>1)) return ASSET_NEUTRAL;
    const base=(top+bot+left+right)/4;
    // ── 살을 가로지르는 **단면 모양** (네 변 평균, 각자 제 앞면으로 정규화) ──────────
    // ⚠️⚠️ 왜 스칼라 하나로는 안 되는가: 립 보정을 **한 숫자**로 하면 자산의 '올라가는
    //   램프'가 모양 그대로 눌리기만 한다. 실측(2026-09-01, matrix_off): 검정 자산의
    //   안쪽은 앞면의 **3.62배**까지 8px 에 걸쳐 올라간다. 0.65 를 곱해도 **1.54배**가
    //   남아 검은 액자와 작품 사이에 회색 띠로 보였다 — 사용자가 든 실패 조건 그 자체다.
    //   위치마다 다른 값을 상쇄하려면 **모양**을 알아야 한다.
    // ⚠️⚠️ **네 변을 평균하지 말 것 — 변마다 다르다.** 처음엔 평균 하나로 뒀는데,
    //   골드 자산은 **왼쪽 살에서만** 앞면의 1.15배까지 오르는 봉우리가 있어 평균에서
    //   묻혔고, 그래서 왼쪽에 189(1.15배)가 그대로 남았다. 검정은 반대로 왼쪽이 평균보다
    //   밝아 보정이 약해져 골이 0.30 목표 대신 0.51 에 머물렀다. 변별로 잰다.
    //   순서는 `FACE_NORMAL` 과 같다: 0 위 · 1 오른쪽 · 2 아래 · 3 왼쪽.
    //   d = 0 이 **바깥**이므로 아래·오른쪽은 뒤집어 읽는다.
    const NP=24;
    const mkProf=(n,at)=>{
      const p=new Array(NP).fill(1);
      if(!(n>3)) return p;
      const vs=[]; for(let i=0;i<n;i++) vs.push(at(i));
      let sum=0,cnt=0;
      for(let i=0;i<n;i++){ const dd=i/(n-1); if(dd<=0.45&&isFinite(vs[i])){ sum+=vs[i]; cnt++; } }
      if(!cnt) return p;
      const face=sum/cnt; if(!(face>1)) return p;
      const acc=new Float64Array(NP), cn=new Float64Array(NP);
      for(let i=0;i<n;i++){ if(!isFinite(vs[i])) continue;
        const k=Math.min(NP-1,Math.floor(i/(n-1)*NP)); acc[k]+=vs[i]/face; cn[k]++; }
      let hold=1;
      for(let k=0;k<NP;k++){ if(cn[k]>0){ p[k]=acc[k]/cn[k]; hold=p[k]; } else p[k]=hold; }
      return p;
    };
    const prof4=[
      mkProf(iy,      i=>mean(cx0,i,cx1,i+1)),            // 0 위
      mkProf(W-1-ix2, i=>mean(W-1-i,cy0,W-i,cy1)),        // 1 오른쪽
      mkProf(H-1-iy2, i=>mean(cx0,H-1-i,cx1,H-i)),        // 2 아래
      mkProf(ix,      i=>mean(i,cy0,i+1,cy1)),            // 3 왼쪽
    ];
    // 살을 가로지르는 프로파일 — 자산에 **이미 몰딩 단면이 찍혀 있는가**, 그리고
    // **안쪽 립이 앞면보다 얼마나 밝은가**(매트 없이 걸 때 결정적이다. 아래 lip 주석)
    let mn=Infinity, mx=-Infinity, plateau=0, pn=0, lipMax=0;
    for(let yy=0;yy<iy;yy++){ const v=mean(cx0,yy,cx1,yy+1);
      if(!isFinite(v)) continue;
      if(v<mn) mn=v; if(v>mx) mx=v;
      const d=yy/Math.max(1,iy-1);              // 0 = 바깥, 1 = 작품 쪽
      if(d<=0.45){ plateau+=v; pn++; }          // 앞면 평탄부
      if(d>=0.86 && v>lipMax) lipMax=v;         // 안쪽 립(개구부 직전)
    }
    const span=(isFinite(mn)&&mx>mn)? (mx-mn)/base : 0;
    // ⚠️⚠️ **안쪽 립은 매트가 있을 때만 안전하다.** 자산 5종 전부 개구부 직전이 앞면보다
    //   밝다 — 실측 배수: 검정 2.22 · 월넛 1.81 · 오크 1.50 · 골드 1.40 · 화이트 1.28.
    //   매트가 있으면 그 립이 **밝은 매트 옆**이라 연속으로 이어져 안 보인다. 매트를 빼면
    //   **어두운 작품에 직접** 닿아 [액자 → 흰 테두리 → 작품] 이 된다(사용자가 든 실패 조건).
    //   실측(nomat.py, 흰 벽돌): 작품 경계 임펄스가 매트 0.05 에서 12~16 인데 매트 없음에선
    //   **18.8~40.2** 로 뛴다.
    //   왜 밝은가: 자산을 찍을 때 개구부에 **밝은 회색판**을 대서 그 반사광이 사면을 들었다.
    //   실물에서 그 자리에는 작품(대개 더 어둡다)이 있으므로 그 바운스가 없다 —
    //   즉 립이 밝은 건 **촬영 세팅의 흔적**이지 그 액자의 성질이 아니다.
    const lip = (pn && plateau/pn > 1) ? lipMax/(plateau/pn) : 1;
    return { tb:(top-bot)/base, lr:(left-right)/base, prof4,
             // 0.45(=살 평균의 45% 낙차)면 '충분히 모델링된 몰딩'으로 본다.
             // 실측 5종 전부 0.64~2.17 이라 1 로 포화한다 = 우리는 단면을 안 그린다.
             modeled: Math.max(0, Math.min(1, span/0.45)),
             lip, span, base, ok:true };
  }catch(e){ return ASSET_NEUTRAL; }
}
/** 자산 단면의 d(0 = 바깥, 1 = 작품 쪽) 위치 밝기 — **그 변 앞면 대비**.
 *  s = 변(0 위 1 오른쪽 2 아래 3 왼쪽) — **변마다 다르다**(위 prof4 주석).
 * 프로파일이 없으면(절차적 액자) 1 = '평평하다'. 그러면 아래 보정은 아무 일도 안 한다. */
function assetRel(A,d,s){
  const p=A&&A.prof4&&A.prof4[s|0];
  if(!p||!p.length) return 1;
  const t=Math.max(0,Math.min(1,d))*(p.length-1), i=Math.floor(t), f=t-i;
  return i>=p.length-1 ? p[p.length-1] : p[i]*(1-f)+p[i+1]*f;
}
function assetLightOf(style){
  if(style && style.kind==='photo'){ const a=PHOTO_LIGHT[style.photo]; if(a&&a.ok) return a; }
  return ASSET_NEUTRAL;   // 절차적 액자는 텍스처가 타일링돼 방향이 없다 — 우리가 전부 만든다
}

// 사진 액자 — 목록(frames.json, 1KB)은 바로 받고 사진(장당 0.2~1.1MB)은 **그 액자를 고를 때** 받는다(ensurePhotoFrame).
// 예전엔 목록이 오자마자 8장(5.5MB)을 전부 받고, 한 장 올 때마다 칩을 다시 굽고 화면을 다시 그렸다.
// 칩 그림은 이제 미리 구워 둔 파일이다(frames/chips/<id>.webp — frontend/scripts/build-artlook-thumbs.mjs).
let PHOTO_META_READY=false;
const PHOTO_STATE={};   // 액자 키 → 'loading' | 'ready' | 'failed'
function ensurePhotoFrame(k){
  if(!PHOTO_META || !PHOTO_META[k] || PHOTO_STATE[k]) return;
  PHOTO_STATE[k]='loading';
  const im=new Image();
  // 로드 때 한 번만 색 보정을 구워 둔다(FRAME_GRADE 주석 참고)
  im.onload=()=>{ PHOTO_FRAMES[k]=gradeImage(im,k);
    // ⚠️ 반드시 **보정된 뒤** 재야 한다 — 우리가 실제로 그리는 픽셀이 그것이다
    PHOTO_LIGHT[k]=measureAssetLight(PHOTO_FRAMES[k], PHOTO_META[k]);
    PHOTO_STATE[k]='ready'; assetArrived('photo:'+k); };
  im.onerror=()=>{ PHOTO_STATE[k]='failed'; assetArrived('photo:'+k); };
  im.src='frames/photo/'+PHOTO_META[k].file;
}
fetch('frames/photo/frames.json?v='+BUILD).then(r=>r.ok?r.json():null).then(j=>{
  PHOTO_META = j || {};
  PHOTO_META_READY = true;
  if(PRELOAD_ALL) Object.keys(PHOTO_META).forEach(ensurePhotoFrame);
  assetArrived('frames.json');
}).catch(()=>{ PHOTO_META = {}; PHOTO_META_READY = true; assetArrived('frames.json'); });

/** 그 액자를 그릴 자산이 다 왔나 — 못 받은 것도 '끝남'으로 친다(엔진이 폴백으로 그린다) */
function frameAssetsReady(style){
  if(!style) return true;
  if(style.kind==='photo'){
    if(!PHOTO_META_READY) return false;
    if(!PHOTO_META[style.photo]) return true;
    const st=PHOTO_STATE[style.photo];
    return st==='ready' || st==='failed';
  }
  if(style.material){ const m=MATS[style.material]; return !m || !m.texture || !!m.ready; }
  return true;
}
/** 그 액자의 자산을 받기 시작한다(이미 받는 중이면 아무것도 안 한다) */
function ensureFrameAssets(style){
  if(!style) return;
  if(style.kind==='photo'){ if(PHOTO_META_READY) ensurePhotoFrame(style.photo); return; }
  if(style.material) ensureMatTexture(style.material);
}

// 9-slice: 모서리(살 두께 사방)는 그대로, 변은 늘린다
function drawNineSlice(ctx, im, meta, dx, dy, dw, dh, kIn){
  // ⚠️ 색 보정된 액자는 <canvas> 라 naturalWidth 가 없다 — 둘 다 받는다
  const W=im.naturalWidth||im.width, H=im.naturalHeight||im.height;
  const [ix,iy,ix2,iy2]=meta.inner;          // 원본 안에서의 개구부
  const L=ix, T=iy, R=W-1-ix2, B=H-1-iy2;    // 네 변 살 두께(원본 픽셀)
  // 목표 크기에 맞춰 살 두께를 비례 축소 — 작품이 작아도 액자가 통째로 두꺼워지지 않게
  // ⚠️ **여기서 배율을 다시 정하지 말 것.** 호출부가 이미 그 두께로 캔버스를 잡아 놨다.
  //    따로 계산하면 액자가 작품을 덮거나 살과 캔버스 사이에 틈이 생긴다(2026-08-30 버그).
  const k = kIn || Math.min(1, Math.min(dw/(L+R+8), dh/(T+B+8)));
  const l=L*k, t=T*k, r=R*k, b=B*k;
  const S=(sx,sy,sw,sh,tx,ty,tw,th)=>{ if(sw>0&&sh>0&&tw>0&&th>0) ctx.drawImage(im,sx,sy,sw,sh,tx,ty,tw,th); };
  const mw=W-L-R, mh=H-T-B, tw=dw-l-r, th=dh-t-b;
  S(0,0,L,T, dx,dy,l,t);                       // 좌상
  S(W-R,0,R,T, dx+dw-r,dy,r,t);                // 우상
  S(0,H-B,L,B, dx,dy+dh-b,l,b);                // 좌하
  S(W-R,H-B,R,B, dx+dw-r,dy+dh-b,r,b);         // 우하
  S(L,0,mw,T, dx+l,dy,tw,t);                   // 상
  S(L,H-B,mw,B, dx+l,dy+dh-b,tw,b);            // 하
  S(0,T,L,mh, dx,dy+t,l,th);                   // 좌
  S(W-R,T,R,mh, dx+dw-r,dy+t,r,th);            // 우
  return {l,t,r,b};
}

// ============================================================
//  액자 합성 (frameit식 — 얇은 프레임 / 플로터 갭 / 매트 / 캔버스랩)
//  핵심: 얇고 절제 · 정면 균일광 · 캔버스가 떠 보이는 플로터 갭 그림자
// ============================================================
// 계측용 — 액자 캔버스 안에서 작품이 앉은 자리와 살·매트 두께(액자 캔버스 픽셀).
// 화질 회귀 하니스가 '리베이트가 실제로 생겼는가'를 작품 경계에서 재는 데 쓴다.
let lastFrameLayout=null;
// ── 조명 통합 — 판 전체에 아주 완만한 기울기 + 마이터 코너 감쇠 ─────────────
// ⚠️ **왜 필요한가** (2026-08-30 5차 실측): 골든의 윗살 밝기를 길이 방향 9곳에서 재면
//    160·183·178·178·166·172·169·176·**155** 처럼 18~28 레벨이 오르내린다. 우리는
//    182·184·186·183·184·185·186·185·180 — **범위 6**, 사실상 상수였다.
//    살이 길이 방향으로 완전히 균일하면 그건 **인쇄한 띠**이고, 방과 따로 조명된
//    물체로 읽힌다("액자가 합성된 것처럼 보인다"의 실체).
//    골든에서 눈에 띄는 건 **양 끝(코너)이 중앙보다 어둡다**는 것이다 — case_00 은 빛이
//    왼쪽에서 오는데도 왼쪽 끝이 가장 어둡다(160 vs 중앙 183). 즉 이건 광원 기울기가
//    아니라 **마이터 코너의 상호 폐색**이다. 그래서 둘을 따로 준다.
// ⚠️⚠️ **`source-atop` 필수.** multiply/screen 은 **투명 픽셀 위에도 색을 칠해서**
//    액자 바깥에 네모난 헤일로를 만든다(2차 라운드 '판 둘레 투명 픽셀' 함정과 같은 원리).
//    source-atop 은 이미 그려진 곳에만 얹는다. 낮은 알파에서는 multiply/screen 과 사실상 같다.
// ⚠️ 새 텍스처를 만들지 않는다 — 원본 결은 그대로 두고 **밝기만** 아주 약하게 변조한다.
// ⚠️⚠️ **판(plate)에만 기울기를 주면 판 경계에서 벽과 어긋나 검은 테가 생긴다.**
//    실측(2026-08-30): 곱셈 램프를 판에 걸었더니 빛을 등진 아래·오른쪽 변에서 판이
//    12% 어두워져 벽(228)과 판(147) 사이에 **검은 선**이 생겼다 — 사용자가 금지한 것.
//    골든을 다시 보면 살이 단조로 기울지 않는다: 160·183·178·178·166·172·169·176·155,
//    즉 **양 끝이 어둡다**. 그건 광원 기울기가 아니라 **렌즈 비네팅**이다.
//    비네팅은 화면 전체에 연속으로 걸리므로 경계에 단차가 없다 → `sceneVignette` 로 옮겼다.
//    이 함수는 남겨 두되 진폭 0 이다(되살릴 땐 반드시 경계 단차부터 확인할 것).
function applyLightRamp(ctx,W,H,ld,amt,railPx,corner){
  if(!(amt>0) && !(corner>0)) return;
  const n=Math.hypot(ld[0],ld[1])||1, L=[ld[0]/n, ld[1]/n];
  const cx=W/2, cy=H/2, r=Math.hypot(W,H)/2;
  const x0=cx+L[0]*r, y0=cy+L[1]*r, x1=cx-L[0]*r, y1=cy-L[1]*r;   // 시작=빛을 향한 쪽
  ctx.save();
  ctx.globalCompositeOperation='source-atop';
  // ⚠️⚠️ **밝은 쪽을 흰색으로 올리지 말 것 — 검은 액자의 흑색이 들린다.**
  //    source-atop 의 흰색 알파는 `base*(1−a) + 255a` 라 어두울수록 **상대 상승폭이 크다**
  //    (살 40 → +32%, 리베이트 골 20 → +70%). 그래서 검은 슬림 액자의 리베이트 대비가
  //    0.25 → 0.23 으로 깎여 '작품이 액자 뒤에 있다'는 신호가 약해졌다(실측 t09).
  //    **검은색만 써서 빛을 등진 쪽을 어둡게 한다** — `base*(1−a)` 는 순수한 곱셈이라
  //    밝기 비(=대비)를 정확히 보존한다. 변화 폭은 같고 평균만 조금 내려간다.
  const g=ctx.createLinearGradient(x0,y0,x1,y1);
  g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,`rgba(0,0,0,${amt*2})`);
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  // 코너 폐색 — **살 두께의 몇 배**로 좁게. 넓게 주면 그냥 비네트가 되어 작품까지 어두워진다.
  if(corner>0 && railPx>0){
    const rr=Math.max(8, railPx*3.1);
    for(const [px,py] of [[0,0],[W,0],[0,H],[W,H]]){
      const rg=ctx.createRadialGradient(px,py,0,px,py,rr);

  //    방의 빛이 작품에 얹히는 건 장면 셰이더의 벽 명암(wallAmt)이 담당한다.

  // --- 매트 개구부의 45° 코어 사면 (사진 액자와 같은 함수) ---
  // ⚠️ 플로터는 **개구부가 없다** — 작품이 매트 보드 위에 얹혀 있지, 매트에 뚫린 창으로
  //    들여다보는 게 아니다. 여기에 사면을 그리면 있지도 않은 종이 두께가 작품 위에 생긴다.
  if(mat>0 && style.kind!=='floater'){ const bw=mat*MAT_BEVEL_FRAC;
    matOpeningBevel(ctx,ax,ay,aw,ah, Math.max(bw,0.8), o.matteColor, ld, (bw-0.55)/0.85); }

  // --- 리베이트 — 액자·매트가 작품 위에 드리우는 그림자 ---
  // ⚠️ 예전엔 여기만 **손으로 적은 사방 고정값**(위 .16 / 왼 .10 / 오른 .06 / 아래 .05)
  //    이었다. 사진 액자는 광원을 따르는 `rebateShadow` 를 쓰는데 절차적 액자만 좌상단
  //    고정이라, **같은 방에서 액자를 바꾸면 그림자 방향이 바뀌었다** — 브리핑 5번이
  //    금지한 바로 그것("frame만 교체했을 뿐 같은 방에서 같은 카메라로 촬영한 것처럼").
  //    이제 두 경로가 같은 함수를 쓴다.
  rebateShadow(ctx,ax,ay,aw,ah,base,ld);

  // --- 프레임 테두리 ---
  if(style.kind==='floater'){
    // 갭(트레이)은 이미 back색. 바깥 border만 재질로
    frameBand(ctx,W,H, uni(border), style.material, ld);
  } else if(style.kind==='flat' || style.kind==='mat'){
    frameBand(ctx,W,H, uni(border), style.material, ld, mat<=0);
    // ⚠️ **평면 액자에도 리베이트가 있다.** 슬림 액자는 갭이 없어 살이 작품에 곧바로
    //    맞닿는데, 실물은 작품이 **몰딩 턱 뒤로** 들어간다. 예전엔 그 자리가 완만한
    //    그라디언트뿐이라 골이 앞면의 0.80 밖에 안 됐다(골든 0.15~0.40, 플로터 0.18).
    //    화면에서는 '나무 띠를 두르고 그림을 얹었다'로 읽힌다 — 깊이 신호가 없다.
    //    `run.py` 의 t09(블랙 슬림) `rebate_ratio` 0.20 실패가 정확히 이것이다.
    //    사진 액자와 **같은 절대 프로파일**을 쓴다(특례를 만들지 않고 기존 기전을 넓힌다).
    //    면 음영은 `drawTextureSide` 가 이미 그리므로 `rebateOnly` 로 리베이트만 얹는다.
    // ⚠️ 매트가 있으면 그 자리를 매트가 덮으므로 걸지 않는다 — 플로터도 제외(갭이
    //    이미 진짜 오목면이다. 실측 골 0.18). 같은 깊이 신호를 두 겹 쌓지 않는다.
    if(mat<=0)
      shadeFrameProfile(ctx,W,H,border,border,border,border,ld,{rebateOnly:true,noMat:true,
        scale:o.outLongEst? o.outLongEst/Math.max(W,H) : 1});
  }

  // --- 유리 반사 ---
  if(o.glass){
    const ix=mat>0?m.t-mat:ax, iy=ax, iw=aw+2*mat, ih=ah+2*mat;
    ctx.save(); ctx.beginPath(); ctx.rect(ax-mat,ay-mat,aw+2*mat,ah+2*mat); ctx.clip();
    const g=ctx.createLinearGradient(ax-mat,ay-mat,ax+aw*.9,ay+ah);
    g.addColorStop(0,'rgba(255,255,255,0)'); g.addColorStop(.34,'rgba(255,255,255,0)');
    g.addColorStop(.42,'rgba(255,255,255,.09)'); g.addColorStop(.47,'rgba(255,255,255,.012)');
    g.addColorStop(.55,'rgba(255,255,255,.06)'); g.addColorStop(.62,'rgba(255,255,255,0)');
    ctx.fillStyle=g; ctx.fillRect(ax-mat,ay-mat,aw+2*mat,ah+2*mat);
    ctx.restore();
  }
  applyLightRamp(ctx,W,H,ld,RAMP_AMT,border+gap,RAMP_CORNER);
  noteLayout(ax,ay,aw,ah,border+gap,mat,
    {l:border+gap,t:border+gap,r:border+gap,b:border+gap,faceOut:0,faceFront:border/Math.max(1,border+gap)});
  return c;
}

function sampleAvg(img, fx, fy, fw, fh){
  try{
    const iw=img.naturalWidth, ih=img.naturalHeight;
    let sx=Math.max(0,fx*iw), sy=Math.max(0,fy*ih);
    let sw=Math.min(iw-sx,fw*iw), sh=Math.min(ih-sy,fh*ih);
    if(sw<2||sh<2) return null;
    const c=document.createElement('canvas'); c.width=1; c.height=1;
    const x=c.getContext('2d');
    x.drawImage(img, sx,sy,sw,sh, 0,0,1,1);
    const d=x.getImageData(0,0,1,1).data;
    return {r:d[0],g:d[1],b:d[2]};
  }catch(e){ return null; }
}

//  조명(스튜디오 라이트) — 강도 하나로만 조절한다 (0~100, 0 = 없음)

// ⚠️ **옛 방식(라이팅맵 9-slice multiply)은 버렸다.** 두 가지가 잘못돼 있었다.
//    ① 장면 모드에서 **한 번도 호출되지 않았다**(`compose()` 의 scene 분기에 없다).
//       장면이 유일한 배경 목록이 된 뒤로는 무엇을 골라도 화면이 그대로였다 — 에러 없이 조용히.
//    ② 사진 한 장을 9-slice 로 늘려 쓰므로 **방의 광원 방향과 무관**했다. 좌상단에서
//       빛이 오는 방에 우상단이 밝은 조명맵을 곱하면 그림자와 하이라이트가 서로 어긋난다.

// 으로 조명을 건다. 세 겹이고, 각각 물리적으로 뜻이 있다.
