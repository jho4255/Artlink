<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>사용자 관리 휴대폰</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
a{color:#111827}a:hover{color:#111827}
</style>
</helmet>
<div style="width: 390px; height: 1200px; box-sizing: border-box; display: flex; flex-direction: column; background: #ffffff; color: #111827; font-family: Inter, 'Noto Sans KR', system-ui, sans-serif; letter-spacing: -0.01em">

<header style="flex: none; height: 56px; padding: 0 8px 0 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #f3f4f6">
<a href="#" style="font-size: 24px; font-weight: 700; letter-spacing: -0.03em; text-decoration: none">Art<span style="color: #c4302b">Link</span></a>
<span style="display: flex; align-items: center">
<button type="button" aria-label="ArtTalk" style="width: 44px; height: 44px; border: 0; background: none; cursor: pointer"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#374151" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"></path></svg></button>
<button type="button" aria-label="알림" style="width: 44px; height: 44px; border: 0; background: none; cursor: pointer"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#374151" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9a6 6 0 0 1 12 0c0 6 2.5 7.5 2.5 7.5h-17S6 15 6 9z"></path><path d="M10 20a2 2 0 0 0 4 0"></path></svg></button>
<button type="button" aria-label="메뉴 · 처리할 일 6건" style="position: relative; width: 44px; height: 44px; border: 0; background: none; cursor: pointer"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#374151" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16"></path><path d="M4 12h16"></path><path d="M4 17h16"></path></svg><span aria-hidden="true" style="position: absolute; top: 8px; right: 6px; width: 8px; height: 8px; border-radius: 50%; background: #c4302b"></span></button>
</span>
</header>

<main style="flex: 1; min-height: 0; padding: 0 20px">

<h1 style="margin: 0; display: flex; align-items: center; min-height: 56px; font-size: 20px; font-weight: 600; letter-spacing: -0.02em">사용자 관리</h1>

<label style="display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 12px; box-sizing: border-box; border: 1px solid #d1d5db; border-radius: 8px"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6b7280" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg><input type="search" aria-label="이름·이메일·홈페이지 주소로 찾기" placeholder="이름·이메일·@주소로 찾기" style="flex: 1; min-width: 0; border: 0; outline: 0; background: none; font: inherit; font-size: 16px; color: #111827"></label>

<div role="tablist" aria-label="회원 종류" style="margin: 6px -20px 0; padding: 0 20px; display: flex; gap: 22px; border-bottom: 1px solid #e5e7eb; font-size: 14.5px; white-space: nowrap; overflow: hidden">
<button type="button" role="tab" aria-selected="false" style="flex: none; min-height: 46px; padding: 0; border: 0; background: none; font: inherit; color: #6b7280; cursor: pointer">전체 197</button>
<button type="button" role="tab" aria-selected="true" style="flex: none; min-height: 46px; margin-bottom: -1px; padding: 0; border: 0; border-bottom: 2px solid #111827; background: none; font: inherit; font-weight: 600; color: #111827; cursor: pointer">아티스트 179</button>
<button type="button" role="tab" aria-selected="false" style="flex: none; min-height: 46px; padding: 0; border: 0; background: none; font: inherit; color: #6b7280; cursor: pointer">갤러리 14</button>
<button type="button" role="tab" aria-selected="false" style="flex: none; min-height: 46px; padding: 0; border: 0; background: none; font: inherit; color: #6b7280; cursor: pointer">일반 1</button>
<button type="button" role="tab" aria-selected="false" style="flex: none; min-height: 46px; padding: 0; border: 0; background: none; font: inherit; color: #6b7280; cursor: pointer">관리자 3</button>
<button type="button" role="tab" aria-selected="false" style="flex: none; min-height: 46px; padding: 0; border: 0; background: none; font: inherit; color: #6b7280; cursor: pointer">오늘 방문 5</button>
</div>

<p style="margin: 0; display: flex; align-items: center; justify-content: space-between; min-height: 44px; font-size: 13px">
<button type="button" style="display: inline-flex; align-items: center; gap: 4px; min-height: 44px; padding: 0; border: 0; background: none; font: inherit; font-size: 13px; font-weight: 600; color: #111827; cursor: pointer">최근 가입 순<svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#111827" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg></button>
<button type="button" style="display: inline-flex; align-items: center; gap: 4px; min-height: 44px; padding: 0; border: 0; background: none; font: inherit; font-size: 13px; color: #374151; cursor: pointer">걸러 보기<svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg></button>
</p>

<ul style="margin: 0; padding: 0; list-style: none; border-top: 1px solid #111827">
<sc-for list="{{ rows }}" as="r" hint-placeholder-count="10">
<li style="border-bottom: 1px solid #f3f4f6">
<a href="#" style="display: flex; align-items: center; gap: 12px; min-height: 76px; text-decoration: none">
<span style="flex: 1; min-width: 0">
<span style="display: block; font-size: 15px; font-weight: 600">{{ r.name }}</span>
<span style="display: block; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12.5px; color: #4b5563; font-variant-numeric: tabular-nums">가입 {{ r.joined }} · 접속 {{ r.last }}</span>
<span style="display: block; margin-top: 2px; font-size: 12.5px; color: #4b5563; font-variant-numeric: tabular-nums"><span style="font-weight: {{ r.worksWeight }}; color: {{ r.worksColor }}">작품 {{ r.works }}</span> · 지원 {{ r.apps }}</span>
</span>
<span aria-label="{{ r.daysLabel }}" style="flex: none; display: flex; gap: 3px"><span style="width: 7px; height: 16px; border-radius: 2px; background: {{ r.d0 }}"></span><span style="width: 7px; height: 16px; border-radius: 2px; background: {{ r.d1 }}"></span><span style="width: 7px; height: 16px; border-radius: 2px; background: {{ r.d2 }}"></span><span style="width: 7px; height: 16px; border-radius: 2px; background: {{ r.d3 }}"></span><span style="width: 7px; height: 16px; border-radius: 2px; background: {{ r.d4 }}"></span><span style="width: 7px; height: 16px; border-radius: 2px; background: {{ r.d5 }}"></span><span style="width: 7px; height: 16px; border-radius: 2px; background: {{ r.d6 }}"></span></span>
<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6b7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><path d="M9 6l6 6-6 6"></path></svg>
</a>
</li>
</sc-for>
</ul>
<p style="margin: 0; display: flex; align-items: center; justify-content: center; min-height: 52px"><button type="button" style="min-height: 40px; padding: 0 18px; border: 1px solid #d1d5db; border-radius: 8px; background: #ffffff; font: inherit; font-size: 13.5px; color: #111827; cursor: pointer">50명 더 보기 · 10 / 179</button></p>

</main>

<nav aria-label="하단 메뉴" style="flex: none; height: 60px; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); align-items: center; border-top: 1px solid #e5e7eb; font-size: 11px; color: #6b7280; text-align: center">
<span>홈</span><span>작가</span><span>갤러리</span><span>전시</span><span>모집공고</span><span>커뮤니티</span><span>ArtStory</span>
</nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1200}}'>
class Component extends DCLogic {
renderVals() {
const R = (name, joined, last, pattern, works, apps) => {
const on = '#1f2937', off = '#e5e7eb';
const d = pattern.split('').map((c) => (c === '1' ? on : off));
const n = pattern.split('').filter((c) => c === '1').length;
return { name, joined, last, d0: d[0], d1: d[1], d2: d[2], d3: d[3], d4: d[4], d5: d[5], d6: d[6], daysLabel: '최근 7일 중 ' + n + '일 방문', works, worksColor: works === 0 ? '#c4302b' : '#4b5563', worksWeight: works === 0 ? 600 : 400, apps };
};
return {
rows: [
R('한도경', '11.19', '오늘 15:02', '0000011', 0, '없음'),
R('임세아', '11.18', '어제', '0000110', 2, '없음'),
R('오하린', '11.17', '11.17', '0001000', 0, '없음'),
R('서진우', '11.14', '오늘 09:41', '0101011', 9, '1 · 검토 대기'),
R('배소민', '10.21', '오늘 14:20', '1010101', 6, '3 · 선정 1'),
R('노해원', '10.20', '11.2', '0000000', 0, '없음'),
R('강윤서', '10.19', '11.12', '0000000', 14, '2 · 선정 2'),
R('정다은', '10.19', '기록 없음', '0000000', 0, '없음'),
R('최민석', '10.14', '11.20', '0000001', 3, '1 · 미선정'),
R('이서아', '10.12', '10.30', '0000000', 0, '없음')
]
};
}
}
</script>
</body>
</html>
