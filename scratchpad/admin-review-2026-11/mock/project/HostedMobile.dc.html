<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>주최 공모 휴대폰</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
a{color:#111827}a:hover{color:#111827}
</style>
</helmet>
<div style="width: 390px; height: 1120px; box-sizing: border-box; display: flex; flex-direction: column; background: #ffffff; color: #111827; font-family: Inter, 'Noto Sans KR', system-ui, sans-serif; letter-spacing: -0.01em">

<header style="flex: none; height: 56px; padding: 0 8px 0 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #f3f4f6">
<a href="#" style="font-size: 24px; font-weight: 700; letter-spacing: -0.03em; text-decoration: none">Art<span style="color: #c4302b">Link</span></a>
<span style="display: flex; align-items: center">
<button type="button" aria-label="ArtTalk" style="width: 44px; height: 44px; border: 0; background: none; cursor: pointer"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#374151" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"></path></svg></button>
<button type="button" aria-label="알림" style="width: 44px; height: 44px; border: 0; background: none; cursor: pointer"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#374151" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9a6 6 0 0 1 12 0c0 6 2.5 7.5 2.5 7.5h-17S6 15 6 9z"></path><path d="M10 20a2 2 0 0 0 4 0"></path></svg></button>
<button type="button" aria-label="메뉴 · 처리할 일 6건" style="position: relative; width: 44px; height: 44px; border: 0; background: none; cursor: pointer"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#374151" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16"></path><path d="M4 12h16"></path><path d="M4 17h16"></path></svg><span aria-hidden="true" style="position: absolute; top: 8px; right: 6px; width: 8px; height: 8px; border-radius: 50%; background: #c4302b"></span></button>
</span>
</header>

<main style="flex: 1; min-height: 0; padding: 0 20px">

<div style="display: flex; align-items: center; justify-content: space-between; min-height: 60px">
<h1 style="margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.02em">주최 공모</h1>
<a href="#" style="display: inline-flex; align-items: center; gap: 4px; min-height: 40px; padding: 0 14px; border-radius: 8px; background: #111827; font-size: 13.5px; font-weight: 600; color: #ffffff; text-decoration: none"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>등록</a>
</div>

<div style="margin: 0 -20px; padding: 0 12px 0 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #e5e7eb">
<div role="tablist" aria-label="공모 범위" style="display: flex; gap: 22px; font-size: 14.5px">
<button type="button" role="tab" aria-selected="true" style="min-height: 46px; margin-bottom: -1px; padding: 0; border: 0; border-bottom: 2px solid #111827; background: none; font: inherit; font-weight: 600; color: #111827; cursor: pointer">모집 중 8</button>
<button type="button" role="tab" aria-selected="false" style="min-height: 46px; padding: 0; border: 0; background: none; font: inherit; color: #6b7280; cursor: pointer">마감 18</button>
<button type="button" role="tab" aria-selected="false" style="min-height: 46px; padding: 0; border: 0; background: none; font: inherit; color: #6b7280; cursor: pointer">전체 26</button>
</div>
<button type="button" aria-label="공모 제목 찾기" style="width: 44px; height: 44px; border: 0; background: none; cursor: pointer"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg></button>
</div>

<p style="margin: 0; display: flex; align-items: center; min-height: 44px; font-size: 13px; color: #4b5563"><button type="button" style="display: inline-flex; align-items: center; gap: 4px; min-height: 44px; padding: 0; border: 0; background: none; font: inherit; font-size: 13px; font-weight: 600; color: #111827; cursor: pointer">마감 가까운 순<svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#111827" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg></button></p>

<ul style="margin: 0; padding: 0; list-style: none; border-top: 1px solid #111827">
<sc-for list="{{ rows }}" as="r" hint-placeholder-count="8">
<li style="border-bottom: 1px solid #f3f4f6">
<a href="#" style="display: flex; gap: 12px; align-items: flex-start; padding: 13px 0; text-decoration: none">
<span style="flex: none; width: 44px; height: 62px; background: #f3f4f6"><img src="{{ r.img }}" alt="" style="display: block; width: 44px; height: 62px; object-fit: contain"></span>
<span style="flex: 1; min-width: 0">
<span style="display: block; font-size: 12.5px; color: #4b5563; font-variant-numeric: tabular-nums"><strong style="font-weight: 700; color: {{ r.ddayColor }}">{{ r.dday }}</strong><span style="margin-left: 6px">{{ r.until }} · {{ r.host }}</span></span>
<span style="display: block; margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 15px; font-weight: 600">{{ r.title }}</span>
<span style="display: block; margin-top: 3px; font-size: 12.5px; color: #4b5563; font-variant-numeric: tabular-nums">조회 {{ r.views }} · 지원 {{ r.apps }}<sc-if value="{{ r.hasPending }}" hint-placeholder-val="{{ false }}"><span style="margin-left: 8px; font-weight: 600; color: #c4302b"><span aria-hidden="true" style="display: inline-block; width: 6px; height: 6px; margin-right: 5px; border-radius: 50%; background: #c4302b; vertical-align: middle"></span>검토 대기 {{ r.pending }}</span></sc-if></span>
</span>
</a>
</li>
</sc-for>
</ul>

</main>

<nav aria-label="하단 메뉴" style="flex: none; height: 60px; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); align-items: center; border-top: 1px solid #e5e7eb; font-size: 11px; color: #6b7280; text-align: center">
<span>홈</span><span>작가</span><span>갤러리</span><span>전시</span><span>모집공고</span><span>커뮤니티</span><span>ArtStory</span>
</nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1120}}'>
class Component extends DCLogic {
renderVals() {
const B = { blue: '/_blob/de1f10200e1f336dd91cd89ef842604e', city: '/_blob/804f09e39ab13938d849387aae7514fe', dawn: '/_blob/52671ba2277cab5a1014ff9fded217ad', red: '/_blob/7d66e988e5b316ac2f53b147f4796d87', water: '/_blob/f6535147618908a74378b12a2a4c83d0', winter: '/_blob/e30142631e1cb95cbb4c9d67b792c44a' };
const R = (title, img, d, until, host, views, apps, pending) => ({ title, img, dday: 'D-' + d, ddayColor: d <= 7 ? '#c4302b' : '#111827', until, host, views: views.toLocaleString('ko-KR'), apps, pending, hasPending: pending > 0 });
return {
rows: [
R('아트페어 부스 참가 작가 모집', B.city, 3, '11.24(화)', '직접 운영', 442, 0, 0),
R('2027 신진작가 공모전 《첫 장》', B.red, 12, '12.3(목)', '직접 운영', 1295, 0, 0),
R('겨울 드로잉 클럽 참여 작가 모집', B.winter, 14, '12.5(토)', '갤러리 온결 외 1곳', 318, 4, 2),
R('지역 작가 아카이브 프로젝트', B.water, 21, '12.12(토)', '직접 운영', 223, 1, 0),
R('청년 작가 지원 프로그램 2기', B.dawn, 26, '12.17(목)', '스튜디오 물결', 187, 2, 0),
R('공공미술 벽화 프로젝트 참여 작가', B.blue, 30, '12.21(월)', '직접 운영', 136, 0, 0),
R('2027 상반기 대관 지원 공모', B.city, 41, '1.1(금)', '직접 운영', 98, 0, 0),
R('봄 아트마켓 셀러 모집', B.red, 55, '1.15(금)', '직접 운영', 64, 0, 0)
]
};
}
}
</script>
</body>
</html>
