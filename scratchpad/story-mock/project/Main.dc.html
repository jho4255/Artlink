<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>홈 ArtStory — 휴대폰</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#111827}a:hover{color:#c4302b}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #ffffff; font-family: 'Noto Sans KR', system-ui, sans-serif; color: #111827">
  <header style="height: 56px; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; padding: 0 8px 0 16px; border-bottom: 1px solid #e5e7eb">
    <div style="font-size: 22px; font-weight: 800; letter-spacing: -0.02em"><span style="color: #111827">Art</span><span style="color: #c4302b">Link</span></div>
    <div style="display: flex; align-items: center">
      <button type="button" aria-label="메시지" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: none; border: 0; color: #374151; cursor: pointer">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2"></rect><path d="m22 7-10 5L2 7"></path></svg>
      </button>
      <button type="button" aria-label="알림" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: none; border: 0; color: #374151; cursor: pointer">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg>
      </button>
    </div>
  </header>

  <div style="position: absolute; top: 56px; bottom: 57px; left: 0; right: 0; overflow-y: auto">
    <div style="height: 130px; background: #f3f4f6; display: flex; align-items: center; justify-content: center; color: #6b7280; font-size: 13px">배너 — 지금 그대로</div>

    <section aria-label="ArtStory" style="padding: 22px 0 22px; border-bottom: 1px solid #f3f4f6">
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 16px 14px">
        <h2 style="margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -0.02em"><span style="color: #111827">Art</span><span style="color: #c4302b">Story</span></h2>
        <div style="display: flex; align-items: center; gap: 4px">
          <a href="States.dc.html" style="height: 40px; padding: 0 8px; display: flex; align-items: center; font-size: 13px; color: #4b5563; text-decoration: none">전체 보기</a>
          <a href="Compose.dc.html" style="height: 40px; padding: 0 12px; display: flex; align-items: center; gap: 5px; border: 1px solid #111827; border-radius: 8px; font-size: 13px; font-weight: 700; color: #111827; text-decoration: none">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>올리기
          </a>
        </div>
      </div>
      <div style="display: flex; gap: 10px; overflow-x: auto; padding: 0 16px; scrollbar-width: none; scroll-snap-type: x proximity; scroll-padding-left: 16px">
        <sc-for list="{{ cards }}" as="c" hint-placeholder-count="5">
          <button type="button" onClick="{{ c.open }}" aria-label="{{ c.label }}" style="flex: 0 0 auto; width: 148px; height: 246px; position: relative; overflow: hidden; border: 0; padding: 0; border-radius: 6px; background: {{ c.bg }}; cursor: pointer; font-family: inherit; scroll-snap-align: start; text-align: left">
            <sc-if value="{{ c.hasImg }}" hint-placeholder-val="{{ true }}">
              <img src="{{ c.img }}" alt="" aria-hidden="true" style="position: absolute; left: -15%; top: -15%; width: 130%; height: 130%; object-fit: cover; filter: blur(14px) brightness(0.5)">
              <img src="{{ c.img }}" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain">
            </sc-if>
            <sc-if value="{{ c.isText }}" hint-placeholder-val="{{ false }}">
              <span style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 40px 14px 16px; box-sizing: border-box; color: #ffffff; font-size: 14px; line-height: 1.55; font-weight: 700; text-align: center; white-space: pre-line">{{ c.text }}</span>
            </sc-if>
            <span aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 0; height: 54px; background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0)); pointer-events: none"></span>
            <span style="position: absolute; left: 8px; right: 8px; top: 8px; display: flex; align-items: center; gap: 6px">
              <span style="flex: 0 0 auto; width: 22px; height: 22px; border-radius: 50%; background: rgba(255,255,255,0.22); border: 1px solid rgba(255,255,255,0.75); box-sizing: border-box; display: flex; align-items: center; justify-content: center; color: #ffffff; font-size: 11px; font-weight: 700">{{ c.initial }}</span>
              <span style="min-width: 0; flex: 1; color: #ffffff; font-size: 12px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,0.6)">{{ c.name }}</span>
              <sc-if value="{{ c.multi }}" hint-placeholder-val="{{ false }}">
                <span style="flex: 0 0 auto; padding: 1px 6px; border-radius: 9px; background: rgba(0,0,0,0.55); color: #ffffff; font-size: 11px">{{ c.count }}</span>
              </sc-if>
            </span>
          </button>
        </sc-for>
      </div>
    </section>

    <section aria-label="ArtWorks" style="padding: 26px 16px 0">
      <h2 style="margin: 0 0 12px; font-size: 22px; font-weight: 800; letter-spacing: -0.02em"><span style="color: #111827">Art</span><span style="color: #c4302b">Works</span></h2>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
        <div style="aspect-ratio: 1 / 1; background: #f3f4f6; display: flex; align-items: center; justify-content: center"><img src="/_blob/dd2006aa51c440be4ab18fc05617abfe" alt="작품 — 조용한 오후" style="max-width: 100%; max-height: 100%; object-fit: contain"></div>
        <div style="aspect-ratio: 1 / 1; background: #f3f4f6; display: flex; align-items: center; justify-content: center"><img src="/_blob/242a2926a35e2b57325c34b1ab58d447" alt="작품 — 새벽 창" style="max-width: 100%; max-height: 100%; object-fit: contain"></div>
      </div>
    </section>
    <div style="height: 32px"></div>
  </div>

  <nav aria-label="하단 메뉴" style="position: absolute; left: 0; right: 0; bottom: 0; height: 57px; border-top: 1px solid #e5e7eb; background: #ffffff; display: flex">
    <a href="#" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #111827; text-decoration: none; font-size: 10.5px; font-weight: 700">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V21a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"></path></svg>홈
    </a>
    <a href="#" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #6b7280; text-decoration: none; font-size: 10.5px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>작가
    </a>
    <a href="#" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #6b7280; text-decoration: none; font-size: 10.5px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"></rect><circle cx="9" cy="9" r="2"></circle><path d="m21 15-5-5L5 21"></path></svg>갤러리
    </a>
    <a href="#" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #6b7280; text-decoration: none; font-size: 10.5px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"></rect><path d="M16 2v4M8 2v4M3 10h18"></path></svg>전시
    </a>
    <a href="#" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #6b7280; text-decoration: none; font-size: 10.5px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 11 18-5v12L3 14v-3z"></path><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"></path></svg>모집공고
    </a>
    <a href="#" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #6b7280; text-decoration: none; font-size: 10.5px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>커뮤니티
    </a>
  </nav>

  <sc-if value="{{ open }}" hint-placeholder-val="{{ false }}">
    <div role="dialog" aria-modal="true" aria-label="{{ cur.dialogLabel }}" style="position: absolute; inset: 0; z-index: 50; background: #0b0b0c; overflow: hidden; display: flex; flex-direction: column">
      <sc-if value="{{ media.hasImg }}" hint-placeholder-val="{{ true }}">
        <img src="{{ media.img }}" alt="" aria-hidden="true" style="position: absolute; left: -15%; top: -15%; width: 130%; height: 130%; object-fit: cover; filter: blur(30px) brightness(0.38)">
      </sc-if>
      <sc-if value="{{ media.isText }}" hint-placeholder-val="{{ false }}">
        <div aria-hidden="true" style="position: absolute; inset: 0; background: {{ media.bg }}"></div>
      </sc-if>

      <div style="position: relative; display: flex; gap: 4px; padding: 10px 10px 0">
        <sc-for list="{{ segs }}" as="seg" hint-placeholder-count="2">
          <div style="flex: 1; height: 3px; border-radius: 2px; background: rgba(255,255,255,0.32); overflow: hidden">
            <div style="height: 100%; background: #ffffff; width: {{ seg.w }}"></div>
          </div>
        </sc-for>
      </div>
      <div style="position: relative; display: flex; align-items: center; gap: 10px; padding: 8px 4px 6px 12px">
        <div style="width: 34px; height: 34px; flex: 0 0 auto; border-radius: 50%; background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.7); box-sizing: border-box; color: #ffffff; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700">{{ cur.initial }}</div>
        <div style="min-width: 0; flex: 1">
          <div style="color: #ffffff; font-size: 14px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{ cur.name }}</div>
          <div style="color: rgba(255,255,255,0.8); font-size: 12px">{{ cur.meta }}</div>
        </div>
        <button type="button" onClick="{{ toggleFollow }}" aria-pressed="{{ followed }}" style="flex: 0 0 auto; height: 40px; padding: 0 12px; border: 1px solid rgba(255,255,255,0.7); border-radius: 8px; background: {{ followBg }}; color: #ffffff; font-size: 13px; font-weight: 700; font-family: inherit; cursor: pointer">{{ followLabel }}</button>
        <button type="button" onClick="{{ close }}" aria-label="닫기" style="width: 44px; height: 44px; flex: 0 0 auto; display: flex; align-items: center; justify-content: center; background: none; border: 0; color: #ffffff; cursor: pointer">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg>
        </button>
      </div>

      <div style="position: relative; flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center">
        <sc-if value="{{ media.hasImg }}" hint-placeholder-val="{{ true }}">
          <img src="{{ media.img }}" alt="{{ media.alt }}" style="max-width: 100%; max-height: 100%; object-fit: contain; display: block">
        </sc-if>
        <sc-if value="{{ media.isText }}" hint-placeholder-val="{{ false }}">
          <p style="margin: 0; padding: 0 32px; color: #ffffff; font-size: 23px; line-height: 1.55; font-weight: 700; text-align: center; white-space: pre-line">{{ media.text }}</p>
        </sc-if>
        <button type="button" aria-label="이전" onClick="{{ tapPrev }}" onPointerDown="{{ hold }}" onPointerUp="{{ release }}" onPointerLeave="{{ release }}" style="position: absolute; left: 0; top: 0; bottom: 0; width: 32%; background: transparent; border: 0; cursor: pointer"></button>
        <button type="button" aria-label="다음" onClick="{{ tapNext }}" onPointerDown="{{ hold }}" onPointerUp="{{ release }}" onPointerLeave="{{ release }}" style="position: absolute; right: 0; top: 0; bottom: 0; width: 68%; background: transparent; border: 0; cursor: pointer"></button>
        <sc-if value="{{ paused }}" hint-placeholder-val="{{ false }}">
          <div aria-hidden="true" style="position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 56px; height: 56px; border-radius: 50%; background: rgba(0,0,0,0.45); display: flex; align-items: center; justify-content: center; color: #ffffff; pointer-events: none">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="4" width="4" height="16" rx="1"></rect><rect x="14" y="4" width="4" height="16" rx="1"></rect></svg>
          </div>
        </sc-if>
      </div>

      <sc-if value="{{ media.hasCaption }}" hint-placeholder-val="{{ true }}">
        <p style="position: relative; margin: 0; padding: 12px 16px 2px; color: #ffffff; font-size: 14px; line-height: 1.6">{{ media.caption }}</p>
      </sc-if>
      <div style="position: relative; display: flex; align-items: center; gap: 2px; padding: 6px 6px 14px 10px">
        <button type="button" onClick="{{ toggleLike }}" aria-label="{{ likeLabel }}" aria-pressed="{{ liked }}" style="height: 44px; padding: 0 10px; display: flex; align-items: center; gap: 6px; background: none; border: 0; color: {{ likeColor }}; font-size: 14px; font-family: inherit; cursor: pointer">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="{{ likeFill }}" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"></path></svg>
          <span style="color: #ffffff">{{ likeCount }}</span>
        </button>
        <button type="button" onClick="{{ openSheet }}" aria-label="댓글 보기" style="height: 44px; padding: 0 10px; display: flex; align-items: center; gap: 6px; background: none; border: 0; color: #ffffff; font-size: 14px; font-family: inherit; cursor: pointer">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"></path></svg>
          {{ commentCount }}
        </button>
        <button type="button" onClick="{{ share }}" aria-label="공유" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: none; border: 0; color: #ffffff; cursor: pointer">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"></path><path d="m16 6-4-4-4 4M12 2v14"></path></svg>
        </button>
        <span style="flex: 1"></span>
        <button type="button" style="height: 40px; padding: 0 12px; background: none; border: 1px solid rgba(255,255,255,0.55); border-radius: 8px; color: #ffffff; font-size: 13px; font-family: inherit; cursor: pointer">홈페이지</button>
        <button type="button" aria-label="더 보기 — 신고 등" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: none; border: 0; color: #ffffff; cursor: pointer">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle></svg>
        </button>
      </div>

      <sc-if value="{{ toast }}" hint-placeholder-val="{{ false }}">
        <div role="status" style="position: absolute; left: 50%; bottom: 84px; transform: translateX(-50%); z-index: 4; padding: 10px 16px; border-radius: 8px; background: #ffffff; color: #111827; font-size: 13px; font-weight: 700; white-space: nowrap">링크를 복사했어요</div>
      </sc-if>

      <sc-if value="{{ sheet }}" hint-placeholder-val="{{ false }}">
        <div style="position: absolute; inset: 0; z-index: 5; display: flex; flex-direction: column; justify-content: flex-end">
          <button type="button" onClick="{{ closeSheet }}" aria-label="댓글 닫기" style="flex: 1; background: rgba(0,0,0,0.35); border: 0; cursor: pointer"></button>
          <div style="background: #ffffff; border-radius: 14px 14px 0 0; padding: 14px 16px 16px; max-height: 62%; display: flex; flex-direction: column; gap: 12px">
            <div style="display: flex; align-items: center; justify-content: space-between">
              <strong style="font-size: 15px">댓글 {{ commentCount }}</strong>
              <button type="button" onClick="{{ closeSheet }}" aria-label="닫기" style="width: 44px; height: 36px; background: none; border: 0; color: #374151; cursor: pointer; display: flex; align-items: center; justify-content: flex-end">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg>
              </button>
            </div>
            <div style="display: flex; flex-direction: column; gap: 12px; overflow-y: auto">
              <sc-if value="{{ noComments }}" hint-placeholder-val="{{ false }}">
                <p style="margin: 6px 0; font-size: 14px; color: #4b5563">첫 댓글을 남겨 보세요.</p>
              </sc-if>
              <sc-for list="{{ commentList }}" as="cm" hint-placeholder-count="2">
                <div style="display: flex; gap: 10px">
                  <div style="width: 30px; height: 30px; flex: 0 0 auto; border-radius: 50%; background: #e5e7eb; color: #374151; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700">{{ cm.initial }}</div>
                  <div style="min-width: 0">
                    <div style="font-size: 13px; font-weight: 700">{{ cm.n }}</div>
                    <div style="font-size: 14px; line-height: 1.55; color: #1f2937">{{ cm.t }}</div>
                  </div>
                </div>
              </sc-for>
            </div>
            <div style="display: flex; gap: 8px">
              <label for="cmt" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">댓글 쓰기</label>
              <input id="cmt" type="text" value="{{ draft }}" onChange="{{ onDraft }}" placeholder="댓글 쓰기" style="flex: 1; min-width: 0; height: 44px; box-sizing: border-box; border: 1px solid #d1d5db; border-radius: 8px; padding: 0 12px; font-size: 15px; font-family: inherit">
              <button type="button" onClick="{{ addComment }}" style="flex: 0 0 auto; height: 44px; padding: 0 16px; border: 0; border-radius: 8px; background: #111827; color: #ffffff; font-size: 14px; font-weight: 700; font-family: inherit; cursor: pointer">등록</button>
            </div>
          </div>
        </div>
      </sc-if>

      <sc-if value="{{ ended }}" hint-placeholder-val="{{ false }}">
        <div style="position: absolute; inset: 0; z-index: 6; background: #0b0b0c; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 32px; box-sizing: border-box; text-align: center">
          <p style="margin: 0 0 18px; color: #ffffff; font-size: 20px; font-weight: 700">새 소식을 다 봤어요</p>
          <a href="Compose.dc.html" style="width: 220px; height: 48px; display: flex; align-items: center; justify-content: center; border-radius: 8px; background: #ffffff; color: #111827; font-size: 15px; font-weight: 700; text-decoration: none">소식 올리기</a>
          <button type="button" onClick="{{ close }}" style="width: 220px; height: 48px; border: 1px solid rgba(255,255,255,0.55); border-radius: 8px; background: none; color: #ffffff; font-size: 15px; font-family: inherit; cursor: pointer">홈으로</button>
          <button type="button" onClick="{{ replay }}" style="height: 44px; padding: 0 12px; border: 0; background: none; color: rgba(255,255,255,0.8); font-size: 13px; font-family: inherit; cursor: pointer; text-decoration: underline">처음부터 다시 보기</button>
        </div>
      </sc-if>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  stories = [
    { id: 'han', name: '한지우', role: '작가', ago: '12분 전', likes: 14, caption: '북쪽 창 앞으로 이젤을 옮겼다. 오후 빛이 종이에 고르게 떨어진다.',
      images: ['/_blob/7f689f4af89c044126792414ac2b55cf', '/_blob/591680b29d0242251dc3fd4493f4e79e'],
      cs: [{ n: '도하린', t: '창 쪽이 훨씬 낫네요.' }, { n: '갤러리 한켠', t: '다음 주에 작업실 들러도 될까요?' }] },
    { id: 'gal', name: '갤러리 한켠', role: '갤러리', ago: '40분 전', likes: 21, caption: '다음 주 단체전 설치 중이에요. 금요일에 문 엽니다.',
      images: ['/_blob/78d87e89e12a135ebd67703c25467cd7'],
      cs: [{ n: '오세린', t: '금요일에 갈게요.' }] },
    { id: 'kim', name: '김민서', role: '작가', ago: '1시간 전', likes: 6, caption: '내일 오픈 스튜디오 해요.\n오후 2시부터 6시까지,\n편하게 들러 주세요.', bg: '#3f4a5a', images: [], cs: [] },
    { id: 'do', name: '도하린', role: '작가', ago: '2시간 전', likes: 9, caption: '세 번째 판을 찍었다. 빨강을 한 번 더 겹쳤다.',
      images: ['/_blob/2a758e0ea2f77e12c55b75db9297f047', '/_blob/1e424bb58e413acf63bd437955efa778'],
      cs: [{ n: '한지우', t: '두 번째 사진의 칼자국이 좋아요.' }] },
    { id: 'oh', name: '오세린', role: '작가', ago: '3시간 전', likes: 8, caption: '주운 창틀에 맞춰 그린 작은 방.',
      images: ['/_blob/71ec268cf77968697e52609a9e89714e'], cs: [] },
    { id: 'seo', name: '서도윤', role: '일반', ago: '5시간 전', likes: 4, caption: '오늘 본 전시. 조명이 그림마다 따로 떨어진다.',
      images: ['/_blob/bcec591c9dafe918f247eb3cb24eda3b'],
      cs: [{ n: '정하은', t: '어디 전시인가요?' }] },
    { id: 'jung', name: '정하은', role: '작가', ago: '어제', likes: 11, caption: '창밖을 보고 바로 그린 작은 그림.',
      images: ['/_blob/90130f04b1d9699b388dbe083513054e'], cs: [] },
  ];
  state = { open: false, pi: 0, si: 0, prog: 0, paused: false, sheet: false, ended: false, liked: {}, followed: {}, mine: {}, draft: '', toast: false };

  componentDidMount() {
    this.timer = setInterval(() => this.tick(), 50);
  }
  componentWillUnmount() {
    clearInterval(this.timer);
    clearTimeout(this.toastTimer);
  }
  share() {
    this.setState({ toast: true });
    clearTimeout(this.toastTimer);
    this.toastTimer = setTimeout(() => this.setState({ toast: false }), 1800);
  }
  count(s) {
    return Math.max(1, s.images.length);
  }
  openAt(i) {
    this.setState({ open: true, pi: i, si: 0, prog: 0, paused: false, sheet: false, ended: false, draft: '' });
  }
  tick() {
    const st = this.state;
    if (!st.open || st.paused || st.sheet || st.ended) return;
    const s = this.stories[st.pi];
    const dur = s.images.length ? 5000 : 6500;
    const prog = st.prog + 50 / dur;
    if (prog >= 1) this.next();
    else this.setState({ prog: prog });
  }
  next() {
    const st = this.state;
    const s = this.stories[st.pi];
    if (st.si < this.count(s) - 1) { this.setState({ si: st.si + 1, prog: 0 }); return; }
    if (st.pi < this.stories.length - 1) this.setState({ pi: st.pi + 1, si: 0, prog: 0, draft: '' });
    else this.setState({ ended: true, prog: 1 });
  }
  prev() {
    const st = this.state;
    if (st.si > 0) { this.setState({ si: st.si - 1, prog: 0 }); return; }
    if (st.pi > 0) this.setState({ pi: st.pi - 1, si: 0, prog: 0, draft: '' });
    else this.setState({ prog: 0 });
  }
  hold() {
    this.downAt = Date.now();
    this.setState({ paused: true });
  }
  release() {
    if (this.downAt) { this.held = Date.now() - this.downAt > 280; this.downAt = 0; }
    if (this.state.paused) this.setState({ paused: false });
  }
  tapPrev() {
    if (this.held) { this.held = false; return; }
    this.prev();
  }
  tapNext() {
    if (this.held) { this.held = false; return; }
    this.next();
  }
  flip(key) {
    const s = this.stories[this.state.pi];
    const map = Object.assign({}, this.state[key]);
    map[s.id] = !map[s.id];
    const patch = {};
    patch[key] = map;
    this.setState(patch);
  }
  addComment() {
    const t = this.state.draft.trim();
    if (!t) return;
    const s = this.stories[this.state.pi];
    const mine = Object.assign({}, this.state.mine);
    mine[s.id] = (mine[s.id] || []).concat([{ n: '나', t: t }]);
    this.setState({ mine: mine, draft: '' });
  }
  renderVals() {
    const st = this.state;
    const cards = this.stories.map((s, i) => {
      const n = this.count(s);
      return {
        name: s.name,
        initial: s.name.slice(0, 1),
        hasImg: s.images.length > 0,
        isText: s.images.length === 0,
        img: s.images[0] || '',
        bg: s.images.length ? '#111111' : (s.bg || '#374151'),
        text: s.caption,
        multi: n > 1,
        count: '1/' + n,
        label: s.name + '님의 소식 보기',
        open: () => this.openAt(i),
      };
    });
    const s = this.stories[st.pi];
    const n = this.count(s);
    const si = Math.min(st.si, n - 1);
    const hasImg = s.images.length > 0;
    const segs = Array.from({ length: n }, (_, k) => ({ w: k < si ? '100%' : (k === si ? Math.min(100, st.prog * 100).toFixed(1) + '%' : '0%') }));
    const liked = !!st.liked[s.id];
    const followed = !!st.followed[s.id];
    const list = s.cs.concat(st.mine[s.id] || []).map((c) => ({ n: c.n, t: c.t, initial: c.n.slice(0, 1) }));
    return {
      cards: cards,
      open: st.open,
      paused: st.paused,
      sheet: st.sheet,
      ended: st.ended,
      toast: st.toast,
      share: () => this.share(),
      segs: segs,
      cur: { name: s.name, initial: s.name.slice(0, 1), meta: s.role + ' · ' + s.ago, dialogLabel: s.name + '님의 소식' },
      media: {
        hasImg: hasImg,
        isText: !hasImg,
        img: hasImg ? s.images[si] : '',
        bg: s.bg || '#374151',
        text: s.caption,
        caption: s.caption,
        hasCaption: hasImg && !!s.caption,
        alt: s.name + '님이 올린 사진 ' + (si + 1),
      },
      liked: liked,
      likeCount: s.likes + (liked ? 1 : 0),
      likeColor: liked ? '#ff6b61' : '#ffffff',
      likeFill: liked ? '#ff6b61' : 'none',
      likeLabel: liked ? '좋아요 취소' : '좋아요',
      followed: followed,
      followLabel: followed ? '이웃' : '이웃 추가',
      followBg: followed ? 'rgba(255,255,255,0.22)' : 'transparent',
      commentList: list,
      commentCount: list.length,
      noComments: list.length === 0,
      draft: st.draft,
      onDraft: (e) => this.setState({ draft: e.target.value }),
      addComment: () => this.addComment(),
      openSheet: () => this.setState({ sheet: true }),
      closeSheet: () => this.setState({ sheet: false }),
      close: () => this.setState({ open: false, paused: false, sheet: false, ended: false, prog: 0 }),
      replay: () => this.openAt(0),
      tapPrev: () => this.tapPrev(),
      tapNext: () => this.tapNext(),
      hold: () => this.hold(),
      release: () => this.release(),
      toggleLike: () => this.flip('liked'),
      toggleFollow: () => this.flip('followed'),
    };
  }
}
</script>
