<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>비회원 작가 자료 입력</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
a{color:#111827}a:hover{color:#111827}
</style>
</helmet>
<div style="min-height: 1040px; background: #ffffff; color: #111827; font-family: Inter, 'Noto Sans KR', system-ui, sans-serif; letter-spacing: -0.01em">

<header style="height: 80px; padding: 0 48px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #f3f4f6">
<a href="#" style="font-size: 32px; font-weight: 700; letter-spacing: -0.03em; text-decoration: none">Art<span style="color: #c4302b">Link</span></a>
<nav aria-label="주 메뉴" style="display: flex; gap: 36px; font-size: 16px; color: #4b5563"><span>홈</span><span>작가</span><span>갤러리</span><span>전시</span><span>모집공고</span><span>커뮤니티</span><span>ArtStory</span></nav>
<span style="padding: 6px 10px; border-radius: 6px; background: #f9fafb; font-size: 13px; color: #6b7280">Gallery Owner (갤러리)</span>
</header>

<div style="display: flex; flex-wrap: wrap; align-items: flex-start">
<main style="flex: 999 1 560px; min-width: 0; padding: 32px 48px 48px; box-sizing: border-box">
<div style="max-width: 960px">

<div role="tablist" aria-label="공모 운영" style="display: flex; gap: 32px; border-bottom: 1px solid #e5e7eb; font-size: 15px">
<button type="button" role="tab" aria-selected="false" style="min-height: 48px; padding: 0; border: 0; background: none; font: inherit; color: #6b7280">지원자 <span style="color: #9ca3af">5</span></button>
<button type="button" role="tab" aria-selected="true" style="min-height: 48px; margin-bottom: -1px; padding: 0; border: 0; border-bottom: 2px solid #111827; background: none; font: inherit; font-weight: 600">출품 자료 <span style="color: #9ca3af; font-weight: 400">1/3</span></button>
<button type="button" role="tab" aria-selected="false" aria-disabled="true" style="min-height: 48px; padding: 0; border: 0; background: none; font: inherit; color: #d1d5db">정산</button>
<button type="button" role="tab" aria-selected="false" style="min-height: 48px; padding: 0; border: 0; background: none; font: inherit; color: #6b7280">공지</button>
</div>

<div style="margin-top: 16px; border-top: 2px solid #111827">
<div style="display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; align-items: center; column-gap: 16px; min-height: 64px; padding: 8px 0; border-bottom: 1px solid #e5e7eb">
<span style="width: 56px; height: 56px; background: #e5e7eb"></span>
<span style="font-size: 15px; font-weight: 600">김서윤</span>
<span style="font-size: 13.5px; color: #4b5563">✓ 제출 완료 · 펼치기</span>
</div>

<div style="border-bottom: 1px solid #e5e7eb; padding-bottom: 24px">
<div style="display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; align-items: center; column-gap: 16px; min-height: 64px; padding: 8px 0">
<span style="width: 56px; height: 56px; background: #f3f4f6; display: grid; place-items: center"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#d1d5db" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"></rect><path d="M3 16l5-5 4 4 3-3 6 6"></path></svg></span>
<span style="display: flex; align-items: center; gap: 8px"><span style="font-size: 15px; font-weight: 600">한지우</span><span style="padding: 1px 7px; border: 1px solid #d1d5db; border-radius: 4px; font-size: 12px; color: #4b5563">비회원</span></span>
<span style="display: flex; align-items: center; gap: 20px; font-size: 13.5px"><span style="font-weight: 600; color: #c4302b">시작 전</span><button type="button" style="min-height: 44px; padding: 0; border: 0; background: none; font: inherit; font-size: 13.5px; text-decoration: underline; text-underline-offset: 4px">접기</button></span>
</div>

<div style="margin-left: 72px; padding-top: 16px; border-top: 1px solid #f3f4f6">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 16px">
<h3 style="margin: 0; font-size: 16px; font-weight: 600">한지우 출품 자료</h3>
<p style="margin: 0; display: flex; gap: 16px; font-size: 13.5px; color: #4b5563"><span style="text-decoration: underline; text-underline-offset: 4px">이름 바꾸기</span><span style="text-decoration: underline; text-underline-offset: 4px">이 작가 빼기</span></p>
</div>

<p style="margin: 20px 0 10px; font-size: 14px; font-weight: 600">1 출품작</p>
<div style="display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{ works }}" as="w" hint-placeholder-count="2">
<div style="display: grid; grid-template-columns: 88px minmax(0, 1fr); gap: 16px; padding: 14px; border: 1px solid #e5e7eb; border-radius: 8px">
<span style="width: 88px; height: 88px; background: {{ w.img }}; display: grid; place-items: center; font-size: 11px; color: #6b7280">{{ w.imgLabel }}</span>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
<label style="grid-column: span 2; font-size: 12px; color: #6b7280">작품명<input type="text" value="{{ w.title }}" style="display: block; width: 100%; box-sizing: border-box; height: 40px; margin-top: 4px; padding: 0 10px; border: 1px solid #d1d5db; border-radius: 6px; font: inherit; font-size: 14px; color: #111827"></label>
<label style="font-size: 12px; color: #6b7280">크기 (세로×가로)<input type="text" value="{{ w.size }}" style="display: block; width: 100%; box-sizing: border-box; height: 40px; margin-top: 4px; padding: 0 10px; border: 1px solid #d1d5db; border-radius: 6px; font: inherit; font-size: 14px; color: #111827"></label>
<label style="font-size: 12px; color: #6b7280">제작연도<input type="text" value="{{ w.year }}" style="display: block; width: 100%; box-sizing: border-box; height: 40px; margin-top: 4px; padding: 0 10px; border: 1px solid #d1d5db; border-radius: 6px; font: inherit; font-size: 14px; color: #111827"></label>
<label style="grid-column: span 2; font-size: 12px; color: #6b7280">재료<input type="text" value="{{ w.medium }}" style="display: block; width: 100%; box-sizing: border-box; height: 40px; margin-top: 4px; padding: 0 10px; border: 1px solid #d1d5db; border-radius: 6px; font: inherit; font-size: 14px; color: #111827"></label>
<label style="font-size: 12px; color: #6b7280">희망 판매가<input type="text" value="{{ w.price }}" style="display: block; width: 100%; box-sizing: border-box; height: 40px; margin-top: 4px; padding: 0 10px; border: 1px solid #d1d5db; border-radius: 6px; font: inherit; font-size: 14px; color: #111827"></label>
<span style="align-self: end; display: flex; align-items: center; justify-content: flex-end; gap: 12px; min-height: 40px; font-size: 13px; color: #4b5563"><span>☆ 대표작</span><span>삭제</span></span>
</div>
</div>
</sc-for>
</div>
<button type="button" style="margin-top: 10px; display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 14px; border: 1px dashed #d1d5db; border-radius: 8px; background: #ffffff; font: inherit; font-size: 14px">+ 작품 사진 올리기</button>

<p style="margin: 28px 0 10px; font-size: 14px; font-weight: 600">2 약력</p>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
<label style="font-size: 12px; color: #6b7280">이름<input type="text" value="한지우" style="display: block; width: 100%; box-sizing: border-box; height: 40px; margin-top: 4px; padding: 0 10px; border: 1px solid #d1d5db; border-radius: 6px; font: inherit; font-size: 14px; color: #111827"></label>
<label style="font-size: 12px; color: #6b7280">영문 이름<input type="text" style="display: block; width: 100%; box-sizing: border-box; height: 40px; margin-top: 4px; padding: 0 10px; border: 1px solid #d1d5db; border-radius: 6px; font: inherit; font-size: 14px"></label>
<label style="font-size: 12px; color: #6b7280">전화<input type="text" style="display: block; width: 100%; box-sizing: border-box; height: 40px; margin-top: 4px; padding: 0 10px; border: 1px solid #d1d5db; border-radius: 6px; font: inherit; font-size: 14px"></label>
<label style="font-size: 12px; color: #6b7280">이메일<input type="text" style="display: block; width: 100%; box-sizing: border-box; height: 40px; margin-top: 4px; padding: 0 10px; border: 1px solid #d1d5db; border-radius: 6px; font: inherit; font-size: 14px"></label>
</div>
<p style="margin: 10px 0 0; font-size: 13.5px; color: #4b5563">학력 · 개인전 · 단체전 · 아트페어 · 수상 <span style="margin-left: 8px; text-decoration: underline; text-underline-offset: 4px">항목 추가</span></p>

<p style="margin: 28px 0 10px; font-size: 14px; font-weight: 600">3 작가노트</p>
<textarea aria-label="작가노트" style="display: block; width: 100%; box-sizing: border-box; height: 96px; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 8px; font: inherit; font-size: 14px; resize: none"></textarea>

<div style="margin-top: 20px; display: flex; align-items: center; justify-content: flex-end; gap: 8px">
<button type="button" style="min-height: 44px; padding: 0 16px; border: 1px solid #d1d5db; border-radius: 8px; background: #ffffff; font: inherit; font-size: 14px">임시저장</button>
<button type="button" style="min-height: 44px; padding: 0 20px; border: 0; border-radius: 8px; background: #111827; color: #ffffff; font: inherit; font-size: 14px; font-weight: 600">저장</button>
</div>
</div>
</div>

<div style="display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; align-items: center; column-gap: 16px; min-height: 64px; padding: 8px 0; border-bottom: 1px solid #e5e7eb">
<span style="width: 56px; height: 56px; background: #e5e7eb"></span>
<span style="font-size: 15px; font-weight: 600">박도현</span>
<span style="font-size: 13.5px; font-weight: 600; color: #c4302b">작성 중 <span style="font-weight: 400; color: #4b5563">· 펼치기</span></span>
</div>
</div>
</div>
</main>

<aside aria-label="마이페이지 메뉴" style="flex: 0 0 208px; box-sizing: border-box; min-height: 960px; padding: 40px 16px; border-left: 1px solid #f3f4f6">
<p style="margin: 0 12px 10px; font-size: 11px; letter-spacing: 0.08em; color: #9ca3af">MY PAGE</p>
<sc-for list="{{ menu }}" as="m" hint-placeholder-count="5">
<a href="#" style="display: flex; align-items: center; min-height: 44px; padding: 0 12px; border-radius: 8px; background: {{ m.bg }}; font-size: 14px; color: #374151; text-decoration: none">{{ m.label }}</a>
</sc-for>
</aside>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":1040}}'>
class Component extends DCLogic {
renderVals() {
const M = (label, on) => ({ label, bg: on ? '#f3f4f6' : 'transparent' });
return {
menu: [M('프로필'), M('내 갤러리'), M('내 공모', true), M('내 전시'), M('관심 작품')],
works: [
{ img: '#e7e2da', imgLabel: '작품 사진', title: '봄의 문턱', size: '53×45.5cm', year: '2026', medium: '캔버스에 유채', price: '1,200,000원' },
{ img: '#dfe4e2', imgLabel: '작품 사진', title: '', size: '', year: '', medium: '', price: '' }
]
};
}
}
</script>
</body>
</html>
