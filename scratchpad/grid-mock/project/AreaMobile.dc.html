<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>작품 격자 B안 크기 맞춤 휴대폰</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
a{color:#111827}a:hover{color:#111827}
</style>
</helmet>
<div style="width: 390px; min-height: 1500px; box-sizing: border-box; background: #ffffff; color: #111827; font-family: Inter, 'Noto Sans KR', system-ui, sans-serif; letter-spacing: -0.01em">

<header style="height: 56px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #f0f0f0">
<a href="#" style="font-size: 17px; font-weight: 600; text-decoration: none">윤서진</a>
<a href="#" style="font-size: 13px; font-weight: 600; color: #6b7280; text-decoration: none">ArtLink</a>
</header>

<nav aria-label="홈페이지 탭" style="height: 48px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #e5e7eb">
<div style="display: flex; gap: 18px; height: 100%">
<a href="#" style="display: flex; align-items: center; font-size: 14px; font-weight: 600; text-decoration: none; box-shadow: inset 0 -2px 0 #111827">작품</a>
<a href="#" style="display: flex; align-items: center; font-size: 14px; color: #6b7280; text-decoration: none">소식</a>
<a href="#" style="display: flex; align-items: center; font-size: 14px; color: #6b7280; text-decoration: none">작가노트</a>
<a href="#" style="display: flex; align-items: center; font-size: 14px; color: #6b7280; text-decoration: none">약력</a>
<a href="#" style="display: flex; align-items: center; font-size: 14px; color: #6b7280; text-decoration: none">방명록</a>
</div>
<div style="display: flex; gap: 6px; height: 100%; font-size: 14px">
<a href="#" style="display: flex; align-items: center; font-weight: 700; color: #c4302b; text-decoration: none">문의하기</a>
<button type="button" aria-label="더 보기" style="width: 44px; height: 100%; margin-right: -12px; border: 0; background: none; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="#4b5563"><circle cx="5" cy="12" r="1.7"></circle><circle cx="12" cy="12" r="1.7"></circle><circle cx="19" cy="12" r="1.7"></circle></svg></button>
</div>
</nav>

<main style="padding: 24px 16px 48px; display: flex; flex-direction: column; gap: 40px">
<sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
<section>
<h2 style="margin: 0 0 16px; font-size: 13px; font-weight: 600; letter-spacing: 0.06em; color: #6b7280">{{g.name}}</h2>
<div style="display: flex; flex-direction: {{g.outer}}; gap: {{g.outerGap}}px; align-items: flex-start">
<sc-for list="{{g.lanes}}" as="lane" hint-placeholder-count="2">
<div style="display: flex; flex-direction: {{lane.inner}}; gap: {{lane.gap}}px; align-items: flex-start">
<sc-for list="{{lane.cells}}" as="c" hint-placeholder-count="3">
<figure style="margin: 0; flex: none; width: {{c.colW}}px">
<a href="#" aria-label="{{c.alt}} 보기" style="display: flex; align-items: center; justify-content: center; width: {{c.colW}}px; height: {{c.boxH}}px; overflow: hidden; background: {{c.bg}}">
<img src="{{c.src}}" alt="{{c.alt}}" style="display: block; flex: none; width: {{c.w}}px; height: {{c.h}}px; object-fit: {{c.fit}}">
</a>
<sc-if value="{{c.hasCap}}" hint-placeholder-val="{{true}}">
<figcaption style="margin-top: 8px; font-size: 12px; line-height: 1.4; color: #6b7280">
<p style="margin: 0; font-size: 13px; color: #111827">{{c.head}}</p>
<p style="margin: 0">{{c.medium}}</p>
<p style="margin: 0">{{c.size}}</p>
</figcaption>
</sc-if>
</figure>
</sc-for>
</div>
</sc-for>
</div>
</section>
</sc-for>
</main>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1500}}'>
class Component extends DCLogic {
renderVals() {
const MODE = 'area', MOBILE = true;
const W = [
['3442ba8f0e88bf7eabcdbb4bba71db19', 0.8, '새벽 창, 2024', '캔버스에 유채', '91.0×72.7cm'],
['7e95281b0a7c80430834a22d4b0152de', 2.405, '수평선, 2023', '캔버스에 아크릴', '50.0×120.0cm'],
['75efffc8e536a791eddc562766685d9d', 1, '', '', ''],
['a5da1868e83463878c484c9f3f8e4378', 0.727, '작은 방, 2024', '캔버스에 유채', ''],
['3f61d68b0883d7aa9c56825a96f60556', 1.333, '', '', ''],
['1b42718485c1569fdfe4266c9208cfcf', 1.25, '긴 여름, 2022', '장지에 채색', ''],
['abbb3c88675a413f8df1a6bf52734da5', 0.55, '골목, 2022', '종이에 과슈', '76.0×42.0cm'],
['d0863e949b12d119008301ef42ca8730', 1.333, '', '', ''],
['81fb5c4063b6e9fbad68f64cac2b16a9', 0.75, '물의 기억, 2021', '', '']
];
const cols = MOBILE ? 2 : 3;
const content = MOBILE ? 358 : 1152;
const gap = MODE === 'area' ? (MOBILE ? 8 : 16) : (MOBILE ? 12 : 24);
const rowGap = MOBILE ? 20 : 32;
const stackGap = MOBILE ? 20 : 28;
const S = (content - gap * (cols - 1)) / cols;
const r = (n) => Math.round(n * 10) / 10;
const cell = (w) => {
const a = w[1];
let bw, bh, boxH = S, bg = 'transparent', fit = 'contain';
if (MODE === 'tile') { const inner = S * 0.82; bw = a >= 1 ? inner : inner * a; bh = bw / a; bg = '#f5f5f3'; }
else if (MODE === 'area') { bw = Math.min(S, S * Math.sqrt(0.7 * a)); bh = bw / a; if (bh > S) { bh = S; bw = S * a; } }
else if (MODE === 'crop') { bw = S; bh = S; fit = 'cover'; }
else if (MODE === 'masonry') { bh = Math.min(S / a, S * 1.5); bw = bh * a; boxH = bh; }
else { bw = a >= 1 ? S : S * a; bh = bw / a; }
const capH = w[2] ? 8 + 18 + (w[3] ? 17 : 0) + (w[4] ? 17 : 0) : 0;
return { src: '/_blob/' + w[0], alt: w[2] || '작품', head: w[2], medium: w[3], size: w[4], hasCap: !!w[2], colW: r(S), boxH: r(boxH), w: r(bw), h: r(bh), bg, fit, est: boxH + capH };
};
const lanesOf = (items) => {
const cells = items.map(cell);
if (MODE === 'masonry') {
const lanes = [];
for (let i = 0; i < cols; i += 1) lanes.push({ inner: 'column', gap: stackGap, cells: [], hgt: 0 });
cells.forEach((c) => {
const t = lanes.reduce((m, l) => (l.hgt < m.hgt ? l : m), lanes[0]);
t.cells.push(c);
t.hgt += c.est + stackGap;
});
return lanes;
}
const lanes = [];
for (let i = 0; i < cells.length; i += cols) lanes.push({ inner: 'row', gap, cells: cells.slice(i, i + cols) });
return lanes;
};
const group = (name, items) => ({ name, outer: MODE === 'masonry' ? 'row' : 'column', outerGap: MODE === 'masonry' ? gap : rowGap, lanes: lanesOf(items) });
return { groups: [group('빛의 결', W.slice(0, 5)), group('그 밖의 작품', W.slice(5))] };
}
}
</script>
</body>
</html>
