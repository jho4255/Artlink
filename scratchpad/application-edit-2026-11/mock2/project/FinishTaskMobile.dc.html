<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>휴대폰 — 아래 고정 줄의 선정 마치기</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
a{color:#111827}a:hover{color:#111827}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; display: flex; flex-direction: column; background: #ffffff; color: #111827; font-family: Inter, 'Noto Sans KR', system-ui, sans-serif; letter-spacing: -0.01em">

<header style="flex: none; height: 56px; padding: 0 8px 0 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #f3f4f6">
<a href="#" style="font-size: 24px; font-weight: 700; letter-spacing: -0.03em; text-decoration: none">Art<span style="color: #c4302b">Link</span></a>
<span style="display: flex; align-items: center">
<button type="button" aria-label="ArtTalk" style="width: 44px; height: 44px; border: 0; background: none; display: grid; place-items: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.4A8 8 0 1 1 21 12z"></path></svg></button>
<button type="button" aria-label="알림" style="width: 44px; height: 44px; border: 0; background: none; display: grid; place-items: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"></path></svg></button>
<button type="button" aria-label="메뉴" style="width: 44px; height: 44px; border: 0; background: none; display: grid; place-items: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round"><path d="M4 7h16"></path><path d="M4 12h16"></path><path d="M4 17h16"></path></svg></button>
</span>
</header>

<main style="flex: 1; min-height: 0; overflow: hidden; padding: 4px 20px 0">
<a href="#" style="display: inline-flex; align-items: center; gap: 6px; min-height: 40px; font-size: 14px; text-decoration: none; color: #4b5563"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#4b5563" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"></path><path d="M11 18l-6-6 6-6"></path></svg>내 공모</a>

<div style="margin-top: 4px; display: flex; gap: 14px; align-items: flex-start">
<div style="flex: none; width: 56px; height: 79px; background: #eef0f3"></div>
<div style="flex: 1; min-width: 0">
<p style="margin: 0; font-size: 12.5px; color: #4b5563"><strong style="color: #111827">전시 준비</strong><span style="margin-left: 8px">선정 마감 D-3</span></p>
<p style="margin: 4px 0 0; font-size: 17px; font-weight: 600; line-height: 1.35; letter-spacing: -0.02em">2027 봄 기획전 《새싹》 참여 작가 모집</p>
<p style="margin: 3px 0 0; font-size: 13px; color: #6b7280">갤러리 온결 · 단체전 · 서울</p>
</div>
<button type="button" aria-label="더 보기" style="flex: none; width: 40px; height: 40px; border: 0; background: none; font-size: 18px; color: #374151">⋯</button>
</div>

<div style="margin-top: 16px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px">
<span style="height: 3px; background: #111827"></span><span style="height: 3px; background: #111827"></span><span style="height: 3px; background: #e5e7eb"></span><span style="height: 3px; background: #e5e7eb"></span><span style="height: 3px; background: #e5e7eb"></span>
</div>
<p style="margin: 8px 0 0; font-size: 12.5px; color: #4b5563">모집 · 수락 2/3 · 대기 3 <span style="font-weight: 600; color: #c4302b">· 선정 마감 11.30(월) D-3</span></p>

<div style="margin-top: 14px; padding: 12px 0; border-top: 1px solid #e5e7eb; border-bottom: 1px solid #e5e7eb">
<p style="margin: 0; font-size: 14.5px; font-weight: 600; line-height: 1.5"><span aria-hidden="true" style="display: inline-block; width: 6px; height: 6px; margin-right: 10px; border-radius: 50%; background: #c4302b; vertical-align: middle"></span>11.30(월)까지 선정하세요 · 검토 대기 3명</p>
<p style="margin: 2px 0 0 16px; font-size: 12.5px; color: #6b7280">그날이 지나면 수락하지 않은 지원자는 미선정이 돼요</p>
</div>

<div role="tablist" aria-label="공모 운영" style="margin-top: 4px; display: flex; gap: 22px; border-bottom: 1px solid #e5e7eb; font-size: 14.5px">
<button type="button" role="tab" aria-selected="true" style="min-height: 46px; margin-bottom: -1px; padding: 0; border: 0; border-bottom: 2px solid #111827; background: none; font: inherit; font-weight: 600">지원자 <span style="color: #9ca3af; font-weight: 400">5</span></button>
<button type="button" role="tab" aria-selected="false" style="min-height: 46px; padding: 0; border: 0; background: none; font: inherit; color: #6b7280">출품 자료 <span style="color: #9ca3af">0/2</span></button>
<button type="button" role="tab" aria-selected="false" aria-disabled="true" style="min-height: 46px; padding: 0; border: 0; background: none; font: inherit; color: #d1d5db">정산</button>
<button type="button" role="tab" aria-selected="false" style="min-height: 46px; padding: 0; border: 0; background: none; font: inherit; color: #6b7280">공지</button>
</div>

<div style="margin-top: 10px; display: flex; align-items: center; justify-content: space-between; gap: 8px">
<p style="margin: 0; font-size: 13.5px"><strong style="font-weight: 600">수락 2/3 · 1자리 남음</strong><span style="color: #6b7280"> · 대기 3</span></p>
<button type="button" style="min-height: 40px; padding: 0 4px; border: 0; background: none; font: inherit; font-size: 13.5px; color: #374151">관리 ▾</button>
</div>

<ul style="margin: 4px 0 0; padding: 0; list-style: none">
<sc-for list="{{ rows }}" as="r" hint-placeholder-count="4">
<li style="display: flex; align-items: center; gap: 12px; min-height: 64px; border-bottom: 1px solid #f3f4f6">
<span style="display: flex; gap: 4px"><span style="width: 36px; height: 36px; background: #e5e7eb"></span><span style="width: 36px; height: 36px; background: #eef0f3"></span></span>
<span style="flex: 1; min-width: 0"><span style="display: block; font-size: 15px; font-weight: 600">{{ r.name }}</span><span style="display: block; margin-top: 2px; font-size: 12.5px; color: #6b7280">{{ r.sub }}</span></span>
<span style="font-size: 12.5px; font-weight: {{ r.weight }}; color: {{ r.color }}">{{ r.status }}</span>
</li>
</sc-for>
</ul>
</main>

<div style="flex: none; padding: 12px 20px; border-top: 1px solid #e5e7eb; background: #ffffff">
<button type="button" style="width: 100%; min-height: 48px; border: 0; border-radius: 8px; background: #111827; color: #ffffff; font: inherit; font-size: 15px; font-weight: 600">선정 마치기</button>
</div>

<nav aria-label="하단 메뉴" style="flex: none; height: 56px; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border-top: 1px solid #e5e7eb; background: #ffffff">
<sc-for list="{{ tabs }}" as="t" hint-placeholder-count="7">
<a href="#" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 10.5px; text-decoration: none; color: #6b7280"><span aria-hidden="true" style="width: 18px; height: 18px; border-radius: 4px; background: #e5e7eb"></span>{{ t.label }}</a>
</sc-for>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const R = (name, sub, status) => ({
name, sub, status,
color: status === '검토 대기' ? '#111827' : '#6b7280',
weight: status === '검토 대기' ? 600 : 400
});
return {
rows: [
R('김서윤', '초대 코드', '✓ 수락됨'),
R('이하린', '3번째 지원', '✓ 수락됨'),
R('박도현', '첫 지원', '검토 대기'),
R('정민재', '첫 지원', '검토 대기')
],
tabs: [{ label: '홈' }, { label: '작가' }, { label: '갤러리' }, { label: '전시' }, { label: '모집공고' }, { label: '커뮤니티' }, { label: 'ArtStory' }]
};
}
}
</script>
</body>
</html>
