<span style="display: block; font-size: 13px; color: #4b5563"><strong style="color: #111827; font-weight: 700">심사 중</strong><span style="margin-left: 8px">11.18(수) 지원</span></span>

<div style="margin-top: 20px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; font-size: 12.5px">

<p style="margin: 20px 0 0; display: flex; justify-content: space-between; font-size: 15px; font-weight: 600">내가 낸 지원서<span style="font-size: 13px; font-weight: 400; color: #6b7280">11.18(수) 제출</span></p>

<p style="margin: 0; font-size: 14px; line-height: 1.6; color: #374151">[지원서 내용]</p>

<sc-for list="{{ tabs }}" as="t" hint-placeholder-count="7"><span style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px"><span style="width: 20px; height: 20px; border-radius: 5px; border: 1.6px solid #9ca3af; box-sizing: border-box"></span>{{ t }}</span></sc-for>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>

}
</script>
