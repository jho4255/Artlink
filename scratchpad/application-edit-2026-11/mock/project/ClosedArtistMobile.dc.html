<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>작가 내 전시 종료 탭</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
a{color:#111827}a:hover{color:#111827}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; display: flex; flex-direction: column; background: #ffffff; color: #111827; font-family: Inter, 'Noto Sans KR', system-ui, sans-serif; letter-spacing: -0.01em">

<header style="flex: none; height: 64px; padding: 0 8px 0 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #f3f4f6">
<a href="#" style="font-size: 26px; font-weight: 700; letter-spacing: -0.03em; text-decoration: none">Art<span style="color: #c4302b">Link</span></a>
<span style="display: flex">
<button type="button" aria-label="ArtTalk" style="width: 44px; height: 44px; border: 0; background: none"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#374151" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"></path></svg></button>
<button type="button" aria-label="알림" style="width: 44px; height: 44px; border: 0; background: none"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#374151" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9a6 6 0 0 1 12 0c0 6 2.5 7.5 2.5 7.5h-17S6 15 6 9z"></path><path d="M10 20a2 2 0 0 0 4 0"></path></svg></button>
<button type="button" aria-label="메뉴" style="width: 44px; height: 44px; border: 0; background: none"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#374151" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16"></path><path d="M4 12h16"></path><path d="M4 17h16"></path></svg></button>
</span>
</header>

<main style="flex: 1; min-height: 0; padding: 0 20px">
<h1 style="margin: 24px 0 0; font-size: 26px; font-weight: 700; letter-spacing: -0.02em">내 전시</h1>
<div role="tablist" aria-label="내 전시" style="margin-top: 18px; display: flex; gap: 24px; border-bottom: 1px solid #e5e7eb; font-size: 15px">
<button type="button" role="tab" aria-selected="false" style="min-height: 46px; padding: 0; border: 0; background: none; font: inherit; color: #6b7280">심사 중 <span style="color: #9ca3af">1</span></button>
<button type="button" role="tab" aria-selected="false" style="min-height: 46px; padding: 0; border: 0; background: none; font: inherit; color: #6b7280">진행 중 <span style="color: #9ca3af">2</span></button>
<button type="button" role="tab" aria-selected="true" style="min-height: 46px; margin-bottom: -1px; padding: 0; border: 0; border-bottom: 2px solid #111827; background: none; font: inherit; font-weight: 600">종료 <span style="color: #9ca3af; font-weight: 400">2</span></button>
</div>

<ul style="margin: 0; padding: 0; list-style: none">
<li style="padding: 18px 0; border-bottom: 1px solid #f3f4f6">
<a href="#" style="display: flex; gap: 14px; text-decoration: none">
<span style="flex: none; width: 56px; height: 79px; background: #eef0f3"></span>
<span style="flex: 1; min-width: 0">
<span style="display: block; font-size: 13px; color: #4b5563"><strong style="color: #6b7280; font-weight: 700">미선정</strong><span style="margin-left: 8px">10.15(목) 모집 마감</span></span>
<span style="display: block; margin-top: 4px; font-size: 16px; font-weight: 600; line-height: 1.35">ArtLink 우수 포트폴리오 공모전</span>
<span style="display: block; margin-top: 3px; font-size: 13px; color: #6b7280">아트링크</span>
</span>
</a>
<p style="margin: 14px 0 0; display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 14px; color: #4b5563">이번 공모에서는 선정되지 않았어요.<button type="button" style="flex: none; min-height: 40px; padding: 0; border: 0; background: none; font: inherit; font-size: 13.5px; color: #111827; text-decoration: underline; text-underline-offset: 4px">목록에서 지우기</button></p>
</li>
<li style="padding: 18px 0; border-bottom: 1px solid #f3f4f6">
<a href="#" style="display: flex; gap: 14px; text-decoration: none">
<span style="flex: none; width: 56px; height: 79px; background: #e5e7eb"></span>
<span style="flex: 1; min-width: 0">
<span style="display: block; font-size: 13px; color: #4b5563"><strong style="color: #111827; font-weight: 700">정산 완료</strong><span style="margin-left: 8px">9.28(월)</span></span>
<span style="display: block; margin-top: 4px; font-size: 16px; font-weight: 600; line-height: 1.35">가을 소품전 《작은 방》</span>
<span style="display: block; margin-top: 3px; font-size: 13px; color: #6b7280">갤러리 온결</span>
</span>
</a>
<div style="margin-top: 14px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px"><span style="height: 3px; background: #111827"></span><span style="height: 3px; background: #111827"></span><span style="height: 3px; background: #111827"></span><span style="height: 3px; background: #111827"></span><span style="height: 3px; background: #111827"></span></div>
</li>
</ul>
</main>

<nav aria-label="하단 메뉴" style="flex: none; height: 64px; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border-top: 1px solid #f3f4f6; font-size: 10.5px; color: #6b7280; text-align: center">
<sc-for list="{{ tabs }}" as="t" hint-placeholder-count="7"><span style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px"><span style="width: 20px; height: 20px; border-radius: 5px; border: 1.6px solid #9ca3af; box-sizing: border-box"></span>{{ t }}</span></sc-for>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { tabs: ['홈', '작가', '갤러리', '전시', '모집공고', '커뮤니티', 'ArtStory'] };
}
}
</script>
</body>
</html>
