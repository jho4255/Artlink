<div style="flex: none; width: 96px; height: 136px; background: #eef0f3"></div>
<div style="min-width: 0">

<p style="margin: 0; flex: none; font-size: 14px"><strong style="color: #c4302b">D-2</strong> <span style="color: #4b5563">11.23(월)까지</span></p>
<a href="#" style="flex: 1; display: inline-flex; align-items: center; justify-content: center; min-height: 46px; border-radius: 8px; background: #111827; font-size: 15px; font-weight: 600; color: #ffffff; text-decoration: none">지원하기</a>
