<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>지원서 수정 PC</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
a{color:#111827}a:hover{color:#111827}
</style>
</helmet>
<div style="min-height: 1040px; background: #ffffff; color: #111827; font-family: Inter, 'Noto Sans KR', system-ui, sans-serif; letter-spacing: -0.01em">

<header style="height: 80px; padding: 0 48px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #f3f4f6">
<a href="#" style="font-size: 32px; font-weight: 700; letter-spacing: -0.03em; text-decoration: none">Art<span style="color: #c4302b">Link</span></a>
<nav aria-label="주 메뉴" style="display: flex; gap: 36px; font-size: 16px; color: #4b5563"><span>홈</span><span>작가</span><span>갤러리</span><span>전시</span><span>모집공고</span><span>커뮤니티</span><span>ArtStory</span></nav>
<span style="padding: 6px 10px; border-radius: 6px; background: #f9fafb; font-size: 13px; color: #6b7280">김서윤 (작가)</span>
</header>

<div style="display: flex; flex-wrap: wrap; align-items: flex-start">
<main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box">
<div style="max-width: 768px; margin: 0 auto; padding: 40px 48px 0">
<a href="PendingArtistPC.dc.html" style="display: inline-flex; align-items: center; gap: 6px; min-height: 44px; font-size: 14px; text-decoration: none; color: #6b7280"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6b7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"></path><path d="M11 18l-6-6 6-6"></path></svg>내 전시</a>

<p style="margin: 8px 0 0; font-size: 14px; color: #6b7280">지원서 수정</p>
<h1 style="margin: 4px 0 0; font-size: 30px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.25">겨울 드로잉 클럽 참여 작가 모집</h1>
<p style="margin: 8px 0 0; font-size: 14px; color: #6b7280">갤러리 온결 · <strong style="color: #111827; font-weight: 500">마감 D-2</strong> · 11.21(토)에 냈어요</p>

<section style="margin-top: 36px">
<h2 style="margin: 0; display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 600"><span style="display: grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: #111827; font-size: 12px; color: #ffffff">1</span>작가 약력 *</h2>
<label for="bio" style="position: absolute; width: 1px; height: 1px; overflow: hidden">작가 약력</label>
<textarea id="bio" rows="4" style="margin-top: 12px; width: 100%; box-sizing: border-box; padding: 12px; border: 1px solid #9ca3af; border-radius: 8px; font: inherit; font-size: 14.5px; line-height: 1.6; resize: vertical">일상의 장면을 오래 들여다보고 그 안에 남는 감정을 연필과 목탄으로 옮깁니다. 2026년부터는 겨울 풍경 연작을 그리고 있습니다.</textarea>
<p style="margin: 6px 0 0; font-size: 12.5px; color: #6b7280"><span aria-hidden="true" style="display: inline-block; width: 6px; height: 6px; margin-right: 6px; border-radius: 50%; background: #111827; vertical-align: middle"></span>고침</p>
</section>

<section style="margin-top: 32px">
<h2 style="margin: 0; display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 600"><span style="display: grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: #111827; font-size: 12px; color: #ffffff">2</span>경력</h2>
<div style="margin-top: 12px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<div style="padding: 12px; border: 1px solid #e5e7eb; border-radius: 8px"><p style="margin: 0; font-size: 13px; font-weight: 600">개인전</p><p style="margin: 6px 0 0; font-size: 14px; color: #374151">2025 《남은 빛》, 갤러리 온결</p></div>
<div style="padding: 12px; border: 1px solid #e5e7eb; border-radius: 8px"><p style="margin: 0; font-size: 13px; font-weight: 600">단체전</p><p style="margin: 6px 0 0; font-size: 14px; color: #9ca3af">비어 있음</p></div>
</div>
</section>

<section style="margin-top: 32px">
<h2 style="margin: 0; display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 600"><span style="display: grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: #111827; font-size: 12px; color: #ffffff">3</span>작품 사진 *</h2>
<div style="margin-top: 12px; display: flex; flex-wrap: wrap; gap: 10px">
<sc-for list="{{ photos }}" as="p" hint-placeholder-count="4">
<span style="position: relative; width: 120px; height: 120px; background: {{ p.bg }}"><button type="button" aria-label="사진 빼기" style="position: absolute; top: 4px; right: 4px; width: 28px; height: 28px; border: 0; border-radius: 50%; background: rgba(17,24,39,0.7); color: #ffffff; font-size: 14px">×</button></span>
</sc-for>
<button type="button" style="width: 120px; height: 120px; border: 1px dashed #d1d5db; border-radius: 8px; background: #ffffff; font: inherit; font-size: 13px; color: #6b7280">+ 사진 추가</button>
</div>
<p style="margin: 6px 0 0; font-size: 12.5px; color: #6b7280"><span aria-hidden="true" style="display: inline-block; width: 6px; height: 6px; margin-right: 6px; border-radius: 50%; background: #111827; vertical-align: middle"></span>고침</p>
</section>

<section style="margin-top: 32px">
<h2 style="margin: 0; display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 600"><span style="display: grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: #111827; font-size: 12px; color: #ffffff">4</span>포트폴리오 파일</h2>
<p style="margin: 12px 0 0; display: flex; align-items: center; justify-content: space-between; padding: 12px; border: 1px solid #e5e7eb; border-radius: 8px; font-size: 14px">김서윤_포트폴리오_2026.pdf<button type="button" style="min-height: 36px; border: 0; background: none; font: inherit; font-size: 13px; color: #6b7280; text-decoration: underline">바꾸기</button></p>
</section>

<section style="margin-top: 32px">
<h2 style="margin: 0; display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 600"><span style="display: grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: #111827; font-size: 12px; color: #ffffff">5</span>갤러리 추가 질문</h2>
<label for="q1" style="display: block; margin-top: 12px; font-size: 14px; font-weight: 500">작품 운송·설치가 가능한 일정 *</label>
<input id="q1" value="12월 둘째 주 평일 오후, 직접 가져갑니다." style="margin-top: 8px; width: 100%; box-sizing: border-box; min-height: 44px; padding: 0 12px; border: 1px solid #e5e7eb; border-radius: 8px; font: inherit; font-size: 14.5px">
</section>
</div>

<div style="position: sticky; bottom: 0; margin-top: 40px; border-top: 1px solid #f3f4f6; background: rgba(255,255,255,0.95)">
<div style="max-width: 768px; margin: 0 auto; padding: 12px 48px; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; gap: 16px">
<p style="margin: 0; font-size: 14px; color: #374151">고친 곳 2 · <span style="color: #6b7280">작가 약력, 작품 사진</span></p>
<div style="display: flex; gap: 8px">
<a href="PendingArtistPC.dc.html" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px; border-radius: 8px; font-size: 14px; color: #374151; text-decoration: none">취소</a>
<a href="PendingArtistPC.dc.html" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 22px; border-radius: 8px; background: #111827; font-size: 14px; font-weight: 600; color: #ffffff; text-decoration: none">수정 저장</a>
</div>
</div>
</div>
</main>

<aside aria-label="마이페이지 메뉴" style="flex: 0 0 208px; box-sizing: border-box; min-height: 960px; padding: 40px 16px; border-left: 1px solid #f3f4f6">
<p style="margin: 0 12px 12px; font-size: 11px; letter-spacing: 0.12em; color: #9ca3af">MY PAGE</p>
<sc-for list="{{ menu }}" as="m" hint-placeholder-count="6">
<a href="#" style="display: flex; align-items: center; min-height: 44px; padding: 0 12px; border-radius: 8px; background: {{ m.bg }}; font-size: 14px; color: #374151; text-decoration: none">{{ m.label }}</a>
</sc-for>
</aside>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":1040}}'>
class Component extends DCLogic {
renderVals() {
const M = (label, on) => ({ label, bg: on ? '#f3f4f6' : 'transparent' });
return {
menu: [M('프로필'), M('홈페이지'), M('포트폴리오'), M('찜 목록'), M('내 전시', true), M('ArtLook')],
photos: [{ bg: '#e5e7eb' }, { bg: '#eef0f3' }, { bg: '#e5e7eb' }, { bg: '#d1d5db' }]
};
}
}
</script>
</body>
</html>
