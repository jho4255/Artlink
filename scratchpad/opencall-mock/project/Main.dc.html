<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>모집공고 찾기 PC</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0}
a{color:#111827}a:hover{color:#111827}
</style>
</helmet>
<div style="width: 100%; background: #ffffff; color: #111827; font-family: Inter, 'Noto Sans KR', system-ui, sans-serif; letter-spacing: -0.01em">

<header style="border-bottom: 1px solid #f3f4f6">
<div style="max-width: 1280px; margin: 0 auto; padding: 0 48px; box-sizing: border-box; height: 80px; display: flex; align-items: center; justify-content: space-between; gap: 24px; flex-wrap: wrap">
<a href="#" style="font-size: 30px; font-weight: 700; text-decoration: none; letter-spacing: -0.03em">Art<span style="color: #c4302b">Link</span></a>
<nav aria-label="주 메뉴" style="display: flex; gap: 8px; font-size: 16px; font-weight: 500">
<a href="#" style="padding: 10px 16px; text-decoration: none; color: #6b7280">홈</a>
<a href="#" style="padding: 10px 16px; text-decoration: none; color: #6b7280">작가</a>
<a href="#" style="padding: 10px 16px; text-decoration: none; color: #6b7280">갤러리</a>
<a href="#" style="padding: 10px 16px; text-decoration: none; color: #6b7280">전시</a>
<a href="#" aria-current="page" style="padding: 10px 16px; text-decoration: none; color: #111827; border-bottom: 2px solid #111827">모집공고</a>
<a href="#" style="padding: 10px 16px; text-decoration: none; color: #6b7280">커뮤니티</a>
<a href="#" style="padding: 10px 16px; text-decoration: none; color: #6b7280">ArtStory</a>
</nav>
<a href="#" style="padding: 9px 16px; background: #111827; color: #ffffff; border-radius: 8px; font-size: 14px; font-weight: 500; text-decoration: none">로그인</a>
</div>
</header>

<main style="max-width: 1280px; margin: 0 auto; padding: 56px 48px 96px; box-sizing: border-box">

<div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; flex-wrap: wrap">
<h1 style="margin: 0; font-size: 48px; font-weight: 400; line-height: 1.1; letter-spacing: -0.02em">Open Call</h1>
<form role="search" style="display: flex; align-items: center; gap: 10px; width: 340px; max-width: 100%; height: 44px; border-bottom: 1px solid #111827; box-sizing: border-box">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6b7280" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
<label for="q" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">공모 검색</label>
<input id="q" type="search" placeholder="공모 제목 · 주최 검색" style="flex: 1; min-width: 0; border: 0; outline: 0; font: inherit; font-size: 15px; color: #111827; background: transparent">
</form>
</div>

<div style="margin-top: 36px; border-bottom: 1px solid #e5e7eb; display: flex; align-items: stretch; justify-content: space-between; gap: 24px; flex-wrap: wrap">
<div role="tablist" aria-label="모집 상태" style="display: flex; gap: 32px">
<button role="tab" aria-selected="true" type="button" style="position: relative; min-height: 48px; padding: 0; border: 0; background: none; font: inherit; font-size: 15px; font-weight: 600; color: #111827; cursor: pointer; box-shadow: inset 0 -2px 0 #111827">모집 중 <span style="margin-left: 4px; font-size: 13px; font-weight: 400; color: #6b7280">8</span></button>
<button role="tab" aria-selected="false" type="button" style="min-height: 48px; padding: 0; border: 0; background: none; font: inherit; font-size: 15px; color: #6b7280; cursor: pointer">마감 <span style="margin-left: 4px; font-size: 13px; color: #6b7280">27</span></button>
</div>
<div role="group" aria-label="정렬" style="display: flex; align-items: center; gap: 20px; font-size: 14px">
<button type="button" aria-pressed="true" style="min-height: 44px; padding: 0; border: 0; background: none; font: inherit; color: #111827; text-decoration: underline; text-underline-offset: 4px; cursor: pointer">마감 임박순</button>
<button type="button" aria-pressed="false" style="min-height: 44px; padding: 0; border: 0; background: none; font: inherit; color: #6b7280; cursor: pointer">최신 등록순</button>
</div>
</div>

<div style="margin-top: 8px; display: flex; flex-wrap: wrap; column-gap: 56px; row-gap: 0; font-size: 15px">
<div role="group" aria-label="지역" style="display: flex; align-items: center; gap: 20px; flex-wrap: wrap">
<span style="font-size: 13px; font-weight: 600; color: #374151">지역</span>
<button type="button" aria-pressed="true" style="min-height: 44px; padding: 0; border: 0; background: none; font: inherit; color: #111827; text-decoration: underline; text-underline-offset: 4px; cursor: pointer">전체</button>
<button type="button" style="min-height: 44px; padding: 0; border: 0; background: none; font: inherit; color: #6b7280; cursor: pointer">서울 <span style="font-size: 13px">5</span></button>
<button type="button" style="min-height: 44px; padding: 0; border: 0; background: none; font: inherit; color: #6b7280; cursor: pointer">부산 <span style="font-size: 13px">1</span></button>
<button type="button" style="min-height: 44px; padding: 0; border: 0; background: none; font: inherit; color: #6b7280; cursor: pointer">충북 <span style="font-size: 13px">1</span></button>
<button type="button" style="min-height: 44px; padding: 0; border: 0; background: none; font: inherit; color: #6b7280; cursor: pointer">경남 <span style="font-size: 13px">1</span></button>
</div>
<div role="group" aria-label="유형" style="display: flex; align-items: center; gap: 20px; flex-wrap: wrap">
<span style="font-size: 13px; font-weight: 600; color: #374151">유형</span>
<button type="button" aria-pressed="true" style="min-height: 44px; padding: 0; border: 0; background: none; font: inherit; color: #111827; text-decoration: underline; text-underline-offset: 4px; cursor: pointer">전체</button>
<button type="button" style="min-height: 44px; padding: 0; border: 0; background: none; font: inherit; color: #6b7280; cursor: pointer">개인전 <span style="font-size: 13px">2</span></button>
<button type="button" style="min-height: 44px; padding: 0; border: 0; background: none; font: inherit; color: #6b7280; cursor: pointer">단체전 <span style="font-size: 13px">6</span></button>
</div>
</div>

<sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
<section style="margin-top: 40px">
<h2 style="margin: 0 0 20px; font-size: 14px; font-weight: 600; color: #111827; display: flex; align-items: baseline; gap: 8px">{{g.label}} <span style="font-size: 13px; font-weight: 400; color: #6b7280">{{g.count}}</span></h2>
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 40px 28px">
<sc-for list="{{g.items}}" as="item" hint-placeholder-count="4">
<article style="min-width: 0">
<a href="DetailPC.dc.html" aria-label="{{item.title}}" style="display: block; position: relative; aspect-ratio: 210 / 297; overflow: hidden; background: {{item.bg}}; text-decoration: none">
<span style="position: absolute; left: 18px; right: 18px; top: 18px; font-size: 10px; font-weight: 600; letter-spacing: 0.16em; color: {{item.fg}}">{{item.kicker}}</span>
<span style="position: absolute; left: 18px; right: 18px; top: 40px; font-size: 26px; font-weight: 800; line-height: 1.16; letter-spacing: -0.03em; white-space: pre-line; color: {{item.fg}}">{{item.poster}}</span>
<img src="{{item.img}}" alt="" style="position: absolute; left: 0; bottom: 0; width: 100%; height: 54%; object-fit: cover; display: block">
</a>
<div style="margin-top: 14px; display: flex; align-items: center; justify-content: space-between; gap: 8px">
<p style="margin: 0; font-size: 14px; color: #6b7280"><strong style="font-weight: 700; color: {{item.dcolor}}">{{item.dday}}</strong><span style="margin-left: 8px">{{item.until}}</span></p>
<button type="button" aria-label="찜하기" style="width: 44px; height: 44px; margin: -12px -12px -12px 0; border: 0; background: none; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9ca3af" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21.2l7.8-7.7 1-1.1a5.5 5.5 0 0 0 0-7.8z"></path></svg>
</button>
</div>
<h3 style="margin: 6px 0 0; font-size: 18px; font-weight: 500; line-height: 1.4; word-break: keep-all; overflow-wrap: anywhere"><a href="DetailPC.dc.html" style="text-decoration: none">{{item.title}}</a></h3>
<p style="margin: 6px 0 0; font-size: 14px; color: #4b5563">{{item.host}}</p>
<p style="margin: 4px 0 0; font-size: 13px; color: #6b7280">{{item.meta}}</p>
</article>
</sc-for>
</div>
</section>
</sc-for>

</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":2180}}'>
class Component extends DCLogic {
renderVals() {
const A = '#c4302b', K = '#111827';
const it = (dday, hot, until, title, host, meta, kicker, poster, bg, fg, img) => ({ dday, dcolor: hot ? A : K, until, title, host, meta, kicker, poster, bg, fg, img: '/_blob/' + img });
const week = [
it('오늘 마감', true, '11.15(일)까지', '겨울 단체전 《작은 방들》 참여 작가 모집', '갤러리 온결', '단체전 · 서울 · 8명', 'OPEN CALL 2026', '작은\n방들', '#1f2a44', '#ffffff', '86d4fa8cd3ff69ef3261633feff3cab8'),
it('D-1', true, '11.16(월)까지', '2027 신진 작가 개인전 공모', '스페이스 모루', '개인전 · 서울 · 0명', 'EMERGING ARTIST', '2027\n신진 작가', '#f1ede4', '#111827', '7957497c1858b367ff8e66306196137b'),
it('D-3', true, '11.18(수)까지', '바다를 주제로 한 드로잉전 작가 모집', '갤러리 해담', '단체전 · 부산 · 10명', 'DRAWING SHOW', '수평선\n아래', '#0f5d73', '#ffffff', '3435a4a550964493354fe9f99ea51182'),
it('D-7', true, '11.22(일)까지', '아트링크 기획 공모 《종이의 시간》', '아트링크 주최', '단체전 · 서울 · 00명', 'ARTLINK OPEN CALL', '종이의\n시간', '#e9e4d8', '#111827', 'ff78e3bc78af10a4e2d383b07d513dfb')
];
const nov = [
it('D-9', false, '11.24(화)까지', '연말 소품전 《선물》 출품 작가 모집', '갤러리 온결', '단체전 · 서울 · 12명', 'SMALL WORKS', '선물', '#7a1f1f', '#ffffff', 'f27490405953feabcacb8412c77953fb'),
it('D-15', false, '11.30(월)까지', '2027 상반기 레지던시 입주 작가 모집', '아트링크 주최 · 참여 갤러리 2곳', '단체전 · 충북 · 00명', 'RESIDENCY 2027', '입주 작가\n모집', '#dfe6ee', '#111827', 'e90ec5d2fb99384787a8488d25e666c3')
];
const later = [
it('D-21', false, '12.6(일)까지', '《도시 산책》 사진 · 회화 2인전 공모', '공간 여백', '단체전 · 서울 · 2명', 'TWO PERSON SHOW', '도시\n산책', '#26302b', '#ffffff', '8af93d13a3a1f2fcb44163ec95b1c801'),
it('D-22', false, '12.7(월)까지', '첫 개인전 지원 공모', '갤러리 서림', '개인전 · 경남 · 0명', 'FIRST SOLO', '첫\n개인전', '#f4dccf', '#111827', 'bd67b717bb50bfa46e11b66b66664861')
];
return { groups: [
{ label: '이번 주 마감', count: week.length, items: week },
{ label: '11월 마감', count: nov.length, items: nov },
{ label: '12월 이후', count: later.length, items: later }
] };
}
}
</script>
</body>
</html>
