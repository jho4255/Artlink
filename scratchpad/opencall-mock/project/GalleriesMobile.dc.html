<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>갤러리 찾기 휴대폰</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0}
a{color:#111827}a:hover{color:#111827}
</style>
</helmet>
<div style="width: 390px; min-height: 1480px; box-sizing: border-box; background: #ffffff; color: #111827; font-family: Inter, 'Noto Sans KR', system-ui, sans-serif; letter-spacing: -0.01em; display: flex; flex-direction: column">

<header style="height: 64px; padding: 0 24px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #f3f4f6">
<a href="#" style="font-size: 26px; font-weight: 700; text-decoration: none; letter-spacing: -0.03em">Art<span style="color: #c4302b">Link</span></a>
<a href="#" style="padding: 9px 14px; background: #111827; color: #ffffff; border-radius: 8px; font-size: 14px; font-weight: 500; text-decoration: none">로그인</a>
</header>

<main style="flex: 1; padding: 28px 24px 32px">

<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
<h1 style="margin: 0; font-size: 34px; font-weight: 400; line-height: 1.1; letter-spacing: -0.02em">Galleries</h1>
<button type="button" aria-label="갤러리 검색" style="width: 44px; height: 44px; margin-right: -10px; border: 0; background: none; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#111827" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
</button>
</div>

<div role="group" aria-label="지역" style="margin: 16px -24px 0; padding: 0 24px; display: flex; align-items: stretch; gap: 20px; overflow-x: auto; white-space: nowrap; font-size: 15px; border-bottom: 1px solid #e5e7eb">
<button type="button" aria-pressed="true" style="min-height: 46px; padding: 0; border: 0; background: none; font: inherit; font-weight: 600; color: #111827; cursor: pointer; flex: none; box-shadow: inset 0 -2px 0 #111827">전체 <span style="margin-left: 3px; font-size: 12px; font-weight: 400; color: #6b7280">9</span></button>
<button type="button" style="min-height: 46px; padding: 0; border: 0; background: none; font: inherit; color: #6b7280; cursor: pointer; flex: none">서울 <span style="font-size: 12px">6</span></button>
<button type="button" style="min-height: 46px; padding: 0; border: 0; background: none; font: inherit; color: #6b7280; cursor: pointer; flex: none">부산 <span style="font-size: 12px">1</span></button>
<button type="button" style="min-height: 46px; padding: 0; border: 0; background: none; font: inherit; color: #6b7280; cursor: pointer; flex: none">인천 <span style="font-size: 12px">1</span></button>
<button type="button" style="min-height: 46px; padding: 0; border: 0; background: none; font: inherit; color: #6b7280; cursor: pointer; flex: none">경남 <span style="font-size: 12px">1</span></button>
</div>

<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 13px">
<label style="display: inline-flex; align-items: center; gap: 8px; min-height: 46px; color: #374151; cursor: pointer"><input type="checkbox" style="width: 16px; height: 16px; margin: 0; accent-color: #111827">작가 모집 중인 곳만</label>
<button type="button" aria-label="정렬: 모집 중 먼저" style="min-height: 46px; padding: 0; border: 0; background: none; font: inherit; color: #4b5563; display: flex; align-items: center; gap: 4px; cursor: pointer">모집 중 먼저
<svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#4b5563" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg>
</button>
</div>

<div style="border-top: 1px solid #f3f4f6">
<sc-for list="{{galleries}}" as="g" hint-placeholder-count="6">
<article style="display: flex; gap: 16px; padding: 18px 0; border-bottom: 1px solid #f3f4f6">
<a href="#" aria-label="{{g.name}}" style="flex: none; display: block; position: relative; width: 124px; height: 93px; overflow: hidden; background: {{g.wall}}; text-decoration: none">
<sc-if value="{{g.photo}}" hint-placeholder-val="{{ false }}">
<img src="{{g.img}}" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block">
</sc-if>
<sc-if value="{{g.hung}}" hint-placeholder-val="{{ true }}">
<span style="position: absolute; left: 0; right: 0; bottom: 0; height: 16%; background: rgba(17,24,39,0.10)"></span>
<img src="{{g.img}}" alt="" style="position: absolute; left: 50%; top: 44%; transform: translate(-50%, -50%); max-width: 48%; max-height: 60%; display: block; box-shadow: 0 3px 8px rgba(17,24,39,0.22)">
</sc-if>
</a>
<div style="flex: 1; min-width: 0">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
<h2 style="margin: 0; min-width: 0; font-size: 17px; font-weight: 500; line-height: 1.35"><a href="#" style="text-decoration: none">{{g.name}}</a></h2>
<button type="button" aria-label="찜하기" style="width: 44px; height: 44px; margin: -13px -13px -13px 0; border: 0; background: none; display: flex; align-items: center; justify-content: center; cursor: pointer; flex: none">
<svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#9ca3af" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21.2l7.8-7.7 1-1.1a5.5 5.5 0 0 0 0-7.8z"></path></svg>
</button>
</div>
<p style="margin: 3px 0 0; font-size: 12px; color: #6b7280">{{g.place}}</p>
<p style="margin: 6px 0 0; font-size: 13px; line-height: 1.5; color: #4b5563; word-break: keep-all; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden">{{g.desc}}</p>
<sc-if value="{{g.call}}" hint-placeholder-val="{{ true }}">
<p style="margin: 9px 0 0; font-size: 12px; color: #374151; display: flex; gap: 6px; min-width: 0"><strong style="flex: none; font-weight: 600; color: #c4302b">모집 중</strong><span style="min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{g.call}}</span></p>
</sc-if>
<sc-if value="{{g.show}}" hint-placeholder-val="{{ true }}">
<p style="margin: 4px 0 0; font-size: 12px; color: #374151; display: flex; gap: 6px; min-width: 0"><strong style="flex: none; font-weight: 600; color: #111827">전시 중</strong><span style="min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{g.show}}</span></p>
</sc-if>
</div>
</article>
</sc-for>
</div>

</main>

<nav aria-label="하단 메뉴" style="height: 57px; border-top: 1px solid #e5e7eb; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); align-items: center; text-align: center; font-size: 10px; color: #6b7280">
<a href="#" style="text-decoration: none; color: #6b7280">홈</a>
<a href="#" style="text-decoration: none; color: #6b7280">작가</a>
<a href="#" aria-current="page" style="text-decoration: none; color: #111827; font-weight: 600">갤러리</a>
<a href="#" style="text-decoration: none; color: #6b7280">전시</a>
<a href="ListMobile.dc.html" style="text-decoration: none; color: #6b7280">모집공고</a>
<a href="#" style="text-decoration: none; color: #6b7280">커뮤니티</a>
<a href="#" style="text-decoration: none; color: #6b7280">ArtStory</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1480}}'>
class Component extends DCLogic {
renderVals() {
const g = (name, place, desc, call, show, wall, img, photo) => ({ name, place, desc, call, show, wall, img: '/_blob/' + img, photo: !!photo, hung: !photo });
return { galleries: [
g('갤러리 온결', '서울 종로구 · 리뷰 3개', '빛과 기억을 다루는 동시대 회화를 소개하는 갤러리', '연말 소품전 《선물》 외 1 · D-9', '《물이 지나간 자리》 · 12.6까지', '#e9e6e0', '30bac2f373d5539f9185d2c4a677bccf', true),
g('스페이스 모루', '서울 마포구', '신진 작가의 첫 개인전을 여는 작은 전시 공간', '2027 신진 작가 개인전 공모 · D-1', '', '#eceae6', '7957497c1858b367ff8e66306196137b'),
g('갤러리 해담', '부산 해운대구 · 리뷰 1개', '바다가 보이는 2층 전시장. 드로잉과 판화를 주로 다룹니다', '바다를 주제로 한 드로잉전 · D-3', '《수평선 아래》 · 12.5까지', '#dfe5e8', '9d500467a05f116f253e37cc957b0c63'),
g('공간 여백', '서울 성동구', '사진과 회화가 한 벽에 걸리는 2인전을 꾸준히 엽니다', '《도시 산책》 2인전 공모 · D-21', '', '#e6e3dc', '8af93d13a3a1f2fcb44163ec95b1c801'),
g('갤러리 서림', '경남 양산시', '숲 옆 한옥을 고친 전시장. 지역 작가와 함께합니다', '첫 개인전 지원 공모 · D-22', '', '#ebe7df', 'bd67b717bb50bfa46e11b66b66664861'),
g('새벽 갤러리', '인천 연수구', '퇴근길에 들르는 저녁 전시. 밤 9시까지 엽니다', '', '《작은 방, 긴 오후》 · 11.21까지', '#e3e4e1', '473ef02ac0500cad4204efcedcef5cbf')
] };
}
}
</script>
</body>
</html>
