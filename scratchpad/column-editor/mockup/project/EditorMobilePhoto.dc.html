<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>편집 화면 휴대폰 — 사진을 골랐을 때</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:"Pretendard";src:url(/_blob/a5e27b7076fe8e7685c78cdb4c8797b2) format("woff2");font-weight:100 900;font-display:swap}
body{margin:0}
a{color:#111827}a:hover{color:#c4302b}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
button{font-family:inherit;cursor:pointer}
.mb{display:inline-flex;align-items:center;justify-content:center;flex:none;min-width:44px;height:44px;padding:0 6px;border:0;border-radius:8px;background:transparent;color:#374151;font-size:16px;font-weight:600}
.pt{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;flex:1;min-width:0;height:56px;border:0;border-radius:8px;background:transparent;color:#374151;font-size:12px;font-weight:500}
.seg{flex:1;height:36px;border:0;border-radius:6px;background:transparent;color:#4b5563;font-size:13px;font-weight:500}
.seg.on{background:#111827;color:#fff}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #fff; color: #1f2937; font-family: Pretendard, system-ui, sans-serif; word-break: keep-all; overflow-wrap: anywhere; overflow: hidden">

  <header style="flex: none; height: 52px; display: flex; align-items: center; gap: 4px; padding: 0 8px 0 4px; border-bottom: 1px solid #e5e7eb">
    <button type="button" class="mb" aria-label="나가기"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 19-7-7 7-7M19 12H5"/></svg></button>
    <span style="font-size: 13px; color: #6b7280">저장 중…</span>
    <span style="flex: 1"></span>
    <button type="button" class="mb" style="font-size: 14px; font-weight: 500; padding: 0 10px">미리보기</button>
    <button type="button" style="height: 36px; padding: 0 16px; border: 0; border-radius: 6px; background: #111827; color: #fff; font-size: 14px; font-weight: 600">등록</button>
  </header>

  <main style="flex: 1; min-height: 0; overflow: hidden; padding: 20px 20px 0">
    <p style="margin: 0 0 1em; font-size: 16px; line-height: 1.85">삼 년 동안 그린 스무 점. <strong style="font-weight: 600; color: #111827">벽은 여덟 점이면 찬다.</strong></p>

    <!-- 고른 사진 -->
    <figure style="margin: 24px 0 20px">
      <div style="outline: 2px solid #111827; outline-offset: 3px">
        <img src="/_blob/fee07ee7d8e80c9300b526612aeaa989" alt="작업실 바닥에 늘어놓은 그림" style="display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover">
      </div>
      <figcaption style="margin-top: 12px">
        <label style="display: block">
          <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">사진 설명</span>
          <input type="text" value="작업실 바닥에 늘어놓은 날" style="box-sizing: border-box; width: 100%; height: 40px; padding: 0 8px; border: 0; border-bottom: 1px solid #d1d5db; border-radius: 0; background: transparent; font-family: inherit; font-size: 13px; text-align: center; color: #4b5563">
        </label>
      </figcaption>
    </figure>

    <!-- 올리는 중인 사진 -->
    <figure style="margin: 0 0 20px; position: relative">
      <img src="/_blob/c0cd6dbfeed7a444123b81adb442cfb6" alt="" style="display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; opacity: .45">
      <div style="position: absolute; left: 12px; right: 12px; bottom: 12px; display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: #fff; border: 1px solid #e5e7eb; border-radius: 8px">
        <span style="font-size: 12px; color: #374151; white-space: nowrap">올리는 중 62%</span>
        <span style="flex: 1; height: 3px; background: #e5e7eb; border-radius: 2px; overflow: hidden"><span style="display: block; width: 62%; height: 100%; background: #111827"></span></span>
      </div>
    </figure>
  </main>

  <!-- 사진 도구 — 사진을 고르면 서식 막대가 이걸로 바뀐다 -->
  <div style="flex: none; border-top: 1px solid #e5e7eb; background: #fff; padding: 10px 12px 14px">
    <div role="group" aria-label="사진 크기" style="display: flex; gap: 4px; padding: 3px; border: 1px solid #e5e7eb; border-radius: 8px">
      <button type="button" class="seg on" aria-pressed="true">본문 폭</button>
      <button type="button" class="seg">넓게</button>
      <button type="button" class="seg">화면 폭</button>
    </div>
    <div role="toolbar" aria-label="사진 도구" style="display: flex; gap: 2px; margin-top: 8px">
      <button type="button" class="pt"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 2v14a2 2 0 0 0 2 2h14M18 22V8a2 2 0 0 0-2-2H2"/></svg>자르기</button>
      <button type="button" class="pt"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 7-7 7 7M12 19V5"/></svg>위로</button>
      <button type="button" class="pt"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M19 12l-7 7-7-7"/></svg>아래로</button>
      <button type="button" class="pt"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>표지로</button>
      <button type="button" class="pt" style="color: #c4302b"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>삭제</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>

  renderVals() { return {}; }
}
</script>
</body>
</html>
