<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>작품 리스트</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 794px; height: 1123px; box-sizing: border-box; padding: 48px 56px 0; background: #ffffff; font-family: 'Noto Sans KR', system-ui, sans-serif; color: #111111; overflow: hidden">

<div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 24px">
<div>
<div style="font-size: 13px; color: #555555">2027 봄 기획전 《겹과 결》</div>
<h1 style="margin: 4px 0 0; font-size: 28px; line-height: 1.2; font-weight: 700">작품 리스트</h1>
</div>
<div style="text-align: right; font-size: 12.5px; line-height: 1.6; color: #555555">
<div style="color: #111111; font-weight: 500">아트링크 갤러리</div>
<div>전시 2027. 3. 20 – 4. 6</div>
<div>발행 2027. 4. 12.</div>
</div>
</div>

<div style="margin-top: 22px; border-top: 2px solid #111111; border-bottom: 1px solid #cfcfcf; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; padding: 10px 0 12px">
<div><div style="font-size: 12px; color: #555555">작가</div><div style="font-size: 17px; font-weight: 700">10명</div></div>
<div><div style="font-size: 12px; color: #555555">작품</div><div style="font-size: 17px; font-weight: 700">90점</div></div>
<div><div style="font-size: 12px; color: #555555">가격 합계</div><div style="font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums">46,270,000원</div></div>
<div><div style="font-size: 12px; color: #555555">비매</div><div style="font-size: 17px; font-weight: 700">1점</div></div>
</div>

<div style="margin-top: 18px; display: grid; grid-template-columns: 34px 52px minmax(0, 1fr) 168px 104px 44px 92px; column-gap: 10px; padding: 0 0 6px; border-bottom: 1px solid #111111; font-size: 12px; color: #555555">
<span>번호</span><span></span><span>작품명</span><span>재료</span><span>크기</span><span>연도</span><span style="text-align: right">가격</span>
</div>

<sc-for list="{{ groups }}" as="g" hint-placeholder-count="2">
<div>
<div style="display: flex; align-items: baseline; justify-content: space-between; padding: 14px 0 7px; border-bottom: 1px solid #cfcfcf">
<span style="font-size: 14px; font-weight: 700">{{ g.artist }}</span>
<span style="font-size: 12.5px; color: #555555; font-variant-numeric: tabular-nums">{{ g.meta }}</span>
</div>
<sc-for list="{{ g.works }}" as="w" hint-placeholder-count="6">
<div style="display: grid; grid-template-columns: 34px 52px minmax(0, 1fr) 168px 104px 44px 92px; column-gap: 10px; align-items: center; min-height: 48px; border-bottom: 1px solid #e6e6e6; font-size: 13px; line-height: 1.4">
<span style="color: #555555; font-variant-numeric: tabular-nums">{{ w.no }}</span>
<span style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center"><img src="{{ w.img }}" alt="" style="max-width: 40px; max-height: 40px; display: block"></span>
<span style="font-weight: 500; min-width: 0; overflow-wrap: anywhere">{{ w.title }}</span>
<span style="color: #333333; min-width: 0; overflow-wrap: anywhere">{{ w.medium }}</span>
<span style="color: #333333; font-variant-numeric: tabular-nums">{{ w.size }}</span>
<span style="color: #333333; font-variant-numeric: tabular-nums">{{ w.year }}</span>
<span style="text-align: right; font-variant-numeric: tabular-nums">{{ w.price }}</span>
</div>
</sc-for>
</div>
</sc-for>

<div style="position: absolute; left: 56px; right: 56px; bottom: 34px; display: flex; justify-content: space-between; font-size: 12px; color: #767676">
<span>작품 리스트 · 2027 봄 기획전 《겹과 결》</span>
<span style="font-variant-numeric: tabular-nums">1 / 6</span>
</div>
</div>
</x-dc>

</body>
</html>
