<div style="position: relative; width: 794px; height: 1123px; background: #ffffff; font-family: 'Noto Sans KR', system-ui, sans-serif; color: #111111; overflow: hidden">

<div style="position: absolute; left: 57px; top: 34px; width: 680px; height: 1040px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border-top: 1px solid #c4c4c4; border-left: 1px solid #c4c4c4; box-sizing: border-box">
<sc-for list="{{ labels }}" as="c" hint-placeholder-count="10">
<div style="height: 208px; box-sizing: border-box; border-right: 1px solid #c4c4c4; border-bottom: 1px solid #c4c4c4; padding: 22px 24px 16px; display: flex; flex-direction: column">
<sc-if value="{{ showArtist }}" hint-placeholder-val="{{ true }}">
<div style="font-size: 13px; font-weight: 500; letter-spacing: 0.02em; margin-bottom: 8px">{{ c.artist }}</div>
</sc-if>
<div style="font-size: 17px; line-height: 1.35; font-weight: 700; word-break: keep-all; overflow-wrap: anywhere">{{ c.title }}<span style="font-weight: 400">, {{ c.year }}</span></div>
<div style="margin-top: 8px; font-size: 13px; line-height: 1.5; color: #333333">{{ c.medium }}</div>
<div style="font-size: 13px; line-height: 1.5; color: #333333">{{ c.size }}</div>
<div style="flex-grow: 1"></div>
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 12px">
<span style="font-size: 12px; color: #767676; font-variant-numeric: tabular-nums"><sc-if value="{{ showNo }}" hint-placeholder-val="{{ true }}">No. {{ c.no }}</sc-if></span>
<span style="font-size: 14px; font-weight: 500; font-variant-numeric: tabular-nums"><sc-if value="{{ showPrice }}" hint-placeholder-val="{{ true }}">{{ c.price }}</sc-if></span>
</div>
</div>
